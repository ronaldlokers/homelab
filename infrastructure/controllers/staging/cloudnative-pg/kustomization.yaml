apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/cloudnative-pg

patches:
  - patch: |
      - op: replace
        path: /spec/chart/spec/version
        # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/charts/cloudnative-pg
        value: "0.29.0"
    target:
      kind: HelmRelease
      name: cloudnative-pg
