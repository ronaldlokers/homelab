---
# Retention is a disk-space decision as much as a recovery one: a Longhorn
# backup job keeps `retain` LOCAL snapshots as well as remote backups, and old
# snapshots pin blocks that the filesystem has long since freed.
#
# Measured 2026-08-04, across 120 snapshots holding 211.9Gi:
#
#   backup-monthly    18 snapshots   108.9Gi   <- largest consumer by far
#   snapshot-daily    58 snapshots    95.8Gi
#   backup-weekly     19 snapshots     2.7Gi
#   backup-daily      20 snapshots     1.9Gi
#
# Most of that is stale WAL. Until today both database clusters ran
# wal_keep_size: 8GB against replication slots that needed 0 bytes, so every
# snapshot captured ~8GB of WAL per instance that no standby ever read. Keeping
# twelve monthly copies of it pinned roughly a year of that on disk.
#
# The frequent jobs are cheap and stay as they are. The monthly one is the
# expensive one and is cut to a quarter of restore points: the databases have
# their own WAL-archived backups to B2 with PITR, so twelve months of
# volume-level monthly copies is belt-and-braces on the data that is already
# covered best.

apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  name: backup-daily
  task: backup
  cron: "0 2 * * *"
  retain: 7
  concurrency: 2
  groups:
    - default
---
# The photographs volume is backed up AFTER the database, and that order is the
# whole point of it having its own job.
#
# Squirrel writes a photograph to disk first and its row second. So whichever of
# the two is captured last decides which way a restored pair can be wrong:
#
#   volume, then database  ->  a row pointing at a file no backup holds
#   database, then volume  ->  a file nothing points at
#
# The second is invisible and harmless. The first is a note rendering a broken
# picture, which apps/base/squirrel/photos-pvc.yaml already names as the worse
# thing to find, and squirrel's own docs/running.md calls "the broken
# direction".
#
# On backup-daily this volume was taking the wrong one every night. That job
# runs 02:00 local, which is 00:00 UTC; postgres-cluster-daily-backup runs
# 03:00 UTC. Three hours of every night in which a photograph captured after
# midnight UTC had its row in the dump and its file in no backup at all.
#
# 06:00 local is 04:00 UTC, an hour clear of the dump. The two schedules are
# read in different zones — Longhorn's cron is local, CNPG's is UTC — so the
# gap is deliberately wide rather than tight.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-after-the-dump
  namespace: longhorn-system
spec:
  name: backup-after-the-dump
  task: backup
  cron: "0 6 * * *"
  retain: 7
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly
  namespace: longhorn-system
spec:
  name: backup-weekly
  task: backup
  # Saturday 22:00, not Sunday 03:00, and the hour is the whole point.
  #
  # Longhorn takes a per-volume lock in the backup store, and a backup that is
  # still running still holds it. Sunday was the only day both this and
  # backup-daily ran, one hour apart, and on the two largest volumes — the
  # Prometheus TSDB and a Postgres instance, 30Gi each — one hour is not
  # enough. From the logs of 2026-08-23, in UTC:
  #
  #   00:06  Start creating backup   pvc-fb5c1591 (prometheus)   <- backup-daily
  #   01:14  Start creating backup   pvc-fb5c1591 (prometheus)   <- this job
  #   01:14  backupstore volume contains locks [{name: lock-3427..., type: 1}]
  #   01:14  Failed to create backup: failed to acquire lock, please try again
  #
  # The daily was 68 minutes in and still holding the lock. This job lost the
  # race and the week's backup was skipped. It happened on 2026-08-09, -16 and
  # -23 — every Sunday in Loki's retained window, and no other day.
  #
  # Nothing was ever at risk: the daily chain kept its seven days throughout.
  # What was lost was the weekly generation for those volumes, silently apart
  # from an alert that pointed at the wrong runbook.
  #
  # Saturday 22:00 gives four hours of clearance to the next daily instead of
  # minus-ten, and stays clear of backup-monthly (04:00 on the 1st) and of
  # restore-drill at 05:00 on Sunday — which takes *restore* locks on the same
  # store, so moving this later into Sunday would only have traded one
  # collision for another.
  cron: "0 22 * * 6"
  retain: 4
  concurrency: 1
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-monthly
  namespace: longhorn-system
spec:
  name: backup-monthly
  task: backup
  cron: "0 4 1 * *"
  # Was 12. Held 108.9Gi of local snapshots — more than every other job
  # combined — to provide restore points that PostgreSQL's own B2 archive
  # already covers with PITR. Three months is ample for the app volumes where
  # this IS the only backup (tandoor, linkding, ntfy, pgadmin).
  retain: 3
  concurrency: 1
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-daily
  namespace: longhorn-system
spec:
  name: snapshot-daily
  task: snapshot
  cron: "0 1 * * *"
  # Was 3. These are local-only — no remote copy — so they buy fast rollback,
  # not disaster recovery, and each retained generation costs ~32Gi across the
  # cluster. Two still covers "yesterday was fine, today is not".
  retain: 2
  concurrency: 2
  groups:
    - default
