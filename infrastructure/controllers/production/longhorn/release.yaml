apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.8.2"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Default replica count for 3-node HA cluster
    defaultSettings:
      defaultReplicaCount: 3
      # Minimum 50% of replicas must be healthy
      replicaSoftAntiAffinity: false
      replicaAutoBalance: "least-effort"
      defaultDataPath: /mnt/longhorn
      backupTarget: "s3://longhorn-backups@us-east-1/"
      backupTargetCredentialSecret: "longhorn-s3-secret"
      # Volume engines do not follow the manager version unless this is > 0,
      # and it defaults to 0. The result was silent version drift: the manager
      # went to 1.8.2 in #133 while 95 volume references stayed on engine
      # v1.7.2, where they had been for 242 days across more than one manager
      # upgrade. default-engine-image was already v1.8.2, so only *new* volumes
      # picked it up and nothing surfaced the gap.
      #
      # That drift blocks the upgrade path. Longhorn supports live engine
      # upgrade to v1.9.2 only from v1.8.x, so raising the manager to 1.9.2
      # (PR #143) while engines sit on 1.7.2 leaves an offline upgrade —
      # detaching every volume — as the only way to reconcile them.
      #
      # 1 upgrades one engine per node at a time, on healthy volumes only, so
      # replicas rebuild sequentially rather than all at once. Longhorn skips
      # degraded volumes entirely, which is why the 19/19 healthy precondition
      # matters before this merges.
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
    # Configure default StorageClass with 3 replicas
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 3
    # Enable Prometheus metrics
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
    # Longhorn UI ingress
    ingress:
      enabled: true
      ingressClassName: traefik
      host: longhorn.ronaldlokers.nl
      tls: true
      tlsSecret: longhorn-tls
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-local-network-only@kubernetescrd
    # Resource limits for Raspberry Pi CM5
    longhornManager:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    longhornDriver:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    longhornUI:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
