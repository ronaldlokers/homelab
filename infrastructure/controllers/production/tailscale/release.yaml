apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.9"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # The operator device registers under this tag; the OAuth client owns
    # tag:k8s-prod (see the tailnet ACL policy). Keeping everything on one tag
    # avoids needing the client to own additional tags.
    operatorConfig:
      defaultTags:
        - "tag:k8s-prod"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  # OAuth client id/secret come from the SOPS-encrypted tailscale-oauth secret,
  # injected into Helm values at reconcile (never stored plaintext in the chart).
  valuesFrom:
    - kind: Secret
      name: tailscale-oauth
      valuesKey: client_id
      targetPath: oauth.clientId
    - kind: Secret
      name: tailscale-oauth
      valuesKey: client_secret
      targetPath: oauth.clientSecret
