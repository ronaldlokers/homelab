# Mirrors a Secret from one namespace into others, so a credential has a single
# source. Secrets are namespace-scoped, which is why every app kept its own
# SOPS copy of a database password — and why recreating a CNPG cluster
# desynchronised all of them silently (#268).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: reflector
spec:
  interval: 30m
  chart:
    spec:
      chart: reflector
      version: 10.0.65
      sourceRef:
        kind: HelmRepository
        name: reflector
        namespace: reflector
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
