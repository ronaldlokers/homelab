apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      # Inert: every overlay overrides this with its own version patch, so
      # this value is never rendered. Change the pin in
      # infrastructure/controllers/<env>/cloudnative-pg/kustomization.yaml.
      version: "0.23.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: cnpg-system
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # No database reconciles until the operator is running, and every app that
    # needs one crash-loops meanwhile. It outranks applications when capacity is
    # contended after a reboot.
    priorityClassName: homelab-infrastructure
