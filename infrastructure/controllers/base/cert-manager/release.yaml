apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      # Inert: every overlay overrides this with its own version patch, so
      # this value is never rendered. Change the pin in
      # infrastructure/controllers/<env>/cert-manager/kustomization.yaml.
      version: "v1.16.3"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    global:
      # Nothing that needs TLS can converge until cert-manager is up, so it
      # outranks applications when capacity is contended after a reboot.
      priorityClassName: homelab-infrastructure
      leaderElection:
        namespace: cert-manager
