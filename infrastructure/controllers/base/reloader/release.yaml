---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 30m
  chart:
    spec:
      chart: reloader
      version: 2.2.14
      sourceRef:
        kind: HelmRepository
        name: reloader
        namespace: reloader
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      # The default env-vars strategy injects a hash into the workload's pod
      # spec. Flux reconciles that field back to what git says and the restart
      # is undone — the same way it reverted a manual `kubectl rollout restart`
      # of ntfy. The annotations strategy writes to a pod-template annotation
      # Flux does not manage, so the two do not fight.
      reloadStrategy: annotations

      # Only roll workloads that opt in with reloader.stakater.com/auto.
      ignoreSecrets: false
      ignoreConfigMaps: false

      deployment:
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi

      podMonitor:
        enabled: false
