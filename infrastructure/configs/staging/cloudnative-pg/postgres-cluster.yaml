apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: database
spec:
  # Staging runs on a single-host k3d box: 1 instance is enough (no real node
  # HA to gain here). Production keeps 3 in its own overlay.
  instances: 1

  # Use DocumentDB-enabled PostgreSQL image for FerretDB v2.x (ARM64-compatible)
  imageName: 'ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0'

  # DocumentDB image uses UID/GID 999
  postgresUID: 999
  postgresGID: 999

  # Enable superuser access for extension management
  enableSuperuserAccess: true

  postgresql:
    # Load DocumentDB extensions
    shared_preload_libraries:
      - pg_cron
      - pg_documentdb_core
      - pg_documentdb
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      cron.database_name: 'postgres'
    # Allow password-less connections from within cluster
    pg_hba:
      # Was `host all app all trust`: any pod that could reach port 5432
      # authenticated as `app` against every database in the cluster, with no
      # credential. NetworkPolicy was the only boundary, and it is
      # namespace-granular rather than database-granular (#166).
      #
      # Every consumer was given this role's password first, while trust was
      # still in effect and therefore ignoring it, so this line is the only
      # thing that changes behaviour.
      - host all app all scram-sha-256
      # Deliberately left as trust. The streaming_replica role has NO PASSWORD
      # SET (verified in pg_authid), so requiring scram here would break
      # replication immediately. CNPG authenticates replicas with client
      # certificates over TLS, which makes this line redundant rather than
      # load-bearing, but removing it needs its own verified change.
      - host all streaming_replica all trust
      - host all postgres all md5

  # Initialize fresh cluster (recovery disabled temporarily after WAL cleanup)
  bootstrap:
    initdb:
      database: app
      owner: app
      # A fresh initdb DB has no extensions; on production these come from the
      # restore. FerretDB (nightscout) needs the DocumentDB extension, which
      # must live in the "postgres" DB (pg_cron is pinned there). postInitSQL
      # runs as superuser against the postgres DB at bootstrap; grant the app
      # user the documentdb role so FerretDB can use documentdb_api.
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS documentdb CASCADE;
        - GRANT documentdb_admin_role TO app;

  storage:
    size: 10Gi
    storageClass: local-path

  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      # Fresh timeline. The old "staging/" prefix accumulates WALs and trips
      # barman "Expected empty archive" on restart/failover/rebuild (a fresh
      # initdb cluster must archive into an empty prefix). Bump this date on
      # each staging rebuild, or purge the path.
      destinationPath: "s3://homelab-postgres-backups/staging-2026-07/"
      endpointURL: "https://s3.eu-central-003.backblazeb2.com"
      s3Credentials:
        accessKeyId:
          name: b2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: b2-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
        jobs: 2
