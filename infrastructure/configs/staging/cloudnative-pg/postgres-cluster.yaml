apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: database
spec:
  # Staging runs on a single-host k3d box: 1 instance is enough (no real node
  # HA to gain here). Production keeps 3 in its own overlay.
  instances: 1

  # Use DocumentDB-enabled PostgreSQL image for FerretDB v2.x (ARM64-compatible)
  imageName: 'ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0'

  # DocumentDB image uses UID/GID 999.
  #
  # Ranked above applications, below the operator that manages it: an app whose
  # database is down crash-loops and adds load while achieving nothing.
  #
  # Per-app roles: until #219 every app authenticated as the shared `app` role,
  # which owns every database, so any app that could read its own Secret held a
  # credential valid everywhere.
  managed:
    roles:
      - name: commafeed
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-commafeed
      # The staging pile. Squirrel creates its own schema — migrations are
      # embedded in the binary and applied at boot — so it must own its
      # database from the start, which means the role has to exist before the
      # Database claim can name it as owner.
      - name: squirrel
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-squirrel
      - name: linkding
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-linkding
      - name: tandoor
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-tandoor
      - name: gatus
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-gatus
      - name: nightscout
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-nightscout
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-authentik

  priorityClassName: homelab-database
  postgresUID: 999
  postgresGID: 999

  # Enable superuser access for extension management
  enableSuperuserAccess: true

  # Exports the #219 isolation invariant so drift is detectable. See
  # isolation-queries.yaml for why measuring it matters more than the
  # config being declarative.
  monitoring:
    customQueriesConfigMap:
      - name: cnpg-isolation-queries
        key: isolation.yaml

  postgresql:
    # pg_documentdb_core and pg_documentdb are gone — the extension moved with
    # Nightscout to its own cluster (#249). pg_cron stays: removing it needs a
    # postmaster restart and would leave cron.database_name dangling.
    shared_preload_libraries:
      - pg_cron
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      # Bounds how much WAL a replication slot may retain for a standby that has
      # fallen behind or gone away. Without a cap (-1, the default) a long-absent
      # standby grows its slot until the volume fills. Past this, the slot is
      # invalidated and CloudNativePG re-clones the replica from the archive:
      # slower than streaming, but a bounded failure instead of a full disk.
      max_slot_wal_keep_size: "4GB"
      cron.database_name: 'postgres'
    # Allow password-less connections from within cluster
    pg_hba:
      # Was `host all app all trust`: any pod reaching 5432 authenticated as `app`
      # against every database with no credential, leaving NetworkPolicy — which is
      # namespace-granular, not database-granular — as the only boundary (#166).
      - host all app all scram-sha-256
      # trust, not scram: streaming_replica has no password set, so scram would
      # break replication immediately. CNPG authenticates replicas with client
      # certificates over TLS.
      - host all streaming_replica all trust
      - host all postgres all md5

  # Initialize fresh cluster (recovery disabled temporarily after WAL cleanup)
  bootstrap:
    initdb:
      database: app
      owner: app
      # No postInitSQL. This used to create the DocumentDB extension here,
      # because FerretDB stored Nightscout's data in this cluster's `postgres`
      # database — the only database DocumentDB can live in, since it depends on
      # pg_cron and pg_cron installs only into cron.database_name.
      #
      # That is exactly why Nightscout could not be isolated per-database and
      # got its own cluster instead (#249). Since the cutover this cluster's
      # copy has been dead weight, and it was expensive dead weight: DocumentDB
      # schedules four pg_cron jobs, two of them every two seconds, and pg_cron
      # logs every run with no retention. cron.job_run_details had reached
      # 16,468,699 rows / 2,927 MB — the `postgres` database was 2969 MB, of
      # which 23 MB was the actual glucose data and the rest was the log of
      # maintenance jobs looking after it. After dropping the extension and
      # truncating that table: 17 MB.

  storage:
    size: 10Gi
    storageClass: local-path

  # Backups go through the Barman Cloud Plugin rather than the in-tree
  # barmanObjectStore, which CloudNativePG removes in 1.31 (#377). The
  # destination, prefix, credentials and retention move to
  # postgres-objectstore.yaml unchanged, so the existing catalogue continues
  # rather than restarting.
  #
  # isWALArchiver: true hands WAL archiving to the plugin. Only one component
  # may archive, so this is a cutover, not a parallel run — the two cannot be
  # configured at once.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-store
