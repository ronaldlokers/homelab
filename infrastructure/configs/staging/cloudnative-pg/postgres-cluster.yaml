apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: database
spec:
  # Staging runs on a single-host k3d box: 1 instance is enough (no real node
  # HA to gain here). Production keeps 3 in its own overlay.
  instances: 1

  # Use DocumentDB-enabled PostgreSQL image for FerretDB v2.x (ARM64-compatible)
  imageName: 'ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0'

  # DocumentDB image uses UID/GID 999
  # Applications are useless until this is serving, and an app whose database
  # is down crash-loops and adds load while achieving nothing. Ranked above
  # applications, below the operator that manages it.
  # Per-app roles. Until #219 every app authenticated as the shared `app` role,
  # which owns every database — so any app that could read its own Secret held a
  # credential valid against all of them. #166 stopped that being passwordless;
  # it did not make it isolated.
  #
  # Declaring a role here is inert. It exists, it can log in, and nothing uses it
  # until an application's connection string is switched over — which is
  # deliberately a separate step, so the roles can be created and verified
  # without any application noticing.
  #
  # Ownership of existing objects is NOT handled here, and neither is revoking
  # PUBLIC's CONNECT — which is the mechanism that actually permits
  # cross-database access. Both are per-database migrations rather than
  # declarative config: docs/runbooks/postgres-per-app-role-migration.md.
  #
  # Do NOT reach for `REASSIGN OWNED BY app TO <role>` there. It also covers
  # shared objects, and `app` owns every database in this cluster, so running it
  # inside one database hands all of them to that role. The runbook uses scoped
  # ALTER statements instead.
  managed:
    roles:
      - name: commafeed
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-commafeed
      - name: linkding
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-linkding
      - name: mealie
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-mealie
      - name: tandoor
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-tandoor
      - name: gatus
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-gatus
      - name: nightscout
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-nightscout

  priorityClassName: homelab-database
  postgresUID: 999
  postgresGID: 999

  # Enable superuser access for extension management
  enableSuperuserAccess: true

  # Exports the #219 isolation invariant so drift is detectable. See
  # isolation-queries.yaml for why measuring it matters more than the
  # config being declarative.
  monitoring:
    customQueriesConfigMap:
      - name: cnpg-isolation-queries
        key: isolation.yaml

  postgresql:
    # Load DocumentDB extensions
    shared_preload_libraries:
      - pg_cron
      - pg_documentdb_core
      - pg_documentdb
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      # Bounds how much WAL a replication slot may retain for a standby that has
      # fallen behind or gone away. Without a cap (-1, the default) a long-absent
      # standby grows its slot until the volume fills. Past this, the slot is
      # invalidated and CloudNativePG re-clones the replica from the archive:
      # slower than streaming, but a bounded failure instead of a full disk.
      max_slot_wal_keep_size: "4GB"
      cron.database_name: 'postgres'
    # Allow password-less connections from within cluster
    pg_hba:
      # Was `host all app all trust`: any pod that could reach port 5432
      # authenticated as `app` against every database in the cluster, with no
      # credential. NetworkPolicy was the only boundary, and it is
      # namespace-granular rather than database-granular (#166).
      #
      # Every consumer was given this role's password first, while trust was
      # still in effect and therefore ignoring it, so this line is the only
      # thing that changes behaviour.
      - host all app all scram-sha-256
      # Deliberately left as trust. The streaming_replica role has NO PASSWORD
      # SET (verified in pg_authid), so requiring scram here would break
      # replication immediately. CNPG authenticates replicas with client
      # certificates over TLS, which makes this line redundant rather than
      # load-bearing, but removing it needs its own verified change.
      - host all streaming_replica all trust
      - host all postgres all md5

  # Initialize fresh cluster (recovery disabled temporarily after WAL cleanup)
  bootstrap:
    initdb:
      database: app
      owner: app
      # A fresh initdb DB has no extensions; on production these come from the
      # restore. FerretDB (nightscout) needs the DocumentDB extension, which
      # must live in the "postgres" DB (pg_cron is pinned there). postInitSQL
      # runs as superuser against the postgres DB at bootstrap; grant the app
      # user the documentdb role so FerretDB can use documentdb_api.
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS documentdb CASCADE;
        - GRANT documentdb_admin_role TO app;

  storage:
    size: 10Gi
    storageClass: local-path

  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      # Fresh timeline. The old "staging/" prefix accumulates WALs and trips
      # barman "Expected empty archive" on restart/failover/rebuild (a fresh
      # initdb cluster must archive into an empty prefix). Bump this date on
      # each staging rebuild, or purge the path.
      destinationPath: "s3://homelab-postgres-backups/staging-2026-07/"
      endpointURL: "https://s3.eu-central-003.backblazeb2.com"
      s3Credentials:
        accessKeyId:
          name: b2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: b2-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
        jobs: 2
