apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-cluster
  namespace: database
spec:
  instances: 1

  # Use TensorChord's CloudNativePG image with VectorChord extension
  imageName: 'ghcr.io/tensorchord/cloudnative-vectorchord:17-0.4.3'

  # Enable superuser access for extension management
  enableSuperuserAccess: true

  postgresql:
    # Load VectorChord extension
    shared_preload_libraries:
      - vchord.so
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
    # Allow password-less connections from within cluster
    pg_hba:
      # Was `host all app all trust`: any pod that could reach port 5432
      # authenticated as `app` against every database in the cluster, with no
      # credential. NetworkPolicy was the only boundary, and it is
      # namespace-granular rather than database-granular (#166).
      #
      # Every consumer was given this role's password first, while trust was
      # still in effect and therefore ignoring it, so this line is the only
      # thing that changes behaviour.
      - host all app all scram-sha-256
      # Deliberately left as trust. The streaming_replica role has NO PASSWORD
      # SET (verified in pg_authid), so requiring scram here would break
      # replication immediately. CNPG authenticates replicas with client
      # certificates over TLS, which makes this line redundant rather than
      # load-bearing, but removing it needs its own verified change.
      - host all streaming_replica all trust
      - host all postgres all md5

  # Staging is disposable: initialize a fresh cluster, no restore.
  # (Production restores from backup; see immich-cluster.yaml there.)
  bootstrap:
    initdb:
      database: app
      owner: app
      # A fresh initdb DB has no extensions; on production these come from the
      # restore. Immich connects to the "immich" database (created by its
      # Database resource from template1), so seed the extensions into
      # template1 and the immich DB inherits them at creation time. Without
      # this, immich migrations can't build their schema on a rebuild.
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube;
        - CREATE EXTENSION IF NOT EXISTS earthdistance;

  storage:
    size: 20Gi
    storageClass: local-path

  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      # Archive to a fresh timeline. A brand-new (initdb) cluster must not
      # archive into a prefix that already holds another generation's WALs,
      # or barman-cloud-check-wal-archive fails with "Expected empty archive".
      # On a future staging rebuild, bump this date suffix (or purge the path).
      destinationPath: "s3://homelab-postgres-backups/staging-2026-07-immich/"
      endpointURL: "https://s3.eu-central-003.backblazeb2.com"
      s3Credentials:
        accessKeyId:
          name: b2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: b2-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
        jobs: 2
