---
# NOTE: CNPG ScheduledBackup cron has SIX fields (leading seconds).
# A five-field "0 2 * * *" means "minute 2 of every hour", not daily —
# that bug ran hourly backups for months.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-cluster-daily-backup
  namespace: database
spec:
  schedule: "0 0 2 * * *" # Daily at 2:00 AM
  backupOwnerReference: self
  cluster:
    name: postgres-cluster
  immediate: true # Take first backup immediately
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: nightscout-cluster-daily-backup
  namespace: database
spec:
  schedule: "0 45 2 * * *" # Daily at 2:45 AM (staggered after the others)
  backupOwnerReference: self
  cluster:
    name: nightscout-cluster
  immediate: true # Take first backup immediately
  # This cluster's backups go through the plugin (#377). Left unset, the
  # webhook defaults method to barmanObjectStore, which this cluster no longer
  # has — every nightly run then fails with "no barmanObjectStore section
  # defined on the target cluster", overnight and unwatched.
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
