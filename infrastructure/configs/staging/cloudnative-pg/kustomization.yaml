apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - role-secrets.yaml
  - ../../base/cloudnative-pg
  - namespace.yaml
  - b2-credentials-secret.yaml
  - postgres-cluster.yaml
  - nightscout-cluster.yaml
  # Immich is not deployed to staging (see apps/staging/kustomization.yaml),
  # so its dedicated PostgreSQL cluster is not created either. The file is kept
  # for when it is re-enabled.
  - scheduled-backup.yaml
  - commafeed-database.yaml
  - linkding-database.yaml
  - mealie-database.yaml
  - tandoor-database.yaml
