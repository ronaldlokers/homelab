apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: commafeed
  namespace: database
spec:
  cluster:
    name: postgres-cluster
  name: commafeed
  # Was `app`. A database's owner holds CONNECT implicitly, so revoking
  # PUBLIC's CONNECT achieves nothing while `app` still owns it (#219).
  owner: commafeed
