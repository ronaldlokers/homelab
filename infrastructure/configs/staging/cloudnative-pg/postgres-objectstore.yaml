# The plugin's replacement for spec.backup.barmanObjectStore, which
# CloudNativePG removes in 1.31 (#377). Same bucket, same prefix, same
# credentials — the plugin writes the barman layout the existing catalogue
# already uses, so the backup history carries over rather than restarting.
#
# serverName is left unset. The plugin keeps the field only for API
# compatibility with the in-tree configuration and requires it to stay empty;
# where a name is needed it is given as a plugin parameter on the Cluster,
# which defaults to the cluster name — what the in-tree configuration used.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-store
  namespace: database
spec:
  # Was spec.backup.retentionPolicy on the Cluster. Retention is enforced by
  # the plugin now, so leaving it behind would have meant no retention at all.
  retentionPolicy: "14d"
  configuration:
    # Fresh timeline. The old "staging/" prefix accumulates WALs and trips
    # barman "Expected empty archive" on restart/failover/rebuild (a fresh
    # initdb cluster must archive into an empty prefix). Bump this date on
    # each staging rebuild, or purge the path.
    destinationPath: "s3://homelab-postgres-backups/staging-2026-07/"
    endpointURL: "https://s3.eu-central-003.backblazeb2.com"
    s3Credentials:
      accessKeyId:
        name: b2-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: b2-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
      jobs: 2
