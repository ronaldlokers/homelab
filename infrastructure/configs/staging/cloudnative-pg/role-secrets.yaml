# Per-app PostgreSQL role credentials.
#
# Until #219 every app authenticated as the shared `app` role, which owns every
# database — so any app that could read its own Secret held a credential valid
# against all of them, including Nightscout's glucose store. #166 stopped that
# being passwordless; it did not make it isolated.
#
# CloudNativePG reads these via cluster.spec.managed.roles and reconciles the
# role's password to match. Creating a role is inert: nothing uses it until an
# app's connection string is switched over.
