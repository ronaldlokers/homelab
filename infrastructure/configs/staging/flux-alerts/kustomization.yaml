apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/flux-alerts
patches:
  # Staging posts into PRODUCTION's Campfire, through the bridge's LAN-only
  # ingress — staging has no Campfire of its own, and running a second one to
  # read two rooms would be worse than crossing the boundary here.
  #
  # This is the only cross-cluster dependency in the repo: if production is
  # down, staging's Flux alerts go nowhere. That is an acceptable direction to
  # fail, since production being down is the louder problem.
  #
  # The base address (production's in-cluster Service, unreachable from here) is
  # replaced rather than extended: a Provider has one address.
  - target:
      kind: Provider
      name: campfire
    patch: |
      - op: replace
        path: /spec/address
        value: "https://campfire-bridge.ronaldlokers.nl/flux"
  - target:
      kind: Alert
      name: flux-events
    patch: |
      # Both clusters share the #Flux room, so every event is labelled with its
      # origin. Without this a staging failure reads as a production one — the
      # exact confusion #384 separated the ntfy topics to avoid.
      - op: add
        path: /spec/eventMetadata
        value:
          cluster: staging
      - op: add
        path: /spec/eventSources/-
        value:
          kind: HelmRelease
          name: "*"
          namespace: kyverno
