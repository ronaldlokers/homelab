apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/network-policies
  - cert-manager
  - cloudnative-pg
  - flux-alerts
  - traefik-default-cert.yaml
  - traefik-https-redirect-middleware.yaml
patches:
  # Base network policies pin production control-plane IPs for API egress;
  # on staging (k3d) the API endpoint is the k3d server on the Docker network.
  - path: network-policies/allow-database-to-k8s-api-staging.yaml
  - path: network-policies/allow-monitoring-to-k8s-api-staging.yaml
