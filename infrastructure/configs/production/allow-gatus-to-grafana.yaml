# Let gatus health-check grafana.
#
# The check cannot go through the ingress: grafana's router carries the
# local-network-only middleware, which sees a pod address for an in-cluster
# prober and answers 403. So gatus talks to the pod directly, and this is the
# ingress half of that path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gatus-to-grafana
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
      ports:
        - protocol: TCP
          port: 3000
