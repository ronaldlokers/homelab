# Grafana's half of the OIDC exchange.
#
# The browser redirect needs nothing from this. Grafana itself calls the token
# and userinfo endpoints, server to server, against authentik's public URL.
#
# The destination is Traefik, not the address the hostname resolves to.
# kube-proxy rewrites the MetalLB VIP to a Traefik pod address before egress
# rules are evaluated, so a rule naming the VIP matches nothing and the
# connection is rejected (#293). Ports are Traefik's container ports: 8443
# backs 443.
#
# Production only. Staging's Grafana has no authentik client.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-oidc-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443
