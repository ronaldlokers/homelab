apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: database
spec:
  instances: 3

  # Requests but no limits: without requests these run BestEffort and are
  # evicted first, and a hard memory cap turns a slow query into an OOM kill.
  # Sized from measured usage (peak 507Mi) with headroom.
  resources:
    requests:
      cpu: 100m
      memory: 768Mi

  # Use DocumentDB-enabled PostgreSQL image for FerretDB v2.x (ARM64-compatible)
  imageName: "ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0"

  # DocumentDB image uses UID/GID 999.
  #
  # Ranked above applications, below the operator that manages it: an app whose
  # database is down crash-loops and adds load while achieving nothing.
  #
  # Per-app roles: until #219 every app authenticated as the shared `app` role,
  # which owns every database, so any app that could read its own Secret held a
  # credential valid everywhere.
  managed:
    roles:
      - name: commafeed
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-commafeed
      - name: linkding
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-linkding
      - name: mealie
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-mealie
      - name: tandoor
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-tandoor
      - name: gatus
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-gatus
      - name: nightscout
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-nightscout
      # Production only — speedtest-tracker does not run on staging, so this
      # role has no staging counterpart. #239 declared six roles from the
      # staging app list and missed it; production has seven consumers.
      - name: speedtest
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-speedtest
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-authentik

  priorityClassName: homelab-database
  postgresUID: 999
  postgresGID: 999

  # Enable superuser access for extension management
  enableSuperuserAccess: true

  # Exports the #219 isolation invariant so drift is detectable. See
  # isolation-queries.yaml for why measuring it matters more than the
  # config being declarative.
  monitoring:
    customQueriesConfigMap:
      - name: cnpg-isolation-queries
        key: isolation.yaml

  postgresql:
    # pg_documentdb_core and pg_documentdb are gone — the extension moved with
    # Nightscout to its own cluster (#249). pg_cron stays: removing it needs a
    # postmaster restart and would leave cron.database_name dangling.
    shared_preload_libraries:
      - pg_cron
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      cron.database_name: "postgres"
      # WAL retention by replication slot rather than a fixed wal_keep_size floor.
      # CNPG's HA slots retain exactly what each standby still needs; with both set
      # PostgreSQL keeps the larger of the two, so the floor only added disk.
      wal_keep_size: "512MB"
      # Bounds slot retention: past 4GB the slot is invalidated and CNPG re-clones
      # the replica from the archive. Slower than streaming, but not a full volume.
      max_slot_wal_keep_size: "4GB"
    # Allow password-less connections from within cluster
    pg_hba:
      # Was `host all app all trust`: any pod reaching 5432 authenticated as `app`
      # against every database with no credential, leaving NetworkPolicy — which is
      # namespace-granular, not database-granular — as the only boundary (#166).
      - host all app all scram-sha-256
      # trust, not scram: streaming_replica has no password set, so scram would
      # break replication immediately. CNPG authenticates replicas with client
      # certificates over TLS.
      - host all streaming_replica all trust
      - host all postgres all md5

  # Bootstrap recovery. Only takes effect when the Cluster object is CREATED, so
  # it is inert day to day and has to be correct at all times anyway — see
  # docs/war-stories/postgres-bootstrap-recovery.md. It was not: it recovered
  # from a stale prefix for months while reporting healthy (#238).
  bootstrap:
    recovery:
      source: clusterBackup

  # Names the same object store the cluster archives to, rather than repeating
  # its destination, so a recovered cluster continues the same timeline and the
  # two cannot be advanced independently — which is what #394 had to correct by
  # hand. immich-cluster keeps them separate.
  #
  # Moved off production-2026-03/ only after #392 put a base backup on the new
  # prefix — pointing recovery at an empty prefix would make a rebuild fail,
  # and a rebuild is exactly when nobody is watching. The old prefix still
  # holds history from March to 2026-08-08 and is retained as a manual restore
  # source until it ages past the 7d retention promise, then deleted per step 4
  # of the disaster-recovery runbook.
  #
  # serverName is explicit even though it equals the cluster name: it is what
  # the in-tree configuration recorded, and on the plugin it belongs here
  # rather than on the ObjectStore, whose own serverName must stay empty.
  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: postgres-store
          serverName: postgres-cluster

  storage:
    size: 30Gi
    storageClass: longhorn
    resizeInUseVolumes: true

  # Backups go through the Barman Cloud Plugin rather than the in-tree
  # barmanObjectStore, which CloudNativePG removes in 1.31 (#377). The
  # destination, prefix, credentials and retention move to
  # postgres-objectstore.yaml unchanged, so the existing catalogue — including
  # the base backups #392 and #394 put on this prefix — continues rather than
  # restarting.
  #
  # isWALArchiver: true hands WAL archiving to the plugin. Only one component
  # may archive, so this is a cutover, not a parallel run — the two cannot be
  # configured at once.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-store
