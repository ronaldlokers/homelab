apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: database
spec:
  instances: 3

  # Requests only, deliberately no limits. Without these the instances run
  # BestEffort and are the FIRST thing the kubelet evicts under node memory
  # pressure — ahead of every application, all of which do set requests. A
  # database holding the only copy of live data should not be the first
  # casualty of an unrelated memory spike.
  #
  # Sized from measured usage (peak 507Mi across instances) with headroom. No limits: a hard memory
  # cap on PostgreSQL turns a slow query into an OOM kill and a failover.
  resources:
    requests:
      cpu: 100m
      memory: 768Mi

  # Use DocumentDB-enabled PostgreSQL image for FerretDB v2.x (ARM64-compatible)
  imageName: "ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0"

  # DocumentDB image uses UID/GID 999
  # Applications are useless until this is serving, and an app whose database
  # is down crash-loops and adds load while achieving nothing. Ranked above
  # applications, below the operator that manages it.
  # Per-app roles. Until #219 every app authenticated as the shared `app` role,
  # which owns every database — so any app that could read its own Secret held a
  # credential valid against all of them. #166 stopped that being passwordless;
  # it did not make it isolated.
  #
  # Declaring a role here is inert. It exists, it can log in, and nothing uses it
  # until an application's connection string is switched over — which is
  # deliberately a separate step, so the roles can be created and verified
  # without any application noticing.
  #
  # Ownership of existing objects is NOT handled here, and neither is revoking
  # PUBLIC's CONNECT — which is the mechanism that actually permits
  # cross-database access. Both are per-database migrations rather than
  # declarative config: docs/runbooks/postgres-per-app-role-migration.md.
  #
  # Do NOT reach for `REASSIGN OWNED BY app TO <role>` there. It also covers
  # shared objects, and `app` owns every database in this cluster, so running it
  # inside one database hands all of them to that role. The runbook uses scoped
  # ALTER statements instead.
  managed:
    roles:
      - name: commafeed
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-commafeed
      - name: linkding
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-linkding
      - name: mealie
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-mealie
      - name: tandoor
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-tandoor
      - name: gatus
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-gatus
      - name: nightscout
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-nightscout
      # Production only — speedtest-tracker does not run on staging, so this
      # role has no staging counterpart. #239 declared six roles from the
      # staging app list and missed it; production has seven consumers.
      - name: speedtest
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-speedtest
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: pg-role-authentik

  priorityClassName: homelab-database
  postgresUID: 999
  postgresGID: 999

  # Enable superuser access for extension management
  enableSuperuserAccess: true

  # Exports the #219 isolation invariant so drift is detectable. See
  # isolation-queries.yaml for why measuring it matters more than the
  # config being declarative.
  monitoring:
    customQueriesConfigMap:
      - name: cnpg-isolation-queries
        key: isolation.yaml

  postgresql:
    # Load DocumentDB extensions
    # pg_documentdb_core and pg_documentdb are gone: the extension they back was
    # dropped from this cluster once Nightscout moved to its own (#249).
    #
    # pg_cron stays. It was only ever here for DocumentDB's four maintenance
    # jobs, all now unscheduled, so nothing uses it today — but removing it
    # means a postmaster restart AND leaves cron.database_name pointing at an
    # extension that no longer exists, and it costs nothing idle. Left for a
    # change that is about pg_cron rather than a side effect of this one.
    shared_preload_libraries:
      - pg_cron
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      cron.database_name: "postgres"
      # WAL retention. Was wal_keep_size: 8GB, which is the OLD mechanism: a fixed
      # floor of WAL kept on disk so a lagging standby can catch up by streaming
      # rather than fetching from the archive.
      #
      # CloudNativePG enables HA replication slots, which are the precise
      # replacement — a slot retains exactly what its standby still needs. With
      # both configured PostgreSQL keeps max(wal_keep_size, what the slots need),
      # and the slots were holding 0 bytes with both replicas streaming at 0 lag.
      # So the 8GB floor was protecting nothing and costing:
      #
      #   3 instances x 8.1G = 24.3G logical, x3 Longhorn replicas = 72.9G
      #
      # per cluster. Across immich-cluster and postgres-cluster that was 145.8G
      # of physical disk, out of 256.8G in use across all of Longhorn.
      #
      # 512MB is CloudNativePG's own default, which nightscout-cluster has always
      # run on without trouble.
      wal_keep_size: "512MB"
      # The other half, and the reason the 8GB floor felt necessary. Slots retain
      # WAL for as long as their standby needs it, and with no bound a standby
      # that stays down long enough will grow its slot until the volume fills.
      # This caps that: past 4GB the slot is invalidated and CloudNativePG
      # re-clones the replica from the archive instead. Slower than streaming,
      # but bounded — the failure mode becomes a rebuild rather than a full disk
      # on the primary.
      max_slot_wal_keep_size: "4GB"
    # Allow password-less connections from within cluster
    pg_hba:
      # Was `host all app all trust`: any pod that could reach port 5432
      # authenticated as `app` against every database in the cluster, with no
      # credential — including Nightscout's glucose store. NetworkPolicy was the
      # only boundary, and it is namespace-granular rather than
      # database-granular (#166).
      #
      # Every consumer was given this role's password first, while trust was
      # still in effect and therefore ignoring it, so this line is the only
      # thing that changes behaviour. Verified on staging before landing here:
      # passwordless connections are refused, apps reconnect on restart.
      - host all app all scram-sha-256
      # Deliberately left as trust. The streaming_replica role has NO PASSWORD
      # SET (verified in pg_authid on all four clusters), so requiring scram
      # here would break replication immediately. CNPG authenticates replicas
      # with client certificates over TLS, which makes this line redundant
      # rather than load-bearing, but removing it needs its own verified change.
      - host all streaming_replica all trust
      - host all postgres all md5

  # Bootstrap from existing backup to restore data.
  #
  # This block only takes effect when the Cluster object is CREATED — i.e. if
  # the cluster is deleted and Flux recreates it. That is exactly the scenario
  # docs/war-stories/postgres-bootstrap-recovery.md exists for, so it has to be
  # correct at all times even though it is inert day to day.
  #
  # It was not. Until now this recovered from "production/" with
  # recoveryTarget.backupID pinned to "20260226T105921", while WAL has archived
  # to "production-2026-03/" since 2026-03-05. A recreate would have restored a
  # February snapshot from a prefix nothing has written to in five months — and
  # reported Ready. No alert covers this because the config is valid and the
  # cluster is healthy; only an actual restore test would surface it.
  #
  # The pin is removed so recovery targets the latest available backup, and the
  # source now matches the prefix that is actually being written.
  bootstrap:
    recovery:
      source: clusterBackup

  # Reference to backup location in B2 (for bootstrap recovery only).
  #
  # NOTE: this now equals backup.barmanObjectStore.destinationPath below.
  # immich-cluster.yaml deliberately keeps recover-from and archive-to on
  # different prefixes so a recovered cluster starts a clean timeline. Doing the
  # same here means bumping the archive prefix to a new generation, which moves
  # the live WAL stream and leaves the new prefix without a base backup until
  # the next ScheduledBackup runs. That is a deliberate operational step, not a
  # side effect of fixing the stale pointer, so it is left for a follow-up —
  # see the runbook. Recovering into the same prefix is safe for a single
  # recovery; the constraint matters when recovering repeatedly.
  externalClusters:
    - name: clusterBackup
      barmanObjectStore:
        destinationPath: "s3://homelab-postgres-backups/production-2026-03/"
        serverName: postgres-cluster
        endpointURL: "https://s3.eu-central-003.backblazeb2.com"
        s3Credentials:
          accessKeyId:
            name: b2-credentials
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: b2-credentials
            key: ACCESS_SECRET_KEY
        wal:
          maxParallel: 8

  storage:
    size: 30Gi
    storageClass: longhorn
    resizeInUseVolumes: true

  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: "s3://homelab-postgres-backups/production-2026-03/"
      endpointURL: "https://s3.eu-central-003.backblazeb2.com"
      s3Credentials:
        accessKeyId:
          name: b2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: b2-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
        jobs: 2
