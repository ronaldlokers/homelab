apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnativepg-custom-alerts
  namespace: database
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: cloudnativepg
spec:
  groups:
    # #219's isolation is hand-run SQL with nothing reproducing or checking it,
    # and on 2026-08-05 it broke replication for four hours (#263).
    - name: postgres_isolation_alerts
      rules:
        # The exact failure of 2026-08-05: revoking PUBLIC's CONNECT on `postgres`
        # removed the only grant streaming_replica had, and it is not a superuser.
        # Invisible in pg_stat_activity because it only connects on replica rejoin.
        - alert: PostgreSQLReplicationRoleCannotConnect
          annotations:
            summary: "streaming_replica cannot connect to the postgres database on {{ $labels.pod }}"
            description: "CloudNativePG uses database=postgres for replica rejoin, and streaming_replica is not a superuser so it does not bypass CONNECT. Replication looks healthy until a replica restarts, then it cannot rejoin. Fix with: GRANT CONNECT ON DATABASE postgres TO streaming_replica;"
          expr: |
            cnpg_pg_database_access_replica_connect{datname="postgres"} == 0
          for: 5m
          labels:
            severity: critical
        # `app` and `nightscout` were excluded here as unused; both were revoked by
        # hand later (#296).
        - alert: PostgreSQLDatabaseNotIsolated
          annotations:
            summary: "PUBLIC can connect to database {{ $labels.datname }}"
            description: "Database {{ $labels.datname }} has lost the REVOKE that isolates it, so any role in the cluster can connect to it. This is the state #219 removed. A cluster rebuilt with initdb rather than restored from backup comes back this way. Fix with: REVOKE CONNECT ON DATABASE {{ $labels.datname }} FROM PUBLIC;"
          expr: |
            cnpg_pg_database_access_public_connect{datname!~"app|nightscout|postgres"} == 1
          for: 15m
          labels:
            severity: warning

    - name: postgres_archiving_alerts
      rules:
        # Fires when the most recent archive attempt failed. The previous expression
        # used a cumulative counter, which never returns to zero.
        - alert: PostgreSQLWALArchivingFailing
          annotations:
            summary: "PostgreSQL WAL archiving is failing on {{ $labels.pod }}"
            description: "The most recent WAL archive attempt on {{ $labels.pod }} failed more recently than the last success, so archiving is currently broken and PITR coverage is stalling. Check B2 connectivity to https://s3.eu-central-003.backblazeb2.com and verify credentials in the b2-credentials secret."
          expr: |
            cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
          for: 15m
          labels:
            severity: critical
            component: database

    - name: postgres_storage_alerts
      rules:
        # Alert when WAL directory is filling up (>70% of PVC)
        - alert: PostgreSQLWALDirectoryFilling
          annotations:
            summary: "PostgreSQL WAL directory is filling up on {{ $labels.pod }}"
            description: "WAL directory on {{ $labels.pod }} in cluster {{ $labels.cnpg_io_cluster }} is using more than 70% of available space. Current size may indicate archiving delays or failures."
          expr: |
            (cnpg_pg_wal_directory_size_bytes / (1024*1024*1024)) > 10
          for: 10m
          labels:
            severity: warning
            component: database

        # Replaces an alert whose expression tested collector liveness rather than
        # archiving, and fired unconditionally.
        - alert: CNPGMetricsCollectorFailing
          annotations:
            summary: "CloudNativePG metrics collector is erroring on {{ $labels.pod }}"
            description: "The CNPG exporter on {{ $labels.pod }} is failing to collect. While this is firing the archiver metrics are stale, so PostgreSQLWALArchivingFailing and the backup-age alerts cannot be trusted for this instance. Check the instance's postgres container logs."
          expr: |
            cnpg_collector_last_collection_error > 0
          for: 20m
          labels:
            severity: warning
            component: database

    - name: postgres_backup_alerts
      rules:
        # WAL archiving without a base backup means PITR is impossible;
        # firstRecoverabilityPoint stays empty. It happened to immich-cluster for four
        # months.
        - alert: PostgreSQLBackupTooOld
          annotations:
            summary: "Last base backup of {{ $labels.cnpg_io_cluster }} is older than 26 hours"
            description: "Cluster {{ $labels.cnpg_io_cluster }} has a daily ScheduledBackup but its newest base backup is older than 26h. Check the ScheduledBackup and recent Backup objects in the database namespace."
          # Matches both metric names. The Barman Cloud Plugin publishes
          # barman_cloud_cloudnative_pg_io_* and leaves the cnpg_collector_*
          # ones frozen at the last in-tree backup — marked Deprecated but
          # still exported — so a migrated cluster looks permanently stale on
          # the old name alone. max across both is right in every state: only
          # the old name exists before migration, only the new one advances
          # after, and if backups genuinely stop, neither advances (#377).
          expr: |
            (time() - max by (cnpg_io_cluster) ({__name__=~"cnpg_collector_last_available_backup_timestamp|barman_cloud_cloudnative_pg_io_last_available_backup_timestamp"}) > 26 * 3600)
            and
            (max by (cnpg_io_cluster) ({__name__=~"cnpg_collector_last_available_backup_timestamp|barman_cloud_cloudnative_pg_io_last_available_backup_timestamp"}) > 0)
          for: 30m
          labels:
            severity: critical
            component: database

        - alert: PostgreSQLBackupNeverTaken
          annotations:
            summary: "Cluster {{ $labels.cnpg_io_cluster }} has no base backup at all"
            description: "No base backup has ever completed for {{ $labels.cnpg_io_cluster }} — it is not recoverable from object storage regardless of WAL archiving. Create a ScheduledBackup (with immediate: true) for it."
          expr: |
            max by (cnpg_io_cluster) ({__name__=~"cnpg_collector_last_available_backup_timestamp|barman_cloud_cloudnative_pg_io_last_available_backup_timestamp"}) == 0
          for: 6h
          labels:
            severity: critical
            component: database
