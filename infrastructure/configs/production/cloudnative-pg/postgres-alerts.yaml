apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnativepg-custom-alerts
  namespace: database
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: cloudnativepg
spec:
  groups:
    - name: postgres_archiving_alerts
      rules:
        # Fires when the most recent archive attempt failed, i.e. archiving is
        # broken *now*.
        #
        # This previously used `cnpg_pg_stat_archiver_failed_count > 0`. That is
        # a cumulative counter since stats_reset, so a single transient failure
        # latches the alert on forever. It did exactly that: immich-cluster-2
        # recorded one failure, archiving recovered and kept succeeding, and the
        # alert stayed critical indefinitely with `increase(...[1h])` at 0.
        #
        # Comparing the two timestamps asks the right question — is the newest
        # failure more recent than the newest success? Note both metrics use -1
        # as their "never happened" sentinel rather than 0, which this handles
        # naturally: -1 never exceeds a real timestamp, and a cluster that has
        # failed but never succeeded (positive > -1) correctly fires.
        - alert: PostgreSQLWALArchivingFailing
          annotations:
            summary: "PostgreSQL WAL archiving is failing on {{ $labels.pod }}"
            description: "The most recent WAL archive attempt on {{ $labels.pod }} failed more recently than the last success, so archiving is currently broken and PITR coverage is stalling. Check B2 connectivity to https://s3.eu-central-003.backblazeb2.com and verify credentials in the b2-credentials secret."
          expr: |
            cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
          for: 15m
          labels:
            severity: critical
            component: database

    - name: postgres_storage_alerts
      rules:
        # Alert when WAL directory is filling up (>70% of PVC)
        - alert: PostgreSQLWALDirectoryFilling
          annotations:
            summary: "PostgreSQL WAL directory is filling up on {{ $labels.pod }}"
            description: "WAL directory on {{ $labels.pod }} in cluster {{ $labels.cnpg_io_cluster }} is using more than 70% of available space. Current size may indicate archiving delays or failures."
          expr: |
            (cnpg_pg_wal_directory_size_bytes / (1024*1024*1024)) > 10
          for: 10m
          labels:
            severity: warning
            component: database

        # Replaces PostgreSQLContinuousArchivingFailed, which fired
        # unconditionally and had nothing to do with archiving.
        #
        # Its expression was:
        #   cnpg_collector_up{...} == 1 unless cnpg_collector_last_collection_error{...} == 0
        #
        # `unless` is a set operation requiring identical label sets on both
        # sides. They do not match here, so nothing was ever excluded and all 6
        # instances fired permanently — while last_collection_error was 0 on
        # every one of them. Six standing criticals that could not respond to
        # the cluster's actual state, alongside a description warning about WAL
        # filling PVCs that no part of the expression measured.
        #
        # What it *should* have measured is kept below at warning severity,
        # because a failing collector blinds the archiving alerts above rather
        # than being an outage in itself.
        - alert: CNPGMetricsCollectorFailing
          annotations:
            summary: "CloudNativePG metrics collector is erroring on {{ $labels.pod }}"
            description: "The CNPG exporter on {{ $labels.pod }} is failing to collect. While this is firing the archiver metrics are stale, so PostgreSQLWALArchivingFailing and the backup-age alerts cannot be trusted for this instance. Check the instance's postgres container logs."
          expr: |
            cnpg_collector_last_collection_error > 0
          for: 20m
          labels:
            severity: warning
            component: database

    - name: postgres_backup_alerts
      rules:
        # WAL archiving without a base backup provides zero recoverability:
        # firstRecoverabilityPoint stays empty and PITR is impossible. This
        # happened silently to immich-cluster for 4 months — see
        # docs/war-stories/cnpg-invisible-backup-gap.md. Only the primary
        # reports a non-zero timestamp, hence max by cluster.
        - alert: PostgreSQLBackupTooOld
          annotations:
            summary: "Last base backup of {{ $labels.cnpg_io_cluster }} is older than 26 hours"
            description: "Cluster {{ $labels.cnpg_io_cluster }} has a daily ScheduledBackup but its newest base backup is older than 26h. Check the ScheduledBackup and recent Backup objects in the database namespace."
          expr: |
            (time() - max by (cnpg_io_cluster) (cnpg_collector_last_available_backup_timestamp) > 26 * 3600)
            and
            (max by (cnpg_io_cluster) (cnpg_collector_last_available_backup_timestamp) > 0)
          for: 30m
          labels:
            severity: critical
            component: database

        - alert: PostgreSQLBackupNeverTaken
          annotations:
            summary: "Cluster {{ $labels.cnpg_io_cluster }} has no base backup at all"
            description: "No base backup has ever completed for {{ $labels.cnpg_io_cluster }} — it is not recoverable from object storage regardless of WAL archiving. Create a ScheduledBackup (with immediate: true) for it."
          expr: |
            max by (cnpg_io_cluster) (cnpg_collector_last_available_backup_timestamp) == 0
          for: 6h
          labels:
            severity: critical
            component: database
