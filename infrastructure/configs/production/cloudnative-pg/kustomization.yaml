apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - role-secrets.yaml
  - ../../base/cloudnative-pg
  - namespace.yaml
  - b2-credentials-secret.yaml
  - postgres-cluster.yaml
  - nightscout-cluster.yaml
  - nightscout-documentdb-grants.yaml
  - immich-cluster.yaml
  - postgres-alerts.yaml
  - scheduled-backup.yaml
  - authentik-database.yaml
  - commafeed-database.yaml
  - gatus-database.yaml
  - linkding-database.yaml
  - mealie-database.yaml
  - speedtest-database.yaml
  - tandoor-database.yaml

# Let reflector mirror each role credential into the namespace that uses it, so
# the app reads the same object rather than a SOPS copy that can drift (#268).
# Applied as a patch: the Secrets are SOPS-encrypted and their MAC covers
# unencrypted values too, so editing their metadata in place breaks decryption.
patches:
  - target:
      kind: Secret
      name: pg-role-mealie
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: pg-role-mealie
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "mealie"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "mealie"
  - target:
      kind: Secret
      name: pg-role-commafeed
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: pg-role-commafeed
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "commafeed"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "commafeed"
  - target:
      kind: Secret
      name: pg-role-gatus
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: pg-role-gatus
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "gatus"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "gatus"
  - target:
      kind: Secret
      name: pg-role-linkding
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: pg-role-linkding
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "linkding"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "linkding"
  - target:
      kind: Secret
      name: pg-role-speedtest
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: pg-role-speedtest
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "speedtest"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "speedtest"
  - target:
      kind: Secret
      name: pg-role-tandoor
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: pg-role-tandoor
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "tandoor"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "tandoor"
