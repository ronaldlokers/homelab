apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-cluster
  namespace: database
spec:
  instances: 3

  # Use TensorChord's CloudNativePG image with VectorChord extension
  imageName: "ghcr.io/tensorchord/cloudnative-vectorchord:17-0.4.3"

  # Enable superuser access for extension management
  enableSuperuserAccess: true

  postgresql:
    # Load VectorChord extension
    shared_preload_libraries:
      - vchord.so
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      wal_keep_size: "8GB"
    # Allow password-less connections from within cluster
    pg_hba:
      - host all app all trust
      - host all streaming_replica all trust
      - host all postgres all md5

  # Restore from backup on (re)creation so an accidental delete/rebuild does
  # not lose the Immich database. Recovery reads the CURRENT generation's
  # archive; the live cluster archives to a NEW timeline (see backup below),
  # so recover-from and archive-to never share a WAL path.
  # On a real DR, re-point this source at the then-current archive prefix.
  bootstrap:
    recovery:
      source: clusterBackup

  # Recovery source: the generation currently receiving backups.
  externalClusters:
    - name: clusterBackup
      barmanObjectStore:
        destinationPath: "s3://homelab-postgres-backups/production-2026-03-immich/"
        serverName: immich-cluster
        endpointURL: "https://s3.eu-central-003.backblazeb2.com"
        s3Credentials:
          accessKeyId:
            name: b2-credentials
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: b2-credentials
            key: ACCESS_SECRET_KEY
        wal:
          maxParallel: 8

  storage:
    size: 50Gi
    storageClass: longhorn

  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      # Archive to a NEW timeline, distinct from the recovery source above, so
      # a recovered cluster starts a clean WAL history (avoids the
      # "Expected empty archive" collision). Bump this suffix on each DR.
      destinationPath: "s3://homelab-postgres-backups/production-2026-07-immich/"
      endpointURL: "https://s3.eu-central-003.backblazeb2.com"
      s3Credentials:
        accessKeyId:
          name: b2-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: b2-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
        jobs: 2
