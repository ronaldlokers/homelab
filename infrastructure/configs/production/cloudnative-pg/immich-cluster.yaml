apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-cluster
  namespace: database
spec:
  # Permission only, no auto-reflection. reflector requires the source to allow
  # it; which object is actually mirrored is declared on the target, in
  # apps/production/immich/postgres-credentials-mirror.yaml.
  #
  # This propagates to every Secret CNPG creates, including the superuser one —
  # harmless, because "allowed" alone copies nothing. Adding the auto-* pair
  # here instead mirrored the superuser credential into the app namespace.
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "immich"
  instances: 3
  # Applications are useless until this is serving, and an app whose database
  # is down crash-loops and adds load while achieving nothing. Ranked above
  # applications, below the operator that manages it.
  priorityClassName: homelab-database

  # Requests but no limits: without requests these run BestEffort and are
  # evicted first, and a hard memory cap turns a slow query into an OOM kill.
  resources:
    requests:
      cpu: 100m
      memory: 384Mi

  # Use TensorChord's CloudNativePG image with VectorChord extension
  imageName: "ghcr.io/tensorchord/cloudnative-vectorchord:17-0.4.3"

  # Enable superuser access for extension management
  enableSuperuserAccess: true

  postgresql:
    # Load VectorChord extension
    shared_preload_libraries:
      - vchord.so
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      # WAL retention by replication slot rather than a fixed wal_keep_size floor.
      # CNPG's HA slots retain exactly what each standby needs.
      wal_keep_size: "512MB"
      # Bounds slot retention: past this the slot is invalidated and CNPG re-clones
      # the replica from the archive rather than filling the volume.
      max_slot_wal_keep_size: "4GB"
    # Allow password-less connections from within cluster
    pg_hba:
      # Was `host all app all trust`: any pod reaching 5432 authenticated as `app`
      # against every database with no credential (#166).
      - host all app all scram-sha-256
      # trust, not scram: streaming_replica has no password set. CNPG authenticates
      # replicas with client certificates over TLS.
      - host all streaming_replica all trust
      - host all postgres all md5

  # Restore from backup on (re)creation, so an accidental rebuild does not lose
  # the database.
  #
  # Keeping recover-from one generation behind archive-to guarantees the
  # recovery source is the prefix that STOPPED receiving backups. #260 advanced
  # both by one and left this pointing at 2026-08-immich, whose newest base
  # backup is 2026-08-04 while 2026-09-immich had one from every night since —
  # a rebuild would have restored a four-day-old photo library and reported
  # Ready. That is #257 again, and #238 before it.
  #
  # So this points at the prefix currently receiving backups, as postgres-cluster
  # does. The clean-timeline requirement is satisfied at recovery time instead:
  # step 2 of the disaster-recovery runbook bumps archive-to to a NEW prefix as
  # part of performing the restore, which is the only moment the distinction
  # matters. A pointer that is correct only until the next rotation is not a
  # design, it is a countdown.
  bootstrap:
    recovery:
      source: clusterBackup

  # Names the same object store the cluster archives to rather than
  # respecifying it, so the two cannot drift apart the way #257 and #260 did.
  #
  # serverName is explicit even though it equals the cluster name: it is what
  # the in-tree configuration recorded, and on the plugin it belongs here
  # rather than on the ObjectStore, whose own serverName must stay empty.
  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: immich-store
          serverName: immich-cluster

  # 20Gi, down from 50Gi. CNPG refuses to shrink storage in place, so this only
  # takes effect by deleting the cluster and letting it restore — which is why
  # the recovery prefix above has to be right.
  storage:
    size: 20Gi
    storageClass: longhorn

  # Backups go through the Barman Cloud Plugin rather than the in-tree
  # barmanObjectStore, which CloudNativePG removes in 1.31 (#377). The
  # destination, prefix, credentials and retention move to
  # immich-objectstore.yaml unchanged, so the existing catalogue continues
  # rather than restarting.
  #
  # isWALArchiver: true hands WAL archiving to the plugin. Only one component
  # may archive, so this is a cutover, not a parallel run — the two cannot be
  # configured at once.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-store
