# The bots' own login, read-only in every database it can reach.
#
# The reading and security beats query CommaFeed's and authentik's tables. They
# could have used those apps' own roles, which already exist and are already
# encrypted here — and which can also DROP TABLE. A digest that counts unread
# articles has no business holding a credential that could delete them.
#
# CloudNativePG creates the role; it does not grant anything. The SELECT grants
# and the default privileges for future tables are applied by hand, once, and
# written down in docs/runbooks/read-only-role-for-bots.md.
