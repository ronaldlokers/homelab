# A PostgreSQL cluster for Nightscout alone.
#
# Nightscout talks MongoDB; FerretDB translates that onto PostgreSQL via the
# DocumentDB extension, which depends on pg_cron. pg_cron can only be installed
# in the single database named by `cron.database_name`, a cluster-wide
# postmaster setting — so DocumentDB lives in exactly one database per cluster.
# In the shared cluster that database was `postgres`, reachable by every role,
# which is the cross-database access #219 set out to remove.
#
# Single-tenant, so its `app` role is isolated by construction and there are no
# per-app roles here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nightscout-cluster
  namespace: database
spec:
  # Three, matching every other production cluster: survives one node failure.
  instances: 3

  # Applications are useless until this is serving, and an app whose database
  # is down crash-loops and adds load while achieving nothing. Ranked above
  # applications, below the operator that manages it.
  priorityClassName: homelab-database

  # Requests but no limits: without requests these run BestEffort and are
  # evicted first, and a hard memory cap turns a slow query into an OOM kill
  # and a failover. Sized from immich-cluster's measured shape.
  resources:
    requests:
      cpu: 100m
      memory: 384Mi

  # Same DocumentDB-enabled image the shared cluster runs, so the extension
  # version matches and the data can be moved across with pg_dump.
  imageName: "ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0"

  # DocumentDB image uses UID/GID 999
  postgresUID: 999
  postgresGID: 999

  # Enable superuser access for extension management
  enableSuperuserAccess: true

  postgresql:
    shared_preload_libraries:
      - pg_cron
      - pg_documentdb_core
      - pg_documentdb
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      # Caps WAL retained for an absent standby. Past this the slot is invalidated
      # and CNPG re-clones from the archive — bounded, unlike a full disk.
      max_slot_wal_keep_size: "4GB"
      # The database pg_cron keeps its metadata in, and therefore the only
      # database in this cluster that can hold the DocumentDB extension. Left at
      # the default so the extension lands where postInitSQL creates it.
      cron.database_name: "postgres"
      # Send DocumentDB's and pg_cron's own connections over the Unix socket. They
      # default to localhost, which is TCP, which hits `host all postgres all md5`
      # and needs a password nothing supplies — every DocumentDB maintenance job
      # then fails, along with cursor continuation and drop_collection.
      cron.host: "/controller/run"
      documentdb.localhost_connection_string: "host=/controller/run user=postgres"
    pg_hba:
      # Passwords required, as on the shared cluster (#166). There is only one
      # consumer here, but a cluster that trusts unauthenticated connections is
      # still one NetworkPolicy mistake away from being readable.
      - host all app all scram-sha-256
      # trust, not scram: streaming_replica has no password. CNPG authenticates
      # replicas with client certificates over TLS.
      - host all streaming_replica all trust
      - host all postgres all md5
      # DocumentDB connects over the socket as the calling role, not as postgres,
      # so plain peer auth rejects it. The pg_ident map below maps the server's OS
      # user onto app for socket connections only.
      - local all app peer map=documentdb

    # Lets `local all app peer map=documentdb` above resolve: OS user postgres —
    # which is what the server itself runs as — may connect as the app role over
    # the Unix socket. Nothing else matches this map.
    pg_ident:
      - documentdb postgres app

  # Recovery, not initdb. Inert day to day — bootstrap only applies at Cluster
  # creation — which is why a stale prefix here goes unnoticed (#238). This
  # prefix was verified by an actual restore on 2026-08-04: 22,306 entries,
  # create_collection and drop_collection both functional.
  #
  # NOTE: recover-from and archive-to are the same prefix, so a recovered
  # cluster continues the same WAL timeline. Safe once; the constraint bites
  # when recovering repeatedly.
  bootstrap:
    recovery:
      source: clusterBackup

  # Names the same object store the cluster archives to rather than
  # respecifying it, which is also what keeps the NOTE above true by
  # construction: one destination, named twice, cannot drift into two.
  #
  # serverName is explicit even though it equals the cluster name: it is what
  # the in-tree configuration recorded, and on the plugin it belongs here
  # rather than on the ObjectStore, whose own serverName must stay empty.
  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: nightscout-store
          serverName: nightscout-cluster

  storage:
    size: 10Gi
    storageClass: longhorn

  # Backups go through the Barman Cloud Plugin rather than the in-tree
  # barmanObjectStore, which CloudNativePG removes in 1.31 (#377). The
  # destination, prefix, credentials and retention move to
  # nightscout-objectstore.yaml unchanged, so the existing catalogue continues
  # rather than restarting.
  #
  # isWALArchiver: true hands WAL archiving to the plugin. Only one component
  # may archive, so this is a cutover, not a parallel run — the two cannot be
  # configured at once.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: nightscout-store

  backup:
    # Not the default prefer-standby. This began as the fix for #376, where a
    # replica could not read WAL archiving status and every backup stalled;
    # #383 has since granted CNPG's roles the access they were missing, so a
    # standby backup works again and this is no longer required.
    #
    # Kept deliberately. The grants live in a Job, and a rebuilt cluster gets
    # the extension's own ACLs back until that Job runs again — at which point
    # prefer-standby would silently stop backing up exactly as it did for three
    # nights. The primary is superuser and cannot fail this way. The cost is
    # backup I/O on the primary of a 10Gi database, which is worth less than
    # the failure mode.
    target: primary
