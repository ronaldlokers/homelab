# The workloads in this namespace that read the Kubernetes API:
#
#   campfire-status-bot   Kustomizations, HelmReleases, pods, CNPG Clusters,
#                         Certificates and Longhorn Volumes, to answer
#                         `@Kubernetes status` in the room.
#   campfire-notify-check exec into the Campfire pod, because Campfire has no
#                         API and its involvement settings are readable only
#                         from Rails.
#   campfire-kube-actor   the two cluster actions the responder is allowed to
#                         ask for, held apart from the process that reads logs.
#   campfire-backups-watch
#                         Longhorn volumes, backup volumes, backups and backup
#                         targets, plus the PersistentVolumeClaims that say
#                         which of those volumes anything still owns.
#
# Selected by name rather than by namespace: Campfire itself has no business
# talking to the API server, and it is the pod that renders attacker-supplied
# links.
#
# Egress policy is evaluated after DNAT, so the destination that matters is a
# control plane node on 6443. The ClusterIP is named as well because the
# pre-DNAT rule is what some CNIs match on — same pair as the database,
# monitoring and homepage namespaces, and the same reason gatus could not reach
# Traefik until its ports were corrected.
#
# In the production overlay, not base/network-policies, because campfire is a
# production-only app. The neighbouring allow-*-to-k8s-api files DO live in
# base, and copying them was the mistake: their namespaces (database,
# monitoring, homepage) exist in both clusters, so "production only in effect"
# there means the staging node IPs simply never match. A NetworkPolicy for a
# namespace that does not exist is not inert — the apply fails outright, which
# wedged staging's infrastructure-configs and, via dependsOn, its apps (#425).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-campfire-status-bot-to-k8s-api
  namespace: campfire
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - campfire-status-bot
          - campfire-notify-check
          - campfire-kube-actor
          - campfire-backups-watch
  policyTypes:
    - Egress
  egress:
    # The kubernetes Service ClusterIP.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
    # The control plane nodes behind it, which is where the packets actually
    # go. Production only in effect: campfire is not deployed to staging.
    - to:
        - ipBlock:
            cidr: 10.0.40.101/32
        - ipBlock:
            cidr: 10.0.40.102/32
        - ipBlock:
            cidr: 10.0.40.103/32
      ports:
        - protocol: TCP
          port: 6443
