apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/flux-alerts
patches:
  # No Provider patch here. Production runs the bridge, so the base address is
  # already correct for it; staging is the one that has to reach across. The
  # patch this replaced only existed because the base still pointed at ntfy.
  - target:
      kind: Alert
      name: flux-events
    patch: |
      # Both clusters post into the same #Flux room, so every event says which
      # one it came from. notification-controller merges eventMetadata into the
      # event's `metadata`, which the bridge renders as a prefix.
      - op: add
        path: /spec/eventMetadata
        value:
          cluster: production
      - op: add
        path: /spec/eventSources/-
        value:
          kind: HelmRelease
          name: "*"
          namespace: longhorn-system
      - op: add
        path: /spec/eventSources/-
        value:
          kind: HelmRelease
          name: "*"
          namespace: metallb-system
      # Production-only: the tailscale operator and its subnet router.
      # Undocumented anywhere and absent from alerting until now.
      - op: add
        path: /spec/eventSources/-
        value:
          kind: HelmRelease
          name: "*"
          namespace: tailscale
