apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ntfy-publisher-secret.yaml
  - ../../base/flux-alerts
patches:
  - target:
      kind: Provider
      name: ntfy
    patch: |
      # Production posts to the Campfire bridge, which renders the event as
      # HTML into the #Flux room. Staging keeps the ntfy address from the base:
      # it has no Campfire, and its noise is exactly what #384 separated out.
      #
      # Flux offers no body templating on a `generic` Provider — the ntfy
      # address above worked because ntfy itself templated the JSON via
      # ?tpl=yes. Campfire treats the body as the message, so raw Event JSON
      # would land in the room; the bridge exists to format it.
      #
      # secretRef is left in place: notification-controller merges an
      # Authorization header the bridge ignores, and keeping it means reverting
      # to ntfy is a one-line change rather than a re-plumbing.
      - op: replace
        path: /spec/address
        value: "http://campfire-alert-bridge.campfire.svc.cluster.local:8080/flux"
  - target:
      kind: Alert
      name: flux-errors
    patch: |
      # Both clusters post into the same #Flux room, so every event says which
      # one it came from. notification-controller merges eventMetadata into the
      # event's `metadata`, which the bridge renders as a prefix.
      - op: add
        path: /spec/eventMetadata
        value:
          cluster: production
      - op: add
        path: /spec/eventSources/-
        value:
          kind: HelmRelease
          name: "*"
          namespace: longhorn-system
      - op: add
        path: /spec/eventSources/-
        value:
          kind: HelmRelease
          name: "*"
          namespace: metallb-system
      # Production-only: the tailscale operator and its subnet router.
      # Undocumented anywhere and absent from alerting until now.
      - op: add
        path: /spec/eventSources/-
        value:
          kind: HelmRelease
          name: "*"
          namespace: tailscale
