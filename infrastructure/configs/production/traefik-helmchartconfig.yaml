# Makes Traefik see the real client address.
#
# k3s ships Traefik as a bundled HelmChart; a HelmChartConfig of the same name
# in kube-system is merged into it, which is the supported way to override the
# values without unmanaging the chart.
#
# ## Why
#
# The default externalTrafficPolicy is Cluster. MetalLB announces the VIP from
# one node (kube-srv-1), Traefik runs on another (kube-srv-3), so every request
# crosses nodes and kube-proxy masquerades it. Measured with traefik/whoami
# behind the ingress:
#
#   X-Forwarded-For: 10.42.0.0
#   X-Real-Ip:       10.42.0.0
#
# That is a flannel address, not the caller. So the local-network-only
# middleware (ipAllowList, sourceRange 10.0.0.0/16) never saw a real client
# address: it compared 10.42.0.0 against the LAN range, which does not match,
# and returned 403 to everyone. Prometheus, Longhorn and pgAdmin were not
# "protected" — they were unreachable, including from the LAN.
#
# Worse, it was not stable: had Traefik been scheduled onto the announcing node
# there would have been no masquerade, the real address would have arrived, and
# the same allowlist would suddenly have started admitting LAN clients. The
# behaviour depended on pod placement.
#
# Local keeps the packet on the node that received it, so the source address is
# preserved and the allowlist compares against the actual caller.
#
# ## Why a DaemonSet
#
# Under Local, only nodes with a ready Traefik endpoint attract traffic — MetalLB
# will not announce the VIP from a node that has none. With the single replica
# this cluster ran, the VIP would pin to that one node and a node failure would
# take all ingress down until the pod rescheduled and the announcement moved.
#
# A DaemonSet is the primitive that actually means "one per node", so every node
# can serve and every request is node-local.
#
# The first attempt used replicas: 3 with required podAntiAffinity, which
# deadlocked: the chart's Deployment rolls with maxSurge 1 / maxUnavailable 0, so
# it must place a fourth pod before retiring any of the three — and required
# anti-affinity leaves nowhere to put it.
#
#   FailedScheduling: 0/3 nodes are available: 3 node(s) didn't match pod
#   anti-affinity rules
#
# Traffic kept flowing on the old pods, but the rollout could never complete and
# no future Traefik upgrade would either. A DaemonSet has no surge to schedule
# and needs no anti-affinity, and it keeps holding if a node is ever added.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
    deployment:
      kind: DaemonSet
    # Traefik's read-only API, for homepage's widget. Passed as an argument
    # because `api.insecure` is Traefik's own setting, not a chart value — the
    # chart accepts and drops it silently.
    #
    # No auth on the API entrypoint, but 8080 is ClusterIP-only with no
    # Ingress.
    # Access logging, off by default in this chart. Turned on because a silent
    # ingress makes a silent app impossible to debug: squirrel's presence
    # webhook answers 204 and logs nothing, so "did Home Assistant's call even
    # arrive" had no answer short of querying production Postgres. That
    # question belongs here, once, for every app — not in each app's handler.
    #
    # Passed as arguments rather than chart values for the same reason
    # api.insecure is: the chart accepts and silently drops keys it does not
    # know, so a `logs.access` block that the pinned chart version happens not
    # to support would look applied and do nothing. A flag either works or
    # fails the pod loudly.
    #
    # headers.defaultmode=drop keeps request and response headers out of the
    # log entirely. Squirrel's presence route authenticates on
    # X-Squirrel-Token, and a near-miss credential in a log store is worse than
    # no log at all. Nothing here needs header values.
    #
    # Two things this does log that are worth knowing: the request path, and
    # the client IP. Campfire's bot API carries its key as a path segment, so
    # if a bot URL is ever fetched over campfire.ronaldlokers.nl rather than
    # the in-cluster Service, that key lands in this log. Nothing does that
    # today — Squirrel talks to Campfire over campfire.campfire.svc — but it
    # is one browser paste away, and the mitigation is to rotate the key
    # rather than to grep the log.
    additionalArguments:
      - "--api.insecure=true"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
    ports:
      traefik:
        expose:
          default: true
