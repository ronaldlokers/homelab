apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-ronaldlokers-nl
  namespace: kube-system
spec:
  secretName: wildcard-ronaldlokers-nl-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.ronaldlokers.nl"
    # Second wildcard for internal-only hosts (e.g. immich.private.ronaldlokers.nl).
    # Names under *.private.ronaldlokers.nl resolve to the VIP (private DNS
    # wildcard) and are never exposed publicly. Sharing one cert means Traefik's
    # default TLSStore serves valid TLS for these hosts with no per-namespace work.
    - "*.private.ronaldlokers.nl"
