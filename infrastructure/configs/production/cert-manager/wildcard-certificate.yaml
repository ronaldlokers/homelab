apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-ronaldlokers-nl
  namespace: kube-system
spec:
  secretName: wildcard-ronaldlokers-nl-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  # One wildcard is enough: every name under it resolves to the VIP and is only
  # reachable over LAN or tailnet. Traefik's default TLSStore serves this cert
  # for all of them with no per-namespace work.
  #
  # A second SAN, *.private.ronaldlokers.nl, was dropped in #536. It existed so
  # immich had an unproxied hostname for large uploads while
  # immich.ronaldlokers.nl went through Cloudflare Tunnel and its 100MB body
  # limit. The tunnel now publishes ntfy alone and refuses everything else at
  # the edge, so both names pointed at the same private path and the split had
  # nothing left to separate.
  dnsNames:
    - "*.ronaldlokers.nl"
