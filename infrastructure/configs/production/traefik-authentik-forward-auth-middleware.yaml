# Authentik decides who someone is, in front of an app that holds no session.
#
# The first forward-auth in this cluster. Everything else that uses authentik —
# linkding, immich, grafana, homepage — speaks OIDC itself and keeps its own
# session; this middleware is for a workload that deliberately does not. Traefik
# calls the embedded outpost on every request, the outpost answers 200 with the
# identity in a header or 302 to a login, and the app behind it compares one
# header to one configured value.
#
# `trustForwardHeader` is safe here and would not be everywhere: Traefik is the
# only thing that can reach these pods (each namespace's
# allow-ingress-from-traefik is the whole ingress rule), so the X-Forwarded-*
# headers it sets are the ones the outpost sees.
#
# `authResponseHeaders` is an allow-list, and it is the security boundary rather
# than a convenience: only what is named here is copied from the outpost's
# answer onto the request. A header the outpost did not set cannot survive,
# which is what stops a caller sending X-Authentik-Username themselves.
#
# The address is the *embedded* outpost inside authentik-server — there is no
# separate outpost Deployment, and adding one would be a second thing to keep
# upgraded in step with the server. The path is authentik's own; `/traefik` on
# the end is the variant that answers for forward-auth rather than for nginx.
#
# A protected host also has to route /outpost.goauthentik.io/ to this same
# service, or the login redirect has nowhere to come back to. Ingress backends
# are namespace-local, so that hop is an Ingress *in the authentik namespace*
# carrying the protected hostname — see apps/production/squirrel/ingress-outpost.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: kube-system
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-Authentik-Username
      - X-Authentik-Groups
      - X-Authentik-Email
      - X-Authentik-Name
      - X-Authentik-Uid
