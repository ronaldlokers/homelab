---
# Allow Prometheus to scrape metrics from system namespace pods
# This enables collection of cluster-level metrics from:
# - kube-system: kubelet, coredns, traefik, etc.
# - cnpg-system: CloudNative-PG operator
# - metallb-system: MetalLB speaker and controller
# - flux-system: Flux controllers
# - default: Kubernetes API server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-system-namespaces
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    # Allow Prometheus to scrape kube-system namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # Allow Prometheus to scrape cnpg-system namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # Allow Prometheus to scrape metallb-system namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: metallb-system
    # Allow Prometheus to scrape flux-system namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
    # Allow Prometheus to scrape default namespace (API server)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
    # Allow Prometheus to scrape longhorn-system namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: longhorn-system
    # Allow Prometheus to scrape cert-manager namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
    # Allow Prometheus to scrape node IPs directly for hostNetwork-bound
    # targets. namespaceSelector egress rules only match traffic to pod IPs,
    # so anything bound to the node's own IP is invisible to those rules
    # above: kubelet has no pod at all, and metallb-speaker runs with
    # hostNetwork: true, making its "pod IP" the node IP too. Node-exporter
    # (9100) already needed this same workaround; kubelet (10250) and
    # metallb-speaker (9120) need it too.
    #
    # 9120 replaces 7472/7473 here. MetalLB 0.16 dropped kube-rbac-proxy for
    # native TLS and moved metrics to HTTPS on 9120 — see the comment in
    # infrastructure/controllers/base/metallb/release.yaml. The chart-owned
    # ServiceMonitor followed that move, but this policy did not, so all three
    # speakers failed to scrape with "connection refused" while the port was
    # open and answering 401 from the node itself. The metallb-controller was
    # unaffected: it is an ordinary pod, so the namespaceSelector rule above
    # covers it, which is why only the speaker targets went down.
    #
    # 7472/7473 are removed rather than left in place: 0.16 states the old HTTP
    # endpoints "are no longer available", frr is disabled in the release, and
    # the speaker was confirmed listening only on *:9120 and 127.0.0.1:17472.
    - to:
        - ipBlock:
            cidr: 10.0.40.101/32
      ports:
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 10250
        - protocol: TCP
          port: 9120
    - to:
        - ipBlock:
            cidr: 10.0.40.102/32
      ports:
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 10250
        - protocol: TCP
          port: 9120
    - to:
        - ipBlock:
            cidr: 10.0.40.103/32
      ports:
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 10250
        - protocol: TCP
          port: 9120
