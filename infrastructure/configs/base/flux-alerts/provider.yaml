---
# Sends Flux events to the Campfire bridge, which renders each event as HTML
# into the #Flux room. Base targets the in-cluster Service; staging patches it
# to production's bridge over the LAN-only ingress, having no Campfire of its
# own.
#
# Named `ntfy` until 2026-08-11, and pointed at ntfy until 2026-08-03. Both
# clusters had patched the address away long before the rename, so the name
# described nothing: the generated Alertmanager receiver read
# `monitoring/ntfy-config/campfire`, which is where this was noticed. ntfy is
# still deployed and still used — by external services publishing into it, not
# by anything in the cluster.
#
# Flux offers no body templating on a `generic` Provider. The old ntfy address
# carried its formatting in the URL (?tpl=yes) because ntfy templated the JSON
# itself; Campfire treats the body as the message, so raw Event JSON would land
# in the room. That is what the bridge is for.
#
# No secretRef. It carried an ntfy Authorization header that the bridge never
# reads — it accepts any POST to /flux — so the only thing it achieved was
# handing an ntfy credential to a service that is not ntfy.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: campfire
  namespace: flux-system
spec:
  type: generic
  address: "http://campfire-alert-bridge.campfire.svc.cluster.local:8080/flux"
