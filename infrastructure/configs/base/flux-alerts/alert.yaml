---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-events
  namespace: flux-system
spec:
  providerRef:
    name: ntfy
  # `info` does not mean "info only" — the CRD is explicit: "If set to 'info'
  # no events will be filtered." So this one Alert carries both successful
  # reconciles and failures, and #Flux becomes a deploy log rather than a
  # problem channel. The bridge already distinguishes them, rendering error
  # with 🚨 and everything else with ℹ️.
  #
  # A second Alert at info severity would have been the obvious shape and is
  # unnecessary: it would duplicate the eventSources list below and need its
  # own eventMetadata patch in both overlays to stay distinguishable.
  #
  eventSeverity: info
  # Measured before this list existed: 9 messages in 2 minutes with nobody
  # touching anything — roughly 6,500 a day. Flux emits ReconciliationSucceeded
  # on every periodic reconcile, not only when a reconcile changes something,
  # so "info" on its own is a heartbeat rather than a deploy log.
  #
  # These three are the heartbeat. What survives is the part worth reading: a
  # Kustomization that actually applied a revision, a HelmRelease that upgraded
  # or was rolled back, and every error.
  exclusionList:
    - "^Reconciliation finished in"
    - "no changes since last reconciliation"
    - "^\\(combined from similar events\\): Reconciliation finished in"
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    # HelmRelease events are emitted in each release's namespace and
    # cross-namespace references must be listed explicitly — add an entry
    # here (or in the environment overlay) when adding a HelmRelease in a
    # new namespace.
    - kind: HelmRelease
      name: "*"
      namespace: cert-manager
    - kind: HelmRelease
      name: "*"
      namespace: cnpg-system
    - kind: HelmRelease
      name: "*"
      namespace: monitoring
    - kind: HelmRelease
      name: "*"
      namespace: immich
    # Deployed in both environments; was absent here, so a failed reloader
    # release notified nobody.
    - kind: HelmRelease
      name: "*"
      namespace: reloader
