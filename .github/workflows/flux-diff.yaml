name: Flux diff

# Renders the full Flux tree (Kustomizations + HelmReleases) for the PR and
# base branches with flate, then posts the rendered diff as a sticky PR
# comment per cluster.
#
# Note: flate's built-in changed-only diff (--base/--path-orig) does not
# attribute edits under apps/base/** to the consuming overlay Kustomizations
# (flate 0.4.x), so this workflow does a full-tree render of both refs and
# diffs the output instead.

on:
  pull_request:

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: flux-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flux-diff:
    runs-on: ubuntu-latest
    # Renders fetch chart sources over the network; a stalled connection must
    # fail the job quickly instead of blocking the PR for hours. retry.sh now
    # bounds each individual attempt, so this is only the backstop for the
    # worst case where every attempt of every render stalls (~14 min) rather
    # than the primary defence it used to be.
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        cluster: [staging, production]
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base

      # Renders pull the immich chart from ghcr.io on every run
      # (apps/base/immich/repository.yaml is an OCI HelmRepository). Anonymous
      # pulls share a low per-IP quota that GitHub-hosted runners routinely
      # exhaust, surfacing mid-render as `429 toomanyrequests`. Authenticating
      # lifts the quota; flate falls back to ~/.docker/config.json, which is
      # what this step writes.
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install flate
        uses: home-operations/flate/action@v0.4.12
        with:
          cache: true
          # The action defaults `base` to the repo's default branch, which
          # exports FLATE_BASE=main and flips every flate call into
          # changed-only mode. We render full-tree on purpose (see header),
          # and the shallow `pr` checkout has no main ref to resolve anyway.
          base: ""

      - name: Test PR tree
        run: pr/.github/scripts/retry.sh flate test all --no-progress --path pr/clusters/${{ matrix.cluster }}

      - name: Render both trees
        run: |
          pr/.github/scripts/retry.sh bash -c 'flate build all --no-progress --path pr/clusters/${{ matrix.cluster }} > render-pr.yaml'
          # A base branch that fails to render must not block the PR that
          # fixes it. flate still emits the render for everything that did
          # reconcile, so diff against that and flag it in the comment.
          if ! pr/.github/scripts/retry.sh bash -c 'flate build all --no-progress --path base/clusters/${{ matrix.cluster }} > render-base.yaml'; then
            echo "::warning::${{ matrix.cluster }}: base branch failed to render; diffing against its partial output"
            touch base-render-failed
          fi

      - name: Diff rendered output
        id: diff
        run: |
          set +e
          diff -u render-base.yaml render-pr.yaml > cluster.diff
          rc=$?
          set -e
          [ "$rc" -gt 1 ] && exit "$rc"
          echo "changed=$([ "$rc" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          {
            echo "### Flux diff — \`${{ matrix.cluster }}\`"
            if [ -f base-render-failed ]; then
              echo "> [!WARNING]"
              echo "> The base branch failed to render fully; this diff is against its partial output."
              echo
            fi
            if [ "$rc" -eq 1 ]; then
              echo '```diff'
              head -c 60000 cluster.diff
              echo '```'
              if [ "$(wc -c < cluster.diff)" -gt 60000 ]; then
                echo "_Diff truncated at 60 kB — full diff in the workflow logs._"
              fi
            else
              echo "No rendered changes."
            fi
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          cat cluster.diff

      - name: Comment on PR
        uses: mshick/add-pr-comment@v3
        with:
          message-id: flux-diff-${{ matrix.cluster }}
          message-path: comment.md

      # The gate job below needs the verdict from *both* matrix legs, and matrix
      # jobs cannot aggregate `outputs` (every leg writes the same key, last
      # writer wins). So each leg publishes its verdict as an artifact instead.
      - name: Publish change verdict
        env:
          CLUSTER: ${{ matrix.cluster }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          mkdir -p verdict
          {
            echo "changed=$CHANGED"
            echo "base_render_failed=$([ -f base-render-failed ] && echo true || echo false)"
          } > "verdict/$CLUSTER.txt"

      - name: Upload change verdict
        uses: actions/upload-artifact@v7
        with:
          name: flux-diff-verdict-${{ matrix.cluster }}
          path: verdict/
          retention-days: 1

  # A PR that edits Flux-managed files but renders no change on either cluster
  # is almost always a silent no-op: a patch whose target selector matches
  # nothing, a value nested under the wrong key, a field the chart ignores. Four
  # such bugs were written and caught by hand in a single session on 2026-08-01
  # (see #173). The rendered diff already made them visible — this converts
  # "someone remembered to read the comment" into a gate.
  require-rendered-diff:
    name: Require a rendered diff
    needs: flux-diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Download verdicts
        uses: actions/download-artifact@v8
        with:
          pattern: flux-diff-verdict-*
          merge-multiple: true
          path: verdicts

      - name: Require a rendered diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untrusted PR metadata is read through the API into shell variables
          # rather than interpolated into this script, so a crafted branch or
          # title cannot inject commands.
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Only these trees are rendered by Flux. A PR confined to CI, docs,
          # scripts or skills has no reason to produce a diff, so it is not
          # gated — that is the common case for repo-maintenance PRs.
          flux_touched=false
          while IFS= read -r f; do
            case "$f" in
              clusters/*|infrastructure/*|apps/*|monitoring/*) flux_touched=true; break ;;
            esac
          done < <(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')

          if [ "$flux_touched" = false ]; then
            echo "No Flux-managed files changed — a rendered diff is not expected."
            exit 0
          fi

          # Deliberate no-ops are legitimate: reformatting, comment-only edits
          # (kustomize strips comments), or a refactor that is provably inert.
          # They need the `no-op` label, which makes the claim explicit and
          # reviewable instead of silent.
          if gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name' | grep -qxF 'no-op'; then
            echo "Labelled 'no-op' — rendering no change is declared intentional."
            exit 0
          fi

          changed=false
          base_failed=false
          for v in verdicts/*.txt; do
            [ -e "$v" ] || continue
            if grep -qx 'changed=true' "$v"; then changed=true; fi
            if grep -qx 'base_render_failed=true' "$v"; then base_failed=true; fi
          done

          # A partial base render makes "no diff" meaningless — it may only look
          # empty because the base output is truncated. Warn, do not gate.
          if [ "$base_failed" = true ]; then
            echo "::warning::Base branch rendered only partially; the diff is unreliable, so this gate is not enforced."
            exit 0
          fi

          if [ "$changed" = true ]; then
            echo "Rendered diff present — the change reaches at least one cluster."
            exit 0
          fi

          echo "::error::This PR changes Flux-managed files but renders no change on staging or production."
          cat <<'MSG'

          Every manifest still renders exactly as it does on the base branch, so
          nothing this PR does would reach either cluster. That usually means:

            - a kustomize patch whose `target` matches no resource
            - a Helm value nested under the wrong key, or one the chart ignores
            - a file added but never listed in a kustomization's `resources`
            - an overlay edited that no Kustomization actually builds

          Check the "Flux diff" comments on this PR: both say "No rendered
          changes."

          If the no-op is intentional (comment-only edits, reformatting), add the
          `no-op` label to record that and this check will pass.
          MSG
          exit 1
