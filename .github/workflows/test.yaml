name: Test scripts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No dependencies on purpose. The scripts under test are standard-library
      # only because they run from a ConfigMap on a stock python:3.13-alpine,
      # and the tests inherit that constraint rather than pulling in a runner.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Europe/Amsterdam, and the two days a year that are 23 and 25 hours long,
      # decide which day the digest reports. A runner without the zone database
      # would silently fall back to UTC and the boundary tests would pass for
      # the wrong reason.
      - name: Check the timezone database is present
        run: python3 -c "from zoneinfo import ZoneInfo; ZoneInfo('Europe/Amsterdam')"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
