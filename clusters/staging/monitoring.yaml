apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m
  # kube-prometheus-stack is a large release; allow it time to become
  # healthy before dependents reconcile.
  timeout: 10m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/controllers/staging
  prune: true
  # Required now that monitoring/controllers/staging holds a SOPS-encrypted
  # Secret (grafana-admin). Without this the Kustomization applies the file
  # verbatim and the literal ENC[AES256_GCM,...] string is stored as the
  # value — Flux reports Ready, and the workload gets a password that is the
  # ciphertext. Production has always had this; staging had no encrypted
  # secret under monitoring/ until now, so the gap was invisible.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
