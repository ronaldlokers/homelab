apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "6.55.0"
      sourceRef:
        kind: HelmRepository
        name: loki
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  values:
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      ingester:
        chunk_encoding: snappy
      querier:
        # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
        max_concurrent: 4
      pattern_ingester:
        enabled: true
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
        retention_period: 7d
      compactor:
        retention_enabled: true
        delete_request_store: s3

    # Staging runs on a small single-host k3d box; a single Loki binary is
    # plenty and avoids the SimpleScalable HA topology (9 pods + big caches)
    # that cannot fit. Production keeps SimpleScalable in its own overlay.
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1

    # Zero out the scalable tiers so the chart does not create them.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    # The chunks cache defaults to ~9.6Gi memory request, larger than the
    # whole staging node; shrink both caches to fit.
    #
    # allocatedCPU was missed the first time and defaults to 500m *each*, so the
    # two memcached pods reserved 1000m — a quarter of the cluster's entire
    # schedulable CPU across both nodes — while measuring 2m and 3m of actual
    # use. Memory was similarly over-reserved: 614Mi and 307Mi of requests
    # against 38Mi and 22Mi in use.
    #
    # Sized from observed usage with generous headroom. These are caches for a
    # single-binary Loki holding a couple of days of staging logs; if a query
    # ever needs more, it gets a cache miss, not an outage.
    chunksCache:
      allocatedMemory: 128
      allocatedCPU: 50m
    resultsCache:
      allocatedMemory: 64
      allocatedCPU: 50m

    # The canary writes synthetic log lines continuously and reads them back to
    # measure the pipeline. That is two more pods plus a constant write/read
    # loop on a node with no CPU headroom, measuring a pipeline staging does not
    # depend on. Disabled rather than removed — flip back if staging ever needs
    # to prove log latency.
    lokiCanary:
      enabled: false

    # The chart's helm-test template hard-requires the canary ("Helm test
    # requires the Loki Canary to be enabled"), so the two have to move
    # together. Caught by flux-diff, which expands charts; validate.sh cannot
    # see this because kustomize build does not render HelmReleases.
    test:
      enabled: false

    # Enable minio for storage
    minio:
      enabled: true
      # Chart default requests 100m; observed usage is 5m serving a
      # single-binary Loki holding two days of staging logs.
      resources:
        requests:
          cpu: 25m
          memory: 128Mi

    gateway:
      service:
        type: ClusterIP
