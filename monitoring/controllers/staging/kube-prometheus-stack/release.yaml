apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.0.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    prometheus:
      prometheusSpec:
        # Staging runs on a 2-vCPU VM whose entire host CPU is an i3-7100U.
        # Prometheus was the single largest pod consumer at ~139m, essentially
        # all of it scrape work, and the API server had zero idle. Halving the
        # scrape rate and cutting retention to 2d costs nothing that staging is
        # actually used for — it is a soak environment, not a history store.
        scrapeInterval: 60s
        evaluationInterval: 60s
        retention: 2d
        # Without storageSpec the TSDB lives on an emptyDir, so every pod
        # restart discards it and the configured 10d retention never actually
        # holds. Staging carries ~122k active series; 10Gi covers 10d with
        # room to spare.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    grafana:
      adminPassword: ronald
      grafana.ini:
        server:
          root_url: https://grafana.staging.ronaldlokers.nl
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-staging
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd
        hosts:
          - grafana.staging.ronaldlokers.nl
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.staging.ronaldlokers.nl
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki-staging
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local:80
          isDefault: false
          editable: false
