apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.5.4"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  # Helm waits five minutes for a release to become ready and then calls it a
  # failure. On this box that is not enough, and the 88.2.0 -> 88.5.4 upgrade
  # proved it: Helm gave up on
  #
  #   timeout waiting for: [Deployment/monitoring/kube-prometheus-stack-grafana
  #   status: 'InProgress']
  #
  # while the Deployment was in fact still coming up. It reached 1/1 at 21:42
  # and stayed healthy — Grafana 13.2.0 plus two sidecars, pulled and started on
  # two vCPUs of an i3-7100U, simply takes longer than the default allows.
  #
  # The upgrade had therefore *succeeded* on the cluster while the HelmRelease
  # said it had failed, and nothing repaired that: no remediation.retries is
  # configured, so Flux marked the release stalled and stopped. Because
  # monitoring-controllers is a `wait: true` Kustomization, the stalled release
  # failed the whole Kustomization, which is what shows up as Flux errors on
  # every reconcile for as long as nobody forces it. That state lasted nine
  # hours.
  #
  # Twenty minutes rather than retries on purpose. Upgrade remediation rolls the
  # release back before retrying, and rolling kube-prometheus-stack backwards on
  # a slow node to fix a release that already applied cleanly is more churn than
  # the problem. The cost of a long timeout is only a slower signal on an
  # upgrade that is genuinely broken.
  #
  # Staging only. Production has the CPU and came up well inside the default.
  timeout: 20m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # Drop the highest-cardinality histogram buckets from the control-plane
    # scrapes. Measured on staging: 67,377 active series, of which these nine
    # metrics accounted for ~30,000 — 45% of everything Prometheus held.
    #
    #   7,030  apiserver_request_duration_seconds_bucket
    #   6,560  apiserver_request_body_size_bytes_bucket
    #   4,530  etcd_request_duration_seconds_bucket
    #   4,272  apiserver_request_sli_duration_seconds_bucket
    #   2,872  apiserver_response_sizes_bucket
    #   1,568  apiserver_watch_cache_read_wait_seconds_bucket
    #   1,287  apiserver_watch_events_sizes_bucket
    #   1,045  workqueue_queue_duration_seconds_bucket
    #   1,045  workqueue_work_duration_seconds_bucket
    #
    # Nothing here disables a scrape or a component. Only the per-bucket series
    # are dropped; _count and _sum survive, so rates and averages still work —
    # what is lost is the ability to compute latency percentiles for the API
    # server, which no dashboard or alert in this repo does.
    #
    # Staging only. Production has the headroom and keeps full histograms.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: "(apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_response_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_sizes_bucket|etcd_request_duration_seconds_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket)"
            action: drop
    prometheus:
      prometheusSpec:
        # Staging runs on a 2-vCPU VM whose entire host CPU is an i3-7100U.
        # Prometheus was the single largest pod consumer at ~139m, essentially
        # all of it scrape work, and the API server had zero idle. Halving the
        # scrape rate and cutting retention to 2d costs nothing that staging is
        # actually used for — it is a soak environment, not a history store.
        scrapeInterval: 60s
        evaluationInterval: 60s
        retention: 2d
        # Without storageSpec the TSDB lives on an emptyDir, so every pod
        # restart discards it and the configured 10d retention never actually
        # holds. Staging carries ~122k active series; 10Gi covers 10d with
        # room to spare.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    grafana:
      # Was a hardcoded `adminPassword` in cleartext here. Grafana proxies the
      # Loki datasource — 30 days of every pod log, node journal line and
      # Kubernetes event — so that one word was the only thing gating it.
      # Rotated, because the old value is in git history.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      grafana.ini:
        server:
          root_url: https://grafana.staging.ronaldlokers.nl
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd
        hosts:
          - grafana.staging.ronaldlokers.nl
        # No secretName and no issuer annotation: traefik's default TLSStore
        # serves the *.staging.ronaldlokers.nl wildcard, which every other
        # application here relies on.
        #
        # This asked cert-manager for a certificate of its own from
        # letsencrypt-staging, whose root nothing trusts. It stayed valid and
        # Ready, so nothing reported a problem — the certificate was fine, its
        # issuer was not, and browsers and server-to-server calls both refused
        # it. That is the same untrusted root that broke the first authentik
        # login attempt.
        tls:
          - hosts:
              - grafana.staging.ronaldlokers.nl
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki-staging
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local:80
          isDefault: false
          editable: false
