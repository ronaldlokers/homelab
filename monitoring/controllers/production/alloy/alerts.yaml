apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alloy-node-log-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: alloy
spec:
  groups:
    - name: etcd_storage_latency
      rules:
        # The alert that would have caught the etcd-on-eMMC problem. etcd never
        # went down, it only got slow, so nothing existing fired for months.
        # See docs/war-stories/etcd-emmc-storage-latency.md.
        #
        # Counter is produced by loki.process.journal_metrics in config.alloy.
        # Alloy prefixes custom metrics with loki_process_custom_ and appends
        # _total, so the configured name "k3s_etcd_apply_slow" is exposed as
        # loki_process_custom_k3s_etcd_apply_slow_total.
        - alert: EtcdApplyLatencyHigh
          annotations:
            summary: "etcd apply latency is degraded on {{ $labels.node }}"
            description: >-
              {{ $labels.node }} is logging {{ printf "%.2f" $value }} etcd
              "apply request took too long" warnings/sec. etcd is exceeding its
              100ms expected-duration. Baseline before the NVMe migration was
              ~0.45-0.58/sec per node; healthy is 0. Check that etcd is still
              on NVMe — `sudo findmnt /var/lib/rancher/k3s/server/db/etcd`
              should show /dev/nvme0n1p1. See
              docs/runbooks/etcd-migrate-to-nvme.md.
          expr: |
            sum by (node) (rate(loki_process_custom_k3s_etcd_apply_slow_total[5m])) > 0.1
          for: 15m
          labels:
            severity: warning

    - name: alloy_collection_health
      rules:
        # Detects the failure mode that hid the above for months: collection
        # silently stops while every component still reports healthy. This
        # happened twice in one session — first tailing a nonexistent
        # /var/log/syslog, then reading an empty /var/log/journal — and in both
        # cases the only symptom was this counter sitting at zero.
        #
        # These nodes always log something, so a flat counter means collection
        # is broken, not that the nodes went quiet.
        - alert: AlloyJournalCollectionStalled
          annotations:
            summary: "Alloy has stopped reading the journal on {{ $labels.pod }}"
            description: >-
              No new journal lines read for 30 minutes. Node logs are not
              reaching Loki. Component health is NOT a useful check here — it
              reports "journal tailer is running" in this state. Check
              loki_source_journal_target_lines_total directly, and confirm
              /run/log/journal is still mounted into the pod.
          expr: |
            rate(loki_source_journal_target_lines_total[15m]) == 0
          for: 30m
          labels:
            severity: warning

        # Catches the other end of the pipeline: Alloy reads fine but Loki
        # rejects the writes. Observed during the migration when a 12h journal
        # backfill collided with Loki's out-of-order window and every batch was
        # dropped with a 400.
        - alert: AlloyLogWriteFailures
          annotations:
            summary: "Alloy is failing to write logs to Loki"
            description: >-
              {{ $labels.pod }} is dropping log entries on write. Check the
              Alloy pod logs for the rejection reason — "entry too far behind"
              means Loki's out-of-order window rejected them, which is expected
              briefly after a restart backfill but not on an ongoing basis.
          expr: |
            sum by (pod) (rate(loki_write_dropped_entries_total[10m])) > 0
          for: 15m
          labels:
            severity: warning
