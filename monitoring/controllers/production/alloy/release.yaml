apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: "1.11.0"
      sourceRef:
        kind: HelmRepository
        name: alloy
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  values:
    alloy:
      clustering:
        enabled: true
      configMap:
        create: false
        name: alloy-config
        key: config.alloy
      mounts:
        # loki.source.journal in config.alloy reads the host journal. Without
        # these the DaemonSet mounts only the config, which is why the previous
        # /var/log/syslog target could never have worked.
        varlog: true
        extra:
          # The live journal is here, not under /var/log. journald runs volatile
          # on these nodes: /var/log/journal exists but is empty, and the real
          # files are /run/log/journal/<machine-id>/*.journal on tmpfs. Mounting
          # only /var/log yields a healthy component reading an empty directory.
          - name: runlog-journal
            mountPath: /run/log/journal
            readOnly: true
          # sdjournal resolves boot IDs against the host machine-id; without it
          # journal reads fail rather than silently degrade.
          - name: machine-id
            mountPath: /etc/machine-id
            readOnly: true
    controller:
      type: "daemonset"
      volumes:
        extra:
          - name: runlog-journal
            hostPath:
              path: /run/log/journal
              type: Directory
          - name: machine-id
            hostPath:
              path: /etc/machine-id
              type: File
    serviceAccount:
      create: true
