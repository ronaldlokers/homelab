# Grafana admin credentials.
#
# These previously lived as a hardcoded cleartext password in release.yaml, in
# both environments, on a host reachable from the internet — and Grafana proxies
# the Loki datasource, so that single value gated 30 days of every pod log, node
# journal line and Kubernetes event.
#
# The old value is in git history, so this is a NEW password rather than the
# same one encrypted. Retrieve it with:
#   kubectl get secret grafana-admin -n monitoring \
#     -o jsonpath='{.data.admin-password}' | base64 -d
