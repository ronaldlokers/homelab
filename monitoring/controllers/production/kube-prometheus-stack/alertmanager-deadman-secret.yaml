# The healthchecks.io ping URL Alertmanager POSTs to every 15 minutes while
# Watchdog is firing, which is always. The check alerts when the pings stop.
#
# The URL is the whole credential: anyone holding it can ping the check and
# make a dead cluster look alive. There is no second factor and no account
# scoping — regenerate it in healthchecks.io if it leaks.
#
# Referenced by the `deadman` receiver in alertmanager-config.yaml via
# urlSecret. Deleting this secret does not merely disable the deadman:
# prometheus-operator skips an AlertmanagerConfig whose secret it cannot
# resolve, and that config is what delivers every alert to Campfire.
apiVersion: v1
kind: Secret
metadata:
    name: alertmanager-deadman
    namespace: monitoring
type: Opaque
stringData:
    url: ENC[AES256_GCM,data:Jmg/+FpmAMpijGjyKKbF+xyA/vEnV7mFamTzs1Ib3HwzwVYyO+EgSUDf49N2EWPLN5Y308SL2wo=,iv:HjUQp1E2cw1YuLSX8mMC4YcrYqnOVN26FHMha3wmQZQ=,tag:Wue5uZuCZhRf6TSlXbXKnw==,type:str]
