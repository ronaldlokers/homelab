apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.0.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # Disable etcd monitoring - K3s uses embedded etcd without exposed metrics
    kubeEtcd:
      enabled: false

    # K3s runs the controller-manager, scheduler and kube-proxy inside the
    # server process rather than as separately scrapeable components, so the
    # jobs these expect never exist. Their alerts are absent(up{job="..."}),
    # which is unconditionally true here — KubeControllerManagerDown,
    # KubeSchedulerDown and KubeProxyDown were three standing criticals that
    # could never clear and never indicated anything.
    #
    # Same reasoning as kubeEtcd above. Both halves are required: the component
    # toggle stops a ServiceMonitor being created for an endpoint that does not
    # exist, and the defaultRules toggle removes the absent() alert that fires
    # regardless of whether a target was ever configured.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    defaultRules:
      rules:
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeProxy: false
      disabled:
        # Replaced by a time-bounded copy in job-alerts.yaml. The stock rule is
        # kube_job_failed > 0 with no upper bound on age, and CronJobs keep
        # their most recent failed Job by design (failedJobsHistoryLimit), so
        # any single failure fires this alert permanently until someone deletes
        # the Job object by hand.
        #
        # It was firing on a renovate Job that failed once 15 days ago and on a
        # longhorn backup Job from 160 days ago. Both had long since recovered —
        # renovate completed hourly throughout, and longhorn backups ran nightly.
        # Two permanent alerts describing nothing, in a channel where that
        # trains people to ignore the channel.
        KubeJobFailed: true

    alertmanager:
      alertmanagerSpec:
        # Small and steady; requests keep it off the BestEffort eviction list.
        resources:
          requests:
            cpu: 25m
            memory: 128Mi

        # Without this, NOTHING outside the monitoring namespace is ever
        # delivered. prometheus-operator scopes each AlertmanagerConfig CRD to
        # its own namespace by default (OnNamespace), so the ntfy-config in
        # monitoring/ was rendered with a `namespace="monitoring"` matcher.
        # Alertmanager's top-level route falls through to receiver "null", so
        # every alert that did not carry that label was silently discarded:
        #
        #   PostgreSQLWALArchivingFailing   namespace=database        -> dropped
        #   PostgreSQLContinuousArchiving   namespace=database        -> dropped
        #   KubeJobFailed                   namespace=renovate        -> dropped
        #   TargetDown                      namespace=metallb-system  -> dropped
        #
        # That is why a genuine KubeJobFailed fired unread for 15 days and why
        # seven PostgreSQL criticals went unnoticed — not alert fatigue, which
        # is what the cleanup in #145 assumed. They never arrived.
        #
        # "None" drops the injected namespace matcher so the single ntfy route
        # receives every alert, which is what a one-operator cluster wants.
        alertmanagerConfigMatcherStrategy:
          type: None

    prometheus:
      prometheusSpec:
        # Measured 183m CPU / 1730Mi memory. Without requests Prometheus runs
        # BestEffort and is evicted first under node pressure — losing
        # observability exactly when something is going wrong. Requests only,
        # no limits: a memory cap on Prometheus turns a heavy query into an OOM
        # restart, which discards the WAL and is worse than the query being slow.
        resources:
          requests:
            cpu: 200m
            memory: 2Gi

        # Without storageSpec the TSDB lives on an emptyDir, so every pod
        # restart discards it and the configured 10d retention never actually
        # holds. Production carries ~353k active series at ~11.8k samples/sec,
        # which is roughly 17GB over 10d; 30Gi leaves headroom for growth and
        # compaction. Longhorn keeps 3 replicas, so this is ~90Gi of real disk.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 30Gi

        # Allow ServiceMonitors from any namespace
        serviceMonitorNamespaceSelector: {}

        # Allow ANY ServiceMonitor (ignore Helm 'release=' label)
        serviceMonitorSelectorNilUsesHelmValues: false

        # Accept ALL ServiceMonitors (empty selector)
        serviceMonitorSelector: {}

        # Allow PodMonitors from any namespace
        podMonitorNamespaceSelector: {}

        # Allow ANY PodMonitor (ignore Helm 'release=' label)
        podMonitorSelectorNilUsesHelmValues: false

        # Accept ALL PodMonitors (empty selector)
        podMonitorSelector: {}

        # Add cluster label to all metrics for dashboard compatibility
        externalLabels:
          cluster: production

        useEndpointSlices: true

      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-local-network-only@kubernetescrd
        hosts:
          - prometheus.ronaldlokers.nl
        tls:
          - hosts:
              - prometheus.ronaldlokers.nl
    grafana:
      # Measured 13m CPU / 467Mi memory.
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
      # Was a hardcoded `adminPassword` in cleartext here. Grafana proxies the
      # Loki datasource — 30 days of every pod log, node journal line and
      # Kubernetes event — so that one word was the only thing gating it.
      # Rotated, because the old value is in git history.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # Client id and secret come from the grafana-oidc Secret via $__env{},
      # so they never appear in the rendered HelmRelease.
      envFromSecret: grafana-oidc
      grafana.ini:
        server:
          root_url: https://grafana.ronaldlokers.nl
        auth.generic_oauth:
          enabled: true
          name: authentik
          client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
          client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          scopes: openid email profile
          auth_url: https://authentik.ronaldlokers.nl/application/o/authorize/
          token_url: https://authentik.ronaldlokers.nl/application/o/token/
          api_url: https://authentik.ronaldlokers.nl/application/o/userinfo/
          # Everyone who gets in is an admin. This is a single-operator
          # homelab, and a viewer-by-default rule would mean logging in and
          # then not being able to do anything, with no second person to
          # promote you.
          role_attribute_path: "'Admin'"
          # Do not send people straight to authentik. Grafana's local admin
          # account is the way back in if the provider is misconfigured, and
          # this is the surface used to diagnose an authentik outage.
          auto_login: false
        auth:
          # Keep the local login form. See above — this is deliberately not
          # the same choice as mealie, because grafana is where you look when
          # authentik is the thing that is broken.
          disable_login_form: false
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          # Grafana was the only admin surface without the LAN gate that
          # Prometheus, Longhorn and pgAdmin all carry — and it proxies the Loki
          # datasource, so it exposed 30 days of every pod log, node journal line
          # and Kubernetes event to the internet behind one password.
          #
          # This gate is only meaningful because Traefik now runs
          # externalTrafficPolicy: Local (#163). Before that the ipAllowList saw
          # a masqueraded flannel address instead of the caller and returned 403
          # to everyone, so adding it here would have locked Grafana out entirely
          # rather than restricting it.
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-local-network-only@kubernetescrd
        hosts:
          - grafana.ronaldlokers.nl
        tls:
          - hosts:
              - grafana.ronaldlokers.nl
      # Dashboard providers for automatic dashboard provisioning
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: "default"
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki-production
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local:80
          isDefault: false
          editable: false
