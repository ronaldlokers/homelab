apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.0.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # Disable etcd monitoring - K3s uses embedded etcd without exposed metrics
    kubeEtcd:
      enabled: false

    # K3s runs the controller-manager, scheduler and kube-proxy inside the
    # server process rather than as separately scrapeable components, so the
    # jobs these expect never exist. Their alerts are absent(up{job="..."}),
    # which is unconditionally true here — KubeControllerManagerDown,
    # KubeSchedulerDown and KubeProxyDown were three standing criticals that
    # could never clear and never indicated anything.
    #
    # Same reasoning as kubeEtcd above. Both halves are required: the component
    # toggle stops a ServiceMonitor being created for an endpoint that does not
    # exist, and the defaultRules toggle removes the absent() alert that fires
    # regardless of whether a target was ever configured.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    defaultRules:
      rules:
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeProxy: false

    prometheus:
      prometheusSpec:
        # Without storageSpec the TSDB lives on an emptyDir, so every pod
        # restart discards it and the configured 10d retention never actually
        # holds. Production carries ~353k active series at ~11.8k samples/sec,
        # which is roughly 17GB over 10d; 30Gi leaves headroom for growth and
        # compaction. Longhorn keeps 3 replicas, so this is ~90Gi of real disk.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 30Gi

        # Allow ServiceMonitors from any namespace
        serviceMonitorNamespaceSelector: {}

        # Allow ANY ServiceMonitor (ignore Helm 'release=' label)
        serviceMonitorSelectorNilUsesHelmValues: false

        # Accept ALL ServiceMonitors (empty selector)
        serviceMonitorSelector: {}

        # Allow PodMonitors from any namespace
        podMonitorNamespaceSelector: {}

        # Allow ANY PodMonitor (ignore Helm 'release=' label)
        podMonitorSelectorNilUsesHelmValues: false

        # Accept ALL PodMonitors (empty selector)
        podMonitorSelector: {}

        # Add cluster label to all metrics for dashboard compatibility
        externalLabels:
          cluster: production

        useEndpointSlices: true

      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-local-network-only@kubernetescrd
        hosts:
          - prometheus.ronaldlokers.nl
        tls:
          - secretName: wildcard-ronaldlokers-nl-tls
            hosts:
              - prometheus.ronaldlokers.nl
    grafana:
      adminPassword: ronald
      grafana.ini:
        server:
          root_url: https://grafana.ronaldlokers.nl
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd
        hosts:
          - grafana.ronaldlokers.nl
        tls:
          - secretName: wildcard-ronaldlokers-nl-tls
            hosts:
              - grafana.ronaldlokers.nl
      # Dashboard providers for automatic dashboard provisioning
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: "default"
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki-production
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local:80
          isDefault: false
          editable: false
