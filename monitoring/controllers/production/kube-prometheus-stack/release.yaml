apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.2.0"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # Disable etcd monitoring - K3s uses embedded etcd without exposed metrics
    kubeEtcd:
      enabled: false

    # K3s runs these inside the server process rather than as separately
    # scrapeable components, so the jobs they expect never exist and their alerts
    # fire permanently.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    defaultRules:
      rules:
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeProxy: false
      disabled:
        # Replaced by a time-bounded copy in job-alerts.yaml: the stock rule has no
        # age bound, and CronJobs keep their most recent failed Job by design, so one
        # failure fires forever.
        KubeJobFailed: true

    alertmanager:
      alertmanagerSpec:
        # Small and steady; requests keep it off the BestEffort eviction list.
        resources:
          requests:
            cpu: 25m
            memory: 128Mi

        # Without this nothing outside the monitoring namespace is delivered:
        # prometheus-operator scopes each AlertmanagerConfig to its own namespace.
        alertmanagerConfigMatcherStrategy:
          type: None

    prometheus:
      prometheusSpec:
        # Measured 183m CPU / 1730Mi. Without requests Prometheus runs BestEffort and
        # is evicted first — losing observability exactly when it is needed.
        resources:
          requests:
            cpu: 200m
            memory: 2Gi

        # Without storageSpec the TSDB lives on an emptyDir, so every restart discards
        # it and the configured retention never holds.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 30Gi

        # Allow ServiceMonitors from any namespace
        serviceMonitorNamespaceSelector: {}

        # Allow ANY ServiceMonitor (ignore Helm 'release=' label)
        serviceMonitorSelectorNilUsesHelmValues: false

        # Accept ALL ServiceMonitors (empty selector)
        serviceMonitorSelector: {}

        # Allow PodMonitors from any namespace
        podMonitorNamespaceSelector: {}

        # Allow ANY PodMonitor (ignore Helm 'release=' label)
        podMonitorSelectorNilUsesHelmValues: false

        # Accept ALL PodMonitors (empty selector)
        podMonitorSelector: {}

        # Add cluster label to all metrics for dashboard compatibility
        externalLabels:
          cluster: production

        useEndpointSlices: true

      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-local-network-only@kubernetescrd
        hosts:
          - prometheus.ronaldlokers.nl
        tls:
          - hosts:
              - prometheus.ronaldlokers.nl
    grafana:
      # Measured 13m CPU / 467Mi memory.
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
      # Was a hardcoded `adminPassword` in cleartext here. Grafana proxies the
      # Loki datasource — 30 days of every pod log, node journal line and
      # Kubernetes event — so that one word was the only thing gating it.
      # Rotated, because the old value is in git history.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # Client id and secret come from the grafana-oidc Secret via $__env{},
      # so they never appear in the rendered HelmRelease.
      envFromSecret: grafana-oidc
      grafana.ini:
        server:
          root_url: https://grafana.ronaldlokers.nl
        auth.generic_oauth:
          enabled: true
          name: authentik
          client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
          client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          scopes: openid email profile
          auth_url: https://authentik.ronaldlokers.nl/application/o/authorize/
          token_url: https://authentik.ronaldlokers.nl/application/o/token/
          api_url: https://authentik.ronaldlokers.nl/application/o/userinfo/
          # Everyone who gets in is an admin. This is a single-operator
          # homelab, and a viewer-by-default rule would mean logging in and
          # then not being able to do anything, with no second person to
          # promote you.
          role_attribute_path: "'Admin'"
          # Do not send people straight to authentik. Grafana's local admin
          # account is the way back in if the provider is misconfigured, and
          # this is the surface used to diagnose an authentik outage.
          auto_login: false
        auth:
          # Keep the local login form. See above — this is deliberately not
          # the same choice as mealie, because grafana is where you look when
          # authentik is the thing that is broken.
          disable_login_form: false
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          # Grafana proxies the Loki datasource — 30 days of pod logs and node journals
          # — and was the only admin surface without the LAN gate.
          #
          # The gate only works because Traefik runs externalTrafficPolicy: Local
          # (#163); before that the allowlist saw a masqueraded address.
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-local-network-only@kubernetescrd
        hosts:
          - grafana.ronaldlokers.nl
        tls:
          - hosts:
              - grafana.ronaldlokers.nl
      # Dashboard providers for automatic dashboard provisioning
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: "default"
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki-production
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local:80
          isDefault: false
          editable: false
        # The speedtest-only instance, which keeps 400 days where the default
        # datasource keeps 10. Same metric names in both, so a panel pointed at
        # the wrong one looks right and simply stops a week and a half ago —
        # which is why the name says how long it keeps rather than what it holds.
        - name: Prometheus (speedtest, 400d)
          type: prometheus
          uid: prometheus-speedtest
          access: proxy
          url: http://prometheus-speedtest.monitoring.svc.cluster.local:9090
          isDefault: false
          editable: false
        # No Alertmanager datasource here on purpose. The chart provisions one
        # already — name "Alertmanager", uid "alertmanager", with exactly the
        # jsonData a silence link needs (implementation: prometheus,
        # handleGrafanaManagedAlerts: false).
        #
        # #450 added a second one under the same name because this file was
        # read as if it were the whole picture. It is not: it holds overrides,
        # and the chart's own datasources never appear in it. Check the
        # rendered kube-prometheus-stack-grafana-datasource ConfigMap instead.
