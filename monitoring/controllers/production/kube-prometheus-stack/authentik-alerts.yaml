# authentik gates four applications, so its failure is theirs. Written against
# metrics this build actually exposes, not the documented set.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: authentik-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: kube-prometheus-stack
spec:
  groups:
    - name: authentik
      rules:
        # absent() over the server job, so a rolling restart does not page.
        - alert: AuthentikDown
          annotations:
            summary: "authentik is not reachable"
            description: >-
              No authentik server has been scrapeable for 5 minutes. Every
              application behind SSO — linkding, grafana, immich — will fail to
              log anyone in. Grafana keeps a local login form for exactly this
              case.
          expr: |
            absent(up{job="authentik-server-metrics"} == 1)
          for: 5m
          labels:
            severity: critical

        # Logins keep working without a worker; blueprints stop applying.
        - alert: AuthentikNoWorkers
          annotations:
            summary: "authentik has no task workers"
            description: >-
              authentik_tasks_workers reports zero workers on the worker
              deployment. Logins continue, but blueprints stop being applied and
              scheduled tasks stop running, so configuration in git silently
              stops reaching the running instance.
          expr: |
            max(authentik_tasks_workers{job="authentik-worker-metrics"}) == 0
          for: 15m
          labels:
            severity: warning

        # Zero connections is the condition that matters; comparing against
        # the `expected` label needs a label_replace dance for no gain.
        #
        # Summed across pods and worker processes, not compared per series. An
        # outpost holds ONE websocket, to one gunicorn worker of one replica, so
        # every other series is legitimately 0 — with two replicas this alert
        # fired continuously from 2026-08-07 while the outpost was connected the
        # whole time (7 connections across the series, expecting 1). An alert
        # that is always firing is an alert nobody reads.
        - alert: AuthentikOutpostDisconnected
          annotations:
            summary: "authentik outpost {{ $labels.outpost }} is disconnected"
            description: >-
              Outpost {{ $labels.outpost }} reports zero connections across
              every authentik replica while expecting {{ $labels.expected }}.
              Flows served by this outpost will fail even though authentik
              itself answers.
          expr: |
            sum by (outpost, expected) (authentik_outposts_connected) == 0
          for: 10m
          labels:
            severity: warning
