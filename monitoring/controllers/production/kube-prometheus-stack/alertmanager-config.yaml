apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: ntfy-config
  namespace: monitoring
spec:
  route:
    groupBy: ['alertname', 'cluster', 'service']
    groupWait: 10s
    # Upstream default. Was 10s, which is how long Alertmanager waits before
    # notifying again about a group that has CHANGED — so one alert joining or
    # leaving a group produced another notification ten seconds later. That is
    # most of why the alert feed read as a stream rather than a set of events: a
    # single flapping alert can notify every ten seconds indefinitely.
    #
    # No destination can replace a delivered notification when an alert
    # resolves: ntfy's update needs a per-message ID header and webhook_config
    # sends a static URL, and Campfire's bot API is create-only. Notifications
    # only ever accumulate, so sending fewer of them is the fixable part.
    groupInterval: 5m
    repeatInterval: 12h
    receiver: 'campfire'
    # InfoInhibitor is not an alert about anything. It fires so the inhibit_rule
    # further down the generated config can use it as a source to suppress
    # severity=info alerts, and the chart expects it to notify nobody.
    #
    # It reached the room anyway, 13 times. `alertmanagerConfigMatcherStrategy:
    # type: None` (see release.yaml, and it is needed) leaves this route without
    # matchers, so it catches every alert and runs with continue: true. The
    # chart's own `null` route sits *after* it and only matches Watchdog, so
    # nothing upstream can drop InfoInhibitor and a later null route cannot
    # unsend what an earlier route already delivered.
    #
    # A child route is the fix: children are evaluated before the parent's
    # receiver and do not continue, so this terminates.
    #
    # Watchdog is deliberately not in here. It also reaches the room, which the
    # chart likewise does not intend — but at one message per repeatInterval it
    # is the only end-to-end proof the alert path still works, and nothing else
    # consumes it. Worth replacing with something that alerts on its *absence*,
    # which is the only thing a deadman switch is actually for.
    routes:
      - receiver: 'blackhole'
        matchers:
          - name: alertname
            matchType: '='
            value: 'InfoInhibitor'
  receivers:
    # No integrations, so Alertmanager drops anything routed here. Same shape as
    # the chart's own 'null' receiver, which is not reachable from this route.
    - name: 'blackhole'
    # Campfire only, as of 2026-08-10. Alerts also went to ntfy until then; the
    # room is readable (HTML, so labels are a list and errors keep their shape),
    # searchable, and can be replied to, which a broadcast topic cannot.
    #
    # What this gives up, deliberately: ntfy delivers through a native iOS app
    # with priority levels and no presence rules, while Campfire delivers Web
    # Push to an installed PWA and stays silent about a room that is currently
    # open. See docs/stack/applications/campfire.md.
    #
    # ntfy itself stays deployed — Flux publishes its own events there
    # (infrastructure/configs/base/flux-alerts), so a Campfire outage still
    # leaves one working notification path.
    #
    # No auth here: the credential is the bot key, and it lives in the bridge's
    # own Secret rather than being handed to Alertmanager.
    - name: 'campfire'
      webhookConfigs:
        - url: 'http://campfire-alert-bridge.campfire.svc.cluster.local:8080/alerts'
          sendResolved: true
