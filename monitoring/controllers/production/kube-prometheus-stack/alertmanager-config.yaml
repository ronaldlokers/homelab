apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: ntfy-config
  namespace: monitoring
spec:
  route:
    groupBy: ['alertname', 'cluster', 'service']
    groupWait: 10s
    groupInterval: 10s
    repeatInterval: 12h
    receiver: 'ntfy'
  receivers:
    - name: 'ntfy'
      webhookConfigs:
        - url: 'http://ntfy.ntfy.svc.cluster.local/alerts?template=alertmanager'
          sendResolved: true
          # The alerts topic no longer accepts anonymous publishes (#165), so
          # Alertmanager authenticates as its own account, which holds
          # write-only on this one topic.
          httpConfig:
            basicAuth:
              username:
                name: ntfy-publisher
                key: username
              password:
                name: ntfy-publisher
                key: password
