apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: ntfy-config
  namespace: monitoring
spec:
  route:
    groupBy: ['alertname', 'cluster', 'service']
    groupWait: 10s
    # Upstream default. Was 10s, which is how long Alertmanager waits before
    # notifying again about a group that has CHANGED — so one alert joining or
    # leaving a group produced another push ten seconds later. That is most of
    # why the ntfy topic reads as a stream rather than a set of events: a single
    # flapping alert can notify every ten seconds indefinitely.
    #
    # ntfy cannot replace a delivered notification from Alertmanager (the update
    # needs a per-message ID header, and webhook_config sends a static URL), so
    # notifications only ever accumulate. Sending fewer of them is the part that
    # is fixable here.
    groupInterval: 5m
    repeatInterval: 12h
    receiver: 'ntfy'
  receivers:
    - name: 'ntfy'
      webhookConfigs:
        - url: 'http://ntfy.ntfy.svc.cluster.local/alerts?template=alertmanager'
          sendResolved: true
          # The alerts topic no longer accepts anonymous publishes (#165), so
          # Alertmanager authenticates as its own account, which holds
          # write-only on this one topic.
          httpConfig:
            basicAuth:
              username:
                name: ntfy-publisher
                key: username
              password:
                name: ntfy-publisher
                key: password
