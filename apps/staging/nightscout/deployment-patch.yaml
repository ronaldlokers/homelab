apiVersion: apps/v1
kind: Deployment
metadata:
  name: nightscout
spec:
  template:
    spec:
      containers:
        - name: nightscout
          # Staging runs on a 2-core node. Base requests 100m for production;
          # observed staging usage is 1m. Memory requests are left alone —
          # CPU is the constraint here, memory sits at ~49%.
          resources:
            requests:
              cpu: 25m
          env:
            - name: MONGODB_URI
              value: "mongodb://ferretdb:27017/postgres"
