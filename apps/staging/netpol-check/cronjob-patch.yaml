# Staging files its findings through production's bridge, the same crossing the
# briefing and the Flux alerts already make: staging has no Campfire, holds no
# bot key, and posts to the bridge that does.
#
# This replaced a shell wrapper that piped the output to ntfy on a non-zero
# exit. That said "the check failed" and left the finding in the pod log; the
# bridge gets the findings themselves, and says nothing when they have not
# changed. A crashed Job still surfaces as KubeJobFailed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netpol-check
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: check
              args:
                - |
                  python3 /opt/check/netpol-check.py --ingress-ip 10.0.40.52
              env:
                - name: CHECK_BRIDGE_URL
                  value: "https://campfire-bridge.ronaldlokers.nl/check"
                # Both clusters file into one room. Without this a staging
                # failure reads as a production one.
                - name: CLUSTER
                  value: "staging"
