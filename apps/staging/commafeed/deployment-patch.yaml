apiVersion: apps/v1
kind: Deployment
metadata:
  name: commafeed
spec:
  template:
    spec:
      containers:
        - name: commafeed
          # Staging runs on a 2-core node. Base requests 100m for production;
          # observed staging usage is 1m. Memory requests are left alone —
          # CPU is the constraint here, memory sits at ~49%.
          resources:
            requests:
              cpu: 25m
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://postgres-cluster-rw.database.svc.cluster.local/commafeed"
            # Was the shared `app` role. Taken from the Secret so the role
            # name and its password cannot drift apart (#219).
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: password
