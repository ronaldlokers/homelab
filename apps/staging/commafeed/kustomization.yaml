apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: commafeed
resources:
  - postgres-credentials-secret.yaml
  - ../../base/commafeed/
  - ingress.yaml
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: commafeed
  # The base PVC omits storageClassName, which would fall to the cluster
  # default. Production annotates two StorageClasses as default, so state it.
  - patch: |
      - op: add
        path: /spec/storageClassName
        value: local-path
    target:
      kind: PersistentVolumeClaim
      name: commafeed-data

images:
  - name: athou/commafeed
    newTag: 7.2.0-postgresql
