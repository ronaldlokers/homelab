apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: searxng
resources:
  - ../../base/searxng/
  - ingress.yaml
  - searxng-secret.yaml
patches:
  # Opt in to Reloader: roll this workload when a Secret or ConfigMap it reads
  # changes. Without it, editing settings.yml applies cleanly and the pod keeps
  # serving the old config, because a subPath mount never updates in place.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          reloader.stakater.com/auto: "true"
  - path: deployment-base-url-patch.yaml
