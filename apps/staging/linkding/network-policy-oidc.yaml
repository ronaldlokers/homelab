# Egress to authentik for the server-side half of OIDC: discovery and the
# token exchange. Without it the login fails after authentik has said yes.
#
# Staging's ingress is a container outside the cluster network, so naming
# the address works here; production needs Traefik instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oidc-egress
  namespace: linkding
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.40.52/32
      ports:
        - protocol: TCP
          port: 443
