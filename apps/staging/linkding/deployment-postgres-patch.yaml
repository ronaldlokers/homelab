apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  template:
    spec:
      containers:
        - name: linkding
          # Staging runs on a 2-core node. Base requests 100m for production;
          # observed staging usage is 3m. Memory requests are left alone —
          # CPU is the constraint here, memory sits at ~49%.
          resources:
            requests:
              cpu: 25m
          image: sissbruecker/linkding:1.45.0
          env:
            - name: LD_DB_ENGINE
              value: "postgres"
            - name: LD_DB_HOST
              value: "postgres-cluster-rw.database.svc.cluster.local"
            - name: LD_DB_PORT
              value: "5432"
            - name: LD_DB_DATABASE
              value: "linkding"
            - name: LD_DB_USER
              value: "app"
            - name: LD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: password
