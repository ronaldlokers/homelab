# authentik's OIDC clients, declared rather than clicked or curl'd.
#
# The objection to authentik over Authelia was that its configuration lives in
# its own database and is not reproducible from this repo. Blueprints answer
# that: applied on startup, re-applied hourly, rolled back atomically on error.
# Verified enforcing: sub_mode was changed by hand and corrected on reapply.
#
# This is a Secret rather than a ConfigMap because it declares client_id and
# client_secret. Letting authentik generate those leaves the working values only
# in its database, so recreating it breaks every client at once — the coupling
# that took Immich down in #268. Fixed here, authentik can be rebuilt from
# nothing and the applications keep working.
#
# grant_types is spelled out because omitting it is silent and fatal: the field
# defaults to empty via the API (the web UI defaults it properly), and authentik
# then rejects every authorization with the generic `invalid_request` /
# "The request is otherwise malformed", logging the real cause only server-side.
# Note authentik REFUSES an explicitly empty list — omission is the only way to
# reach that state, which is what makes it easy to hit and hard to see.
apiVersion: v1
kind: Secret
metadata:
    name: authentik-blueprints
    namespace: authentik
type: Opaque
stringData:
    mealie.yaml: ENC[AES256_GCM,data:,iv:Lm0j7Z9/obZ4USbx8+H7TV0oPbqAnhKDce1wNZrC6QI=,tag:Q8rlXHJqt7jZzV6uMdTNmQ==,type:str]
