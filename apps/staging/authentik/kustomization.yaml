apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
# No values patch: staging wants the base release as written — one server, one
# worker, both blueprint directories mounted. What differs from production is
# in the Secret rather than in values, because `existingSecret` makes the chart
# ignore anything under `authentik:` (see the base release). Error reporting is
# turned off here via AUTHENTIK_ERROR_REPORTING__ENABLED in
# authentik-secret.yaml.
resources:
  - ../../base/authentik
  - authentik-secret.yaml
  - blueprints.yaml
  - ingress.yaml
