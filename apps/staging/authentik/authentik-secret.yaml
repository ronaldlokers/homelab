# authentik's entire configuration, not just its secrets.
#
# The chart's `authentik.existingSecret` does NOT merge with the values under
# `authentik:` — setting it makes the chart wire the container with a single
# `envFrom: secretRef` and emit no other environment at all. So anything
# configured in values is silently ignored while this is set; put it here.
#
# For discoverability, since these are encrypted and unreadable from git:
#   AUTHENTIK_POSTGRESQL__HOST  postgres-cluster-rw.database.svc.cluster.local
#   AUTHENTIK_POSTGRESQL__PORT  5432
#   AUTHENTIK_POSTGRESQL__NAME  authentik
#   AUTHENTIK_POSTGRESQL__USER  authentik
#
# AUTHENTIK_SECRET_KEY signs sessions and encrypts fields in the database. It
# CANNOT be rotated in place: changing it invalidates every session and makes
# existing encrypted values unreadable.
#
# AUTHENTIK_POSTGRESQL__PASSWORD mirrors pg-role-authentik in the database
# namespace. Secrets are namespace-scoped so each side needs its own copy, and
# recreating the cluster invalidates this one (#268).
#
# The BOOTSTRAP_* values apply only when the akadmin user has no credential
# yet — they are how this instance gets its first password and API token
# without a human completing the interactive setup flow. Leaving them set is
# inert afterwards; they are kept so a rebuilt staging bootstraps itself.
apiVersion: v1
kind: Secret
metadata:
    name: authentik-secret
    namespace: authentik
type: Opaque
