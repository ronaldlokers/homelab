# authentik's entire configuration, not just its secrets.
#
# The chart's `authentik.existingSecret` does NOT merge with the values under
# `authentik:` — setting it makes the chart wire the container with a single
# `envFrom: secretRef` and emit no other environment at all. So
# authentik.postgresql.host in values was silently ignored and authentik fell
# back to its built-in default:
#
#   PostgreSQL connection failed, retrying...
#   connection to server at "127.0.0.1", port 5432 failed: Connection refused
#
# Everything authentik needs therefore lives here. The cost is that the
# non-sensitive parts — host, port, database name, user — are encrypted too and
# so are not readable in git; they are repeated in a comment on the HelmRelease
# so the wiring is still discoverable without decrypting anything.
#
# AUTHENTIK_SECRET_KEY signs sessions and encrypts fields in the database. It
# CANNOT be rotated in place: changing it invalidates every session and makes
# existing encrypted values unreadable.
#
# AUTHENTIK_POSTGRESQL__PASSWORD mirrors pg-role-authentik in the database
# namespace. Secrets are namespace-scoped so each side needs its own copy, and
# recreating the cluster invalidates this one (#268).
apiVersion: v1
kind: Secret
metadata:
    name: authentik-secret
    namespace: authentik
type: Opaque
stringData:
    AUTHENTIK_SECRET_KEY: ENC[AES256_GCM,data:fWzYjf7jwA8MGXYCk6YlWEJpwLqUjEDA11535IHBrVezRyTIaTOQdP3VMXaZInez1jfAso4chtFJ5d+7,iv:9rn/+u0uvjBtk84rVX5XJBltdrjhbgIpmManoo/JakU=,tag:b3PDF0nfZd7VLkwnJdecLw==,type:str]
