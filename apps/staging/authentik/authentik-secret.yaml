# authentik's own secrets.
#
# AUTHENTIK_SECRET_KEY signs sessions and encrypts fields stored in the
# database. It CANNOT be rotated in place: changing it invalidates every
# session and makes existing encrypted values unreadable. Treat it as
# permanent for the life of this install.
#
# AUTHENTIK_POSTGRESQL__PASSWORD is authentik's own role on the shared
# postgres-cluster (#219), not the shared `app` role. The value mirrors
# pg-role-authentik in the database namespace; Secrets are namespace-scoped so
# each side needs its own copy, and recreating the cluster invalidates this one
# (#268).
apiVersion: v1
kind: Secret
metadata:
    name: authentik-secret
    namespace: authentik
type: Opaque
