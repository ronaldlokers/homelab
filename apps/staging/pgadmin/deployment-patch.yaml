apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin4
spec:
  template:
    spec:
      containers:
        - name: pgadmin4
          # Staging runs on a 2-core node. Base requests 100m for production;
          # observed staging usage is 2m. Memory requests are left alone —
          # CPU is the constraint here, memory sits at ~49%.
          resources:
            requests:
              cpu: 25m
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pgadmin-credentials
                  key: email
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin-credentials
                  key: password
          # Mount the servers json from the secret
          volumeMounts:
            - name: pgadmin-servers
              mountPath: "/pgadmin4/servers.json"
              subPath: servers.json
      volumes:
        - name: pgadmin-servers
          secret:
            secretName: pgadmin-servers
