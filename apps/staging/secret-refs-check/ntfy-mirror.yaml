# The mirror, not the source. Reflector fills in the payload from
# netpol-check/netpol-check-ntfy; nothing here carries the password, so there
# is no second copy to drift (#268).
apiVersion: v1
kind: Secret
metadata:
  name: netpol-check-ntfy
  namespace: secret-refs-check
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: netpol-check/netpol-check-ntfy
type: Opaque
