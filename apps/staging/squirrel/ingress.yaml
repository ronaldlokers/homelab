# The staging pile. Only the screen: the presence webhook and the Campfire
# webhook have nothing to talk to here, and routing them would be inviting
# traffic to a bot that cannot answer.
#
# `staging-identity` was the second middleware until 25 August 2026. It set
# X-Authentik-Username to a fixed value — the header the production
# forward-auth would have proved — which meant the staging pile had no
# authentication at all, only the same reachability every other staging service
# has. That was acceptable for a database somebody seeded on purpose, and the
# middleware's own comment said so.
#
# There is no header to inject any more. Squirrel runs the OIDC flow itself
# from v0.39.0, against staging's own authentik, so the staging pile has real
# authentication for the first time. The middleware is deleted rather than left
# in place: a header nothing reads is a header the next person has to work out
# is dead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squirrel
  namespace: campfire
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: squirrel.staging.ronaldlokers.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: squirrel
                port:
                  number: 8080
  tls:
    - hosts:
        - squirrel.staging.ronaldlokers.nl
