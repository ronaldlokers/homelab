apiVersion: apps/v1
kind: Deployment
metadata:
  name: squirrel
  namespace: campfire
spec:
  template:
    spec:
      containers:
        - name: squirrel
          env:
            # The whole list, replaced rather than merged. The base carries a
            # Campfire bot key as a secretKeyRef, and a merge by name would
            # leave an entry holding both a value and a valueFrom, which the
            # API rejects. Replacing says what staging is in one place instead.
            - $patch: replace
            - name: SPOOL_DIR
              value: /var/spool/squirrel
            # The camera, here too. The env list is replaced rather than
            # merged, so anything the base adds has to be repeated — and a
            # staging pile with no camera would be the one place you cannot try
            # the feature before tagging it.
            - name: PHOTO_DIR
              value: /var/lib/squirrel/photos
            - name: OWNER_HANDLE
              value: ronald
            # No transports at all. Staging has no Campfire, and an empty list
            # is how that is said: with none configured, the required Campfire
            # settings stop being required and no webhook route is mounted.
            # This pod is the screen and nothing else.
            - name: TRANSPORTS
              value: ""
            # Late enough that nothing here ever fires an evening message,
            # which would have nowhere to go anyway.
            - name: EVENING_AT
              value: "23:59"
            - name: DIGEST_TZ
              value: "Europe/Amsterdam"
            # Repeated from the base because this list is replaced, not merged.
            # Staging has no Campfire and so no `!at`, but the screen can still
            # keep a fixed point through the coach, and `startOfDay` reads the
            # process clock either way. See the base for what was wrong.
            - name: TZ
              value: "Europe/Amsterdam"
            # No longer an identity anybody authenticates with. From v0.39.0
            # it is seeded as a `screen` identity so a capture already sitting
            # in the spool at deploy time still resolves to its person when the
            # drain picks it up, and it is still what decides whether the
            # screen is mounted at all.
            - name: WEB_IDENTITY
              value: ronaldlokers
            # The way in. Staging runs the flow against staging's own
            # authentik, not production's: a staging pod holding a credential
            # for the production identity provider would make the two clusters
            # one blast radius for the sake of a login page.
            #
            # That means staging authentik needs its own squirrel application,
            # its own group and an account in it. Before v0.39.0 it needed none
            # of that — the staging pile had no authentication at all, only a
            # middleware injecting the header the production forward-auth would
            # have proved. That middleware is now useless and is removed.
            #
            # The account is `ronaldlokers`, the same name production uses,
            # and it is a different account: staging authentik has its own user
            # database. It was still called `akadmin` — staging's default admin,
            # never renamed because until now nothing ever authenticated
            # against staging authentik at all — and was renamed on 25 August
            # 2026 when this went in.
            #
            # Membership in `squirrel-users` is not declared in the blueprint,
            # only the group: admitting somebody is a click rather than a
            # commit, and a member added by hand would otherwise be removed the
            # next time the blueprint reapplies.
            - name: WEB_OIDC_ISSUER
              value: https://authentik.staging.ronaldlokers.nl/application/o/squirrel/
            - name: WEB_OIDC_CLIENT_ID
              value: squirrel
            - name: WEB_OIDC_REDIRECT_URL
              value: https://squirrel.staging.ronaldlokers.nl/auth/callback
            - name: WEB_REQUIRED_GROUP
              value: squirrel-users
            # Staging needs this as much as production does, for a reason that
            # is easy to miss: without it the first login would create a
            # *second* person, while the seeded notes stayed on the first — the
            # one WEB_IDENTITY and OWNER_HANDLE make at boot. The screen would
            # come up empty and correct, which is the worst kind of wrong.
            #
            # This uuid survived the account being renamed from `akadmin`,
            # which is the whole argument for the sub being a uuid rather than
            # a username. It would not survive staging authentik being rebuilt
            # from a blank database: the bootstrap would make a fresh `akadmin`
            # with a fresh uuid, and this value would need reading again.
            #
            # The seeding recipe in docs/runbooks/squirrel.md inserts against
            # `from people limit 1`. This is what keeps that recipe pointing at
            # the pile you are looking at.
            #
            #   kubectl --context=staging -n authentik exec deploy/authentik-server -- \
            #     ak shell -c "from authentik.core.models import User; \
            #     print(User.objects.get(username='"'"'ronaldlokers'"'"').uuid)"
            - name: WEB_OIDC_SUB
              value: 16818c0f-26f0-4040-84a0-292f84e31e7f
            - name: WEB_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: squirrel-oidc
                  key: WEB_OIDC_CLIENT_SECRET
            # A guest ceiling here too. Staging has no OPENAI_API_KEY, so
            # nothing can spend either way — it is stated so the two clusters
            # differ in one place rather than two.
            - name: COACH_BUDGET_GUEST_EUR
              value: "1"
            - name: POSTGRES_SERVER
              value: "postgres-cluster-rw.database.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "squirrel"
            # Taken from the Secret so the role name and its password can never
            # drift apart; reflector mirrors it into this namespace from
            # `database`, the same as production.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pg-role-squirrel
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-role-squirrel
                  key: password
