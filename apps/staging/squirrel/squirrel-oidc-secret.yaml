# The OIDC client secret Squirrel proves itself with to authentik.
#
# Read it back with
#
#   sops -d apps/staging/squirrel/squirrel-oidc-secret.yaml
#
# **It has to match the `client_secret` in the squirrel blueprint exactly.**
# The blueprint declares both halves rather than letting authentik generate
# them, so authentik can be rebuilt from nothing and this client keeps working
# — which also means the two are written in two places and can drift. A
# mismatch is not a startup error: it is every login failing at the token
# exchange, and the screen saying it cannot reach the way in.
#
# NOT optional, unlike squirrel-push, squirrel-openai and squirrel-presence.
# Those three degrade to less product — no push, no coach, no presence hook —
# and the Deployment reads them with optional: true for exactly that reason.
# A missing client secret would leave a screen nobody can sign into, so the
# binary refuses to boot instead.
#
# Rotating it means editing this file and the blueprint in the same commit.
# Reloader rolls the pod when this Secret changes; authentik picks the
# blueprint up on its own. Between the two applying, logins fail — it is a few
# seconds and it is why they belong in one commit.
#
# Encrypted to the staging age key. squirrel.staging.ronaldlokers.nl.
