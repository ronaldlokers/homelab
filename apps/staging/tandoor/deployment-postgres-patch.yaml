apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandoor
spec:
  template:
    spec:
      containers:
        - name: tandoor
          image: ghcr.io/tandoorrecipes/recipes:2.6.13
          env:
            - name: POSTGRES_HOST
              value: "postgres-cluster-rw.database.svc.cluster.local"
            - name: POSTGRES_DB
              value: "tandoor"
            # localhost is required: the probes send Host: localhost, and Django
            # rejects anything not listed here with 400 DisallowedHost.
            # 740Mi measured with the default 3 workers, on a host with ~1.8Gi
            # free. One worker is ample for a single-user staging instance and
            # frees roughly 400Mi; production keeps the default.
            - name: GUNICORN_WORKERS
              value: "1"
            - name: ALLOWED_HOSTS
              value: "tandoor.staging.ronaldlokers.nl,localhost"
            # OIDC via authentik (#270). The provider block, which carries the
            # client secret, comes from the tandoor-oidc Secret.
            #
            # SOCIAL_PROVIDERS names the allauth module to load; without it the
            # provider config below is parsed and then ignored, which looks
            # exactly like a working configuration that produces no login
            # button.
            - name: SOCIAL_PROVIDERS
              value: "allauth.socialaccount.providers.openid_connect"
            # Local accounts stay enabled. Tandoor already has a working admin
            # account and locking it out would leave no way back in if the
            # authentik login is misconfigured.
            - name: SOCIALACCOUNT_ONLY
              value: "0"
            # A successful authentik login may create a Tandoor account. Safe
            # for the same reason it is safe in mealie: authentik has no
            # self-enrolment flow, so the only people who can reach this point
            # are ones already created there by hand.
            - name: SOCIALACCOUNT_AUTO_SIGNUP
              value: "1"
            # New social users land in a space with guest access rather than
            # nothing at all, which otherwise means a successful login followed
            # by an empty application.
            - name: SOCIAL_DEFAULT_ACCESS
              value: "1"
            - name: SOCIAL_DEFAULT_GROUP
              value: "user"
          envFrom:
            - secretRef:
                name: tandoor-oidc
          # Staging runs on a 2-core node; the base requests are sized for
          # production. Memory is left alone — Django plus gunicorn needs it.
          resources:
            requests:
              cpu: 25m
