apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tandoor
resources:
  - postgres-credentials-secret.yaml
  - tandoor-secret.yaml
  - tandoor-oidc-secret.yaml
  - ../../base/tandoor/
  - ingress.yaml
patches:
  - path: deployment-postgres-patch.yaml
  # The base PVC omits storageClassName, which would fall to the cluster
  # default. Production annotates two StorageClasses as default, so state it.
  - patch: |
      - op: add
        path: /spec/storageClassName
        value: local-path
    target:
      kind: PersistentVolumeClaim
      name: tandoor-media
