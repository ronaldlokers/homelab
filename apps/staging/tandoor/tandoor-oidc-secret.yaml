# Tandoor's OIDC client credentials.
#
# The whole provider block is a secret because allauth takes its configuration
# as one JSON document and the client secret is inside it — there is no
# separate env var to split off. The client_id here MUST match what
# apps/staging/authentik/blueprints.yaml declares.
#
# provider_id is "authentik" and that is load-bearing: allauth mounts its
# callback at /accounts/oidc/<provider_id>/login/callback/, so this string is
# what makes the redirect_uri in the blueprint correct.
