# Mealie's OIDC client credentials for authentik.
#
# The provider and application are defined in authentik, not here — its
# configuration lives in its own database, which is the known trade-off of
# choosing authentik over Authelia. These are the two values that have to cross
# into this cluster's config, and only the secret is sensitive; the client ID is
# encrypted alongside it purely because they belong together.
#
# Recreating the authentik provider mints a new pair, and Mealie will fail to
# log anyone in until this is updated to match — the same class of coupling as
# #268.
