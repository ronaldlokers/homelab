apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
spec:
  template:
    spec:
      containers:
        - name: mealie
          # Staging runs on a 2-core node. Base requests 100m for production;
          # observed staging usage is 5m. Memory requests are left alone —
          # CPU is the constraint here, memory sits at ~49%.
          resources:
            requests:
              cpu: 25m
          image: ghcr.io/mealie-recipes/mealie:v3.22.0
          # OIDC via authentik (#270). Non-secret settings are here so they are
          # readable; the client id and secret come from the SOPS-encrypted
          # mealie-oidc Secret.
          #
          # OIDC_SIGNUP_ENABLED lets a successful authentik login create the
          # Mealie account on first use. Without it every user must be created
          # by hand first, which defeats the point of federating login. It is
          # safe here because authentik decides who may reach the application at
          # all — Mealie never sees an unauthorised user.
          #
          # The provider is reached over HTTPS at its public hostname rather
          # than a cluster-internal Service, because the issuer in the token
          # must match the issuer Mealie validates against, and the browser
          # necessarily sees the public one. That only works now that staging
          # issues real certificates; against the Let's Encrypt staging root
          # this call failed with CERTIFICATE_VERIFY_FAILED.
          envFrom:
            - secretRef:
                name: mealie-oidc
          env:
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: "https://authentik.staging.ronaldlokers.nl/application/o/mealie-staging/.well-known/openid-configuration"
            - name: OIDC_PROVIDER_NAME
              value: "authentik"
            - name: OIDC_SIGNUP_ENABLED
              value: "true"
            # Leave the normal login form reachable. Auto-redirect would send
            # every visit straight to authentik, which locks you out of the
            # local admin account if the provider is ever misconfigured — not a
            # trade worth making while this is the first client being proven.
            - name: OIDC_AUTO_REDIRECT
              value: "false"
            # Mealie refuses a login whose ID token lacks email_verified:
            #
            #   [OIDC] email_verified claim is missing or false; refusing to
            #          authenticate
            #   [OIDC] Required claims not present in ID token or userinfo
            #   401 Unauthorized
            #
            # authentik's built-in email scope mapping hardcodes
            # `"email_verified": False`, which is accurate — this instance has
            # no SMTP and no verification flow, so no address here has ever been
            # proven. akadmin's came from AUTHENTIK_BOOTSTRAP_EMAIL.
            #
            # The alternative fix is editing that mapping to return True, and it
            # is worse: the claim is asserted to EVERY client, so one relaxation
            # would silently weaken every future integration. Scoping the
            # relaxation to this one application keeps the lie out of the
            # identity provider.
            #
            # REVISIT IF SELF-ENROLMENT IS EVER ENABLED. Today authentik has no
            # enrolment flow, so addresses are only ever set by an administrator
            # and cannot be claimed by their owner-to-be. If users can ever
            # register themselves, an unverified address plus email-based
            # account matching lets someone claim another person's Mealie
            # account — at which point this must become real verification
            # rather than a disabled check.
            - name: OIDC_REQUIRES_EMAIL_VERIFICATION
              value: "false"
            - name: DB_ENGINE
              value: "postgres"
            - name: POSTGRES_SERVER
              value: "postgres-cluster-rw.database.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "mealie"
            # Was the shared `app` role. Taken from the Secret so the role name
            # and its password can never drift apart (#219).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: password
            - name: BASE_URL
              value: "https://mealie.staging.ronaldlokers.nl"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: ALLOW_SIGNUP
              value: "false"
            - name: PUID
              value: "911"
            - name: PGID
              value: "911"
          volumeMounts:
            - name: mealie-data
              mountPath: "/app/data"
      volumes:
        - name: mealie-data
          emptyDir: {}
