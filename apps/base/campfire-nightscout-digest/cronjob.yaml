# 07:00 local, alongside the morning briefing. Yesterday is a day already over,
# so there is nothing here to act on and no reason for it to arrive earlier.
#
# Unlike the briefing, this posts every day whether or not anything stands out.
# The briefing is exception-driven because a green cluster is not information;
# a day's glucose statistics are, and the trend only exists if the number
# arrives daily.
#
# To re-post an older day — one missed while something was broken, or simply a
# day with a sensor on it — set DIGEST_DATE on a one-off Job. It is deliberately
# absent here, so the scheduled run always means yesterday:
#
#   kubectl create job --from=cronjob/campfire-nightscout-digest digest-manual \
#     -n campfire --dry-run=client -o yaml |
#     kubectl set env --local -f - DIGEST_DATE=2026-08-05 -o yaml |
#     kubectl apply -f -
#
# DIGEST_SHEET=fortnight forces the Saturday sheet on any day.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: campfire-nightscout-digest
  namespace: campfire
spec:
  schedule: "0 7 * * *"
  timeZone: "Europe/Amsterdam"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: campfire-nightscout-digest
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # The image runs as `node` (uid 1000); 65534 has no home in it.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              # Untagged on purpose. Every stringer workload runs the same build, and the
              # tag that build is lives once, in the cluster overlay's `images:` block —
              # see apps/production/kustomization.yaml. Five separately-pinned copies is
              # how the bridge ended up four releases behind the briefing.
              image: ghcr.io/ronaldlokers/stringer
              args: ["glucose"]
              envFrom:
                - secretRef:
                    name: campfire-nightscout-digest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  # Drawing the chart is a couple of seconds of pure-Python
                  # per-pixel arithmetic, and it is the only thing this pod
                  # does. Throttling that to 200m turns two seconds into a
                  # minute of wall clock for no benefit — nothing is waiting
                  # on this at 07:00, but nothing gains from it being slow
                  # either. The request stays at 10m, so the ceiling costs
                  # nothing while the pod is idle.
                  cpu: 1000m
                  memory: 128Mi
          # No script volume: the code is in the image now.
