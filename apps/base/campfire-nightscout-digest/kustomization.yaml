# No `namespace:` here on purpose — each resource declares its own, matching
# the other campfire workloads.
#
# Ingress into nightscout is NOT here. It lives with the other cross-namespace
# rules in infrastructure/configs/production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cronjob.yaml
  - network-policies.yaml

# Hash suffix left ON: the suffix changes when the script changes, which
# rewrites the CronJob's volume reference so the next run picks up new code.
#
# `bake_font.py` is deliberately absent: it is the workstation tool that
# generates `glyphs.py`, needs Pillow, and has no business in the pod.
configMapGenerator:
  - name: campfire-nightscout-digest-script
    namespace: campfire
    files:
      - nightscout-digest.py
      - chart.py
      - glyphs.py
