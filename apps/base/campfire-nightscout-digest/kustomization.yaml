# No `namespace:` here on purpose — each resource declares its own, matching
# the other campfire workloads.
#
# Ingress into nightscout is NOT here. It lives with the other cross-namespace
# rules in infrastructure/configs/production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cronjob.yaml
  - network-policies.yaml

# No configMapGenerator: the code lives in ghcr.io/ronaldlokers/stringer and
# arrives by image tag, which Renovate bumps like any other image here. The
# renderer, its type and its tests went with it — see
# docs/campfire/migration-to-stringer.md.
