# nginx config for the Tandoor sidecar.
#
# The application image does NOT serve HTTP. Its entrypoint ends with:
#
#   exec gunicorn --bind unix:/tmp/tandoor.sock ... recipes.wsgi
#
# The bind is hardcoded, so there is no environment variable that moves it to a
# TCP port. Upstream's docker-compose pairs the app with a separate nginx
# container, and that is what this reproduces: nginx owns port 80, proxies
# dynamic requests over the shared socket, and serves static and media files
# directly from disk so Django never has to.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tandoor-nginx
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        # Recipe imports can carry sizeable images; the Django side accepts
        # them, so nginx must not be the thing that rejects the upload.
        client_max_body_size 128M;

        # Served straight off disk. /static is the emptyDir that collectstatic
        # writes on every start; /media is the PVC holding uploaded images.
        location /static/ {
            alias /static/;
            access_log off;
            expires 30d;
        }

        location /media/ {
            alias /media/;
            access_log off;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Django is configured with SECURE_PROXY_SSL_HEADER, so it trusts
            # this to decide whether to build https:// URLs. Traefik terminates
            # TLS in front, so the scheme it saw is the one that matters.
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_pass http://unix:/tmp/tandoor.sock;
        }
    }
