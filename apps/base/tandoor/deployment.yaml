apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandoor
spec:
  replicas: 1
  # tandoor-media is ReadWriteOnce, and a RollingUpdate would start the
  # replacement before the old pod releases the claim — across nodes that
  # deadlocks on a multi-attach error. Every PVC-backed workload here uses
  # Recreate for the same reason.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tandoor
  template:
    metadata:
      labels:
        app: tandoor
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        # The application. It serves no TCP port: its entrypoint ends with
        # `gunicorn --bind unix:/tmp/tandoor.sock`, hardcoded, with no
        # environment variable to move it. Upstream's compose pairs it with a
        # separate nginx container, which is the sidecar below.
        - name: tandoor
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: DB_ENGINE
              value: "django.db.backends.postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tandoor-secret
                  key: SECRET_KEY
            # Django refuses to serve a Host header that is not listed, so a
            # wrong value here is a hard 400 rather than a warning. Patched per
            # environment.
            - name: ALLOWED_HOSTS
              value: "localhost"
            # Traefik terminates TLS. Without this Django builds http:// absolute
            # URLs and the login POST fails its CSRF origin check — the app comes
            # up fine and then nobody can log in.
            - name: SECURE_PROXY_SSL_HEADER
              value: "True"
          # No HTTP probe: there is no port to probe. Pod readiness is decided
          # by the nginx container, which cannot serve anything until this one
          # has created the socket.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              # Measured 731Mi during collectstatic on first boot; a 1Gi limit
              # left too little headroom.
              memory: 2Gi
          volumeMounts:
            - name: media
              mountPath: /opt/recipes/mediafiles
            - name: static
              mountPath: /opt/recipes/staticfiles
            - name: socket
              mountPath: /tmp

        - name: nginx
          image: nginx:1.31-alpine
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
          # First boot applies 240+ Django migrations and then runs collectstatic
          # before the socket appears, which takes well over five minutes on
          # ARM64. Until then nginx answers 502, so this budget has to cover the
          # app's cold start, not nginx's.
          #
          # A shorter budget killed the pod mid-migration and each restart began
          # the whole sequence again, so it never converged.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: socket
              mountPath: /tmp
            - name: static
              mountPath: /static
              readOnly: true
            - name: media
              mountPath: /media
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: tandoor-media
        # Regenerated by collectstatic on every start, so it needs no PVC —
        # losing it costs startup time, not data. See pvc.yaml.
        - name: static
          emptyDir: {}
        # Carries the gunicorn socket between the two containers.
        - name: socket
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: tandoor-nginx
