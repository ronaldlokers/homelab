apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandoor
spec:
  replicas: 1
  # tandoor-media is ReadWriteOnce, and a RollingUpdate would start the
  # replacement before the old pod releases the claim — across nodes that
  # deadlocks on a multi-attach error. Every PVC-backed workload here uses
  # Recreate for the same reason.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tandoor
  template:
    metadata:
      labels:
        app: tandoor
    spec:
      # Kubernetes injects TANDOOR_PORT=tcp://… for the `tandoor` Service, and
      # boot.sh substitutes it into the nginx config. Set explicitly to override.
      enableServiceLinks: false
      securityContext:
        fsGroup: 65534
      containers:
        # One container: the image bundles nginx on port 80 in front of gunicorn on a
        # unix socket.
        - name: tandoor
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
          env:
            # Explicit, so the nginx listen directive is right regardless of
            # what Kubernetes would otherwise inject as TANDOOR_PORT.
            - name: TANDOOR_PORT
              value: "80"
            - name: DB_ENGINE
              value: "django.db.backends.postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            # Read from the Secret rather than hardcoded, so each environment
            # supplies its own role and the name cannot drift from the password
            # (#219). Both environments now say `tandoor`.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pg-role-tandoor
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-role-tandoor
                  key: password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tandoor-secret
                  key: SECRET_KEY
            # Django refuses any Host header not listed, so a wrong value is a
            # hard 400 rather than a warning. Patched per environment.
            - name: ALLOWED_HOSTS
              value: "localhost"
            # Traefik terminates TLS. Without this Django builds http:// absolute
            # URLs and the login POST fails its CSRF origin check — the app comes
            # up and then nobody can log in.
            - name: SECURE_PROXY_SSL_HEADER
              value: "True"
          # First boot runs 240+ migrations then collectstatic before nginx starts —
          # well over five minutes on ARM64, so the startup probe allows for it.
          startupProbe:
            httpGet:
              path: /
              port: http
              # kubelet sends Host: <pod-IP> by default, which Django rejects with
              # 400 DisallowedHost because it is not in ALLOWED_HOSTS. Every
              # overlay includes `localhost` there, so probes use it and stay
              # identical across environments.
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /
              port: http
              # kubelet sends Host: <pod-IP> by default, which Django rejects with
              # 400 DisallowedHost because it is not in ALLOWED_HOSTS. Every
              # overlay includes `localhost` there, so probes use it and stay
              # identical across environments.
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
              # kubelet sends Host: <pod-IP> by default, which Django rejects with
              # 400 DisallowedHost because it is not in ALLOWED_HOSTS. Every
              # overlay includes `localhost` there, so probes use it and stay
              # identical across environments.
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              # Measured 731Mi during collectstatic on first boot; a 1Gi limit
              # left too little headroom.
              memory: 2Gi
          volumeMounts:
            - name: media
              mountPath: /opt/recipes/mediafiles
            - name: static
              mountPath: /opt/recipes/staticfiles
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: tandoor-media
        # Regenerated by collectstatic on every start, so it needs no PVC —
        # losing it costs startup time, not data. See pvc.yaml.
        - name: static
          emptyDir: {}
