apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandoor
spec:
  replicas: 1
  # tandoor-media is ReadWriteOnce, and a RollingUpdate would start the
  # replacement before the old pod releases the claim — across nodes that
  # deadlocks on a multi-attach error. Every PVC-backed workload here uses
  # Recreate for the same reason.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tandoor
  template:
    metadata:
      labels:
        app: tandoor
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        # One container. The image bundles nginx on port 80 in front of gunicorn,
        # which binds a unix socket at /tmp/tandoor.sock. Verified in the pod:
        #
        #   tcp 0.0.0.0:80 LISTEN 11/nginx.pid
        #   PID 11 nginx: master process
        #   PID  7 gunicorn --bind unix:/tmp/tandoor.sock
        #
        # An nginx sidecar is NOT needed and actively breaks it — containers in
        # a pod share a network namespace, so a second nginx fails with
        # "bind() to 0.0.0.0:80 failed (98: Address in use)".
        #
        # The trap: nginx starts at the END of boot.sh, after migrations,
        # collectstatic and gunicorn. Run netstat mid-boot and nothing is
        # listening, which reads exactly like an image that serves no HTTP.
        - name: tandoor
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: DB_ENGINE
              value: "django.db.backends.postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tandoor-secret
                  key: SECRET_KEY
            # Django refuses any Host header not listed, so a wrong value is a
            # hard 400 rather than a warning. Patched per environment.
            - name: ALLOWED_HOSTS
              value: "localhost"
            # Traefik terminates TLS. Without this Django builds http:// absolute
            # URLs and the login POST fails its CSRF origin check — the app comes
            # up and then nobody can log in.
            - name: SECURE_PROXY_SSL_HEADER
              value: "True"
          # First boot applies 240+ Django migrations, then collectstatic, and
          # only then starts nginx — well over five minutes on ARM64.
          #
          # 60 x 5s was not enough: the probe killed the container mid-migration
          # and each restart began the whole sequence again, so it never
          # converged. 120 x 5s covers the measured cold start with room spare.
          # This only delays detection of a container dead at startup;
          # livenessProbe still catches one that dies later.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              # Measured 731Mi during collectstatic on first boot; a 1Gi limit
              # left too little headroom.
              memory: 2Gi
          volumeMounts:
            - name: media
              mountPath: /opt/recipes/mediafiles
            - name: static
              mountPath: /opt/recipes/staticfiles
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: tandoor-media
        # Regenerated by collectstatic on every start, so it needs no PVC —
        # losing it costs startup time, not data. See pvc.yaml.
        - name: static
          emptyDir: {}
