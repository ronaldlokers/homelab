apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandoor
spec:
  replicas: 1
  # tandoor-media is ReadWriteOnce, and a RollingUpdate would start the
  # replacement before the old pod releases the claim — across nodes that
  # deadlocks on a multi-attach error. Every PVC-backed workload here uses
  # Recreate for the same reason.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tandoor
  template:
    metadata:
      labels:
        app: tandoor
    spec:
      securityContext:
        # The image runs as uid/gid 65534 and writes to both mounted paths.
        fsGroup: 65534
      containers:
        - name: tandoor
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: DB_ENGINE
              value: "django.db.backends.postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tandoor-secret
                  key: SECRET_KEY
            # Django refuses to serve a Host header that is not listed. The
            # per-environment hostname is patched in by each overlay.
            - name: ALLOWED_HOSTS
              value: "localhost"
            # Behind Traefik, which terminates TLS. Without this Django builds
            # http:// absolute URLs and the login POST fails CSRF origin checks.
            - name: SECURE_PROXY_SSL_HEADER
              value: "True"
          # `/` returns a 302 to the login page, which httpGet treats as
          # success (2xx and 3xx both pass). There is no dedicated health
          # endpoint in this image.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: media
              mountPath: /opt/recipes/mediafiles
            - name: static
              mountPath: /opt/recipes/staticfiles
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: tandoor-media
        # Regenerated by collectstatic on every start — see pvc.yaml.
        - name: static
          emptyDir: {}
