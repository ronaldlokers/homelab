# User-uploaded recipe images and imported files.
#
# Only mediafiles is persisted. /opt/recipes/staticfiles is regenerated by
# collectstatic on every container start, so it is an emptyDir — losing it
# costs a few seconds of startup, not data. mediafiles is the opposite: it is
# the only copy of every photo a recipe references.
#
# storageClassName is set per overlay: production annotates both local-path and
# longhorn as default, so an unqualified claim binds non-deterministically.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tandoor-media
  labels:
    recurring-job.longhorn.io/backup-daily: enabled
    recurring-job.longhorn.io/snapshot-daily: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
