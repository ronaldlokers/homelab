---
# Campfire denies egress by default, so this half has to be said out loud.
#
# The ingress half is already there and needs nothing new:
# infrastructure/configs/production/allow-status-bot-to-prometheus.yaml admits
# the whole campfire namespace to any pod labelled
# `app.kubernetes.io/name: prometheus` on 9090, and prometheus-operator puts
# that label on every instance it builds — including the speedtest one. Adding
# a second rule saying the same thing would be a second thing to keep in step.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-speedtest-digest-egress
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire-speedtest-digest
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
    # The room it posts into.
    - to:
        - podSelector:
            matchLabels:
              app: campfire
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-speedtest-digest-dns
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire-speedtest-digest
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The other half of the hop into Campfire, which the first version of this
# directory was missing: the campfire pod denies ingress by default and admits
# each poster by name, so egress alone gets a connection refused at the far end
# — which reads exactly like Campfire being down.
#
# Every other bot ships both halves in its own directory
# (allow-nightscout-digest-to-campfire, allow-renovate-digest-ingress-to-campfire,
# and so on). This one now does too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-speedtest-digest-ingress-to-campfire
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: campfire-speedtest-digest
      ports:
        - protocol: TCP
          port: 80
