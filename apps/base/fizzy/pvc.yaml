# Fizzy keeps everything here: the SQLite database and every uploaded
# attachment, both under /rails/storage. There is no external database, so this
# claim is the entire application state — losing it loses the account, the
# boards and the cards.
#
# Same shape and the same caveat as campfire-data: a Longhorn snapshot of a
# live SQLite database can capture a torn write. Acceptable for a kanban board;
# it would not be for anything transactional.
#
# storageClassName is deliberately omitted here and set per overlay: production
# annotates BOTH local-path and longhorn as default, so an unqualified claim
# binds non-deterministically.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fizzy-data
  labels:
    recurring-job.longhorn.io/backup-daily: enabled
    recurring-job.longhorn.io/snapshot-daily: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Cards and comments are text; attachments are what grow. Longhorn
      # volumes expand in place, so start small rather than reserving
      # replicated NVMe against a guess.
      storage: 5Gi
