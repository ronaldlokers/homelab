apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: immich
      version: "0.13.1"
      sourceRef:
        kind: HelmRepository
        name: immich
      interval: 12h
  values:
    # Immich-specific configuration
    immich:
      persistence:
        library:
          existingClaim: immich-library

    # Environment variables for all components
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME:
                value: immich-cluster-rw.database.svc.cluster.local
              DB_PORT:
                value: "5432"
              DB_DATABASE_NAME:
                value: immich
              DB_USERNAME:
                value: "app"
              # Was `value: ""`: pg_hba said `host all app all trust`, so
              # Immich connected with no credential at all (#166).
              # immich-cluster-app is mirrored into this namespace by reflector
              # (#268), so this is the Secret CNPG generates rather than a copy
              # that a cluster recreate silently invalidates.
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-cluster-app
                    key: password

    # Server component
    server:
      enabled: true

    # Machine learning component
    "machine-learning":
      enabled: true
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          accessMode: ReadWriteMany
          size: 10Gi
          storageClass: longhorn

    # Redis/Valkey component
    valkey:
      enabled: true
