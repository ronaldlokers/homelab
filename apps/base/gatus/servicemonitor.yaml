apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gatus
  namespace: gatus
  labels:
    release: kube-prometheus-stack
    # Selected by the long-term Prometheus too, which keeps 400 days: a month
    # in review needs more history than the main instance's ten days.
    name: gatus
spec:
  selector:
    matchLabels:
      app: gatus
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
