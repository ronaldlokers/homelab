apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  config.yaml: |
    metrics: true

    storage:
      type: memory

    ui:
      title: "Homelab Status — Staging"
      header: "Homelab Status (staging)"

    endpoints:
      - name: linkding
        group: homelab
        url: "https://linkding.staging.ronaldlokers.nl/health"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
      - name: immich
        group: homelab
        url: "https://immich.staging.ronaldlokers.nl/api/server/ping"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
      - name: mealie
        group: homelab
        url: "https://mealie.staging.ronaldlokers.nl/api/app/about"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
      - name: lokilabs-healthz
        group: external
        url: "https://lokilabs.nl/api/healthz"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"

    # ---------------------------------------------------------------------------
    # Push / heartbeat (dead-man's-switch) template — config-as-code ready.
    # Uncomment and provide HEARTBEAT_TOKEN via a SOPS secret (env substitution)
    # to enable. Left disabled so an unpinged endpoint doesn't false-alert.
    # ---------------------------------------------------------------------------
    # external-endpoints:
    #   - name: example-cronjob
    #     group: heartbeats
    #     token: "${HEARTBEAT_TOKEN}"
    #     heartbeat:
    #       interval: 30m
    #     conditions:
    #       - "[STATUS] == 200"

    # ---------------------------------------------------------------------------
    # Alerting via ntfy — staging has no in-cluster ntfy (production-only), so this
    # is a ready template pointing at the production instance. Add a topic/token
    # (SOPS) and per-endpoint `alerts:` blocks to enable.
    # ---------------------------------------------------------------------------
    # alerting:
    #   ntfy:
    #     url: "https://ntfy.ronaldlokers.nl"
    #     topic: "homelab-gatus-staging"
    #     priority: 3
