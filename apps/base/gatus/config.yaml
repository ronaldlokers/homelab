metrics: true

storage:
  type: memory

ui:
  title: "Homelab Status — Staging"
  header: "Homelab Status (staging)"

endpoints:
  # Staging moved to the Let's Encrypt *production* issuer in #275, so these
  # certificates are publicly trusted and verification is on. Expiry is
  # checked here too now that the certificates are real ones worth watching —
  # a renewal that silently stops working is otherwise invisible until the
  # browser says so.
  - name: linkding
    group: homelab
    url: "https://linkding.staging.ronaldlokers.nl/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
  # Immich is not deployed on staging — it was removed from
  # apps/staging/kustomization.yaml as the largest contributor to the
  # convergence storm after a host reboot. Monitoring it here reported DOWN
  # permanently, which is worse than not monitoring it: a status page that is
  # always partly red is one nobody reads. Restore this endpoint in the same
  # change that restores the app.
  - name: mealie
    group: homelab
    url: "https://mealie.staging.ronaldlokers.nl/api/app/about"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
  # authentik is deliberately watched from Gatus rather than the other way
  # round. Gatus itself stays outside SSO precisely so that this check is
  # readable during an authentik outage — a status page that needs the thing
  # it is reporting on tells you nothing at the only moment it matters.
  - name: authentik
    group: homelab
    url: "https://authentik.staging.ronaldlokers.nl/-/health/live/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
  - name: tandoor
    group: homelab
    url: "https://tandoor.staging.ronaldlokers.nl/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
  - name: lokilabs-healthz
    group: external
    url: "https://lokilabs.nl/api/healthz"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
  - name: proxmox
    group: infrastructure
    url: "https://proxmox.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"

