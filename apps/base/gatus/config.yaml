metrics: true

storage:
  type: memory

ui:
  title: "Homelab Status — Staging"
  header: "Homelab Status (staging)"

endpoints:
  # Staging uses the production issuer since #275, so verification and expiry
  # checks are meaningful here.
  - name: linkding
    group: homelab
    url: "https://linkding.staging.ronaldlokers.nl/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
  # Immich is not deployed on staging; restore this check with the app.
  - name: mealie
    group: homelab
    url: "https://mealie.staging.ronaldlokers.nl/api/app/about"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
  # Gatus stays outside SSO so this check is readable during an authentik
  # outage.
  - name: authentik
    group: homelab
    url: "https://authentik.staging.ronaldlokers.nl/-/health/live/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
  - name: tandoor
    group: homelab
    url: "https://tandoor.staging.ronaldlokers.nl/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
  - name: searxng
    group: homelab
    url: "https://searxng.staging.ronaldlokers.nl/healthz"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
  - name: lokilabs-healthz
    group: external
    url: "https://lokilabs.nl/api/healthz"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
  - name: proxmox
    group: infrastructure
    url: "https://proxmox.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"

