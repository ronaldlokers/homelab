---
# Reading the boards, and posting what they hold. Both hops need saying: the
# fizzy namespace denies ingress and campfire denies egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fizzy-digest-egress
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire-fizzy-digest
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fizzy
      ports:
        - protocol: TCP
          port: 80
    # The room it posts into.
    - to:
        - podSelector:
            matchLabels:
              app: campfire
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fizzy-digest-dns
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire-fizzy-digest
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The half the speedtest digest was missing twice: campfire admits each poster
# by name.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fizzy-digest-ingress-to-campfire
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: campfire-fizzy-digest
      ports:
        - protocol: TCP
          port: 80
---
# And the ingress half on fizzy's side.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fizzy-digest-ingress
  namespace: fizzy
spec:
  podSelector:
    matchLabels:
      app: fizzy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: campfire
          podSelector:
            matchLabels:
              app: campfire-fizzy-digest
      ports:
        - protocol: TCP
          port: 80
