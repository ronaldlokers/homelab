apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: "2026.5.6"
      sourceRef:
        kind: HelmRepository
        name: authentik
      interval: 12h
  values:
    # No Redis. authentik removed it in 2025.10 — caching, the embedded
    # outpost's session store and WebSocket IPC all moved to PostgreSQL, after
    # background tasks moved there in 2025.8. The requirements are now just
    # server, worker and PostgreSQL 14-18. Expect ~50% more database
    # connections than the old architecture used, which is why max_connections
    # on the shared cluster is worth watching after this lands.
    #
    # The chart still ships a Bitnami PostgreSQL subchart behind
    # postgresql.enabled; it stays off. This uses the shared postgres-cluster
    # with its own role and database, like every other app here (#219).
    postgresql:
      enabled: false

    authentik:
      # existingSecret does NOT merge with values under `authentik:`. Setting it
      # makes the chart wire the container with a single `envFrom: secretRef`
      # and emit no other environment at all, so anything configured here is
      # silently ignored. Putting the database host in values and the password
      # in the secret produced exactly that: authentik ignored the host and fell
      # back to its built-in default.
      #
      #   PostgreSQL connection failed, retrying...
      #   connection to server at "127.0.0.1", port 5432: Connection refused
      #
      # So the whole configuration lives in the Secret. For discoverability,
      # since those values are encrypted and cannot be read from git:
      #
      #   AUTHENTIK_POSTGRESQL__HOST  postgres-cluster-rw.database.svc.cluster.local
      #   AUTHENTIK_POSTGRESQL__PORT  5432
      #   AUTHENTIK_POSTGRESQL__NAME  authentik
      #   AUTHENTIK_POSTGRESQL__USER  authentik
      #
      # Anything added under `authentik:` here will do nothing while this is
      # set. Add it to the Secret instead.
      existingSecret:
        secretName: authentik-secret

    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi

    worker:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
