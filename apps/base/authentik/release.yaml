apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: "2026.8.0"
      sourceRef:
        kind: HelmRepository
        name: authentik
      interval: 12h
  values:
    # No Redis. authentik removed it in 2025.10 — caching, the embedded
    # outpost's session store and WebSocket IPC all moved to PostgreSQL, after
    # background tasks moved there in 2025.8. The requirements are now just
    # server, worker and PostgreSQL 14-18. Expect ~50% more database
    # connections than the old architecture used, which is why max_connections
    # on the shared cluster is worth watching after this lands.
    #
    # The chart still ships a Bitnami PostgreSQL subchart behind
    # postgresql.enabled; it stays off. This uses the shared postgres-cluster
    # with its own role and database, like every other app here (#219).
    postgresql:
      enabled: false

    authentik:
      # existingSecret does NOT merge with values under `authentik:`. Setting it
      # makes the chart wire the container with a single `envFrom: secretRef`
      # and emit no other environment at all, so anything configured here is
      # silently ignored. Putting the database host in values and the password
      # in the secret produced exactly that: authentik ignored the host and fell
      # back to its built-in default.
      #
      #   PostgreSQL connection failed, retrying...
      #   connection to server at "127.0.0.1", port 5432: Connection refused
      #
      # So the whole configuration lives in the Secret. For discoverability,
      # since those values are encrypted and cannot be read from git:
      #
      #   AUTHENTIK_POSTGRESQL__HOST  postgres-cluster-rw.database.svc.cluster.local
      #   AUTHENTIK_POSTGRESQL__PORT  5432
      #   AUTHENTIK_POSTGRESQL__NAME  authentik
      #   AUTHENTIK_POSTGRESQL__USER  authentik
      #   AUTHENTIK_EMAIL__HOST       smtp.protonmail.ch
      #   AUTHENTIK_EMAIL__PORT       587
      #   AUTHENTIK_EMAIL__USERNAME   authentik@lokilabs.nl
      #   AUTHENTIK_EMAIL__FROM       authentik@lokilabs.nl
      #   AUTHENTIK_EMAIL__USE_TLS    true
      #   AUTHENTIK_EMAIL__USE_SSL    false
      #
      # USE_TLS means STARTTLS in authentik's vocabulary and USE_SSL means
      # implicit TLS, so 587 wants USE_TLS. That is the opposite of Fizzy,
      # where SMTP_TLS maps to Mail's `tls:` and means implicit TLS on 465 —
      # the same relay, the same port, and the flag has to be set in one and
      # left unset in the other. Read the app's own mapping before copying.
      #
      # Egress on 587 was already allowed in network-policies.yaml, ahead of
      # anything being able to use it.
      #
      # Anything added under `authentik:` here will do nothing while this is
      # set. Add it to the Secret instead.
      existingSecret:
        secretName: authentik-secret

    global:
      # Reloader opt-in, and it has to be a chart value rather than a kustomize
      # patch: the Deployments are created by Helm, so a patch targeting
      # `kind: Deployment` in an overlay matches nothing at all. Without the
      # annotation a SOPS secret rotation applies cleanly and the pods keep
      # serving the old value, because env and envFrom are injected only at pod
      # creation.
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"

      # Blueprints are mounted where authentik watches and re-applies hourly,
      # so what is in git is what is running rather than something clicked once
      # that exists only in the database. Both clusters mount both directories;
      # each overlay supplies its own `authentik-blueprints`.
      volumes:
        - name: blueprints
          secret:
            # A Secret, not a ConfigMap: it carries the OIDC client secrets so
            # that recreating authentik does not invalidate every client.
            secretName: authentik-blueprints
        # Session policy, which carries no secrets and so is not in the Secret
        # above. authentik walks /blueprints with rglob("**/*.yaml") and
        # watches it recursively, so a second directory is discovered exactly
        # like the first.
        - name: blueprint-session
          configMap:
            name: authentik-blueprint-session
      volumeMounts:
        - name: blueprints
          mountPath: /blueprints/custom
          readOnly: true
        - name: blueprint-session
          mountPath: /blueprints/session
          readOnly: true

    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi

    # 384Mi rather than the 512Mi both components started with, because the
    # worker has never come close to it. Peak working set over seven days is
    # 360Mi in production and it sits at 276Mi in staging, so the old request
    # reserved ~150Mi on a node that nothing would ever use. Requests are a
    # scheduling reservation, not a cap — a busier worker still grows past this
    # number, it just has to be scheduled somewhere that has the room.
    #
    # The server moved the other way and is sized in the production overlay,
    # since staging's server carries no load worth reserving for.
    worker:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
