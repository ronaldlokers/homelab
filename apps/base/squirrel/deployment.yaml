apiVersion: apps/v1
kind: Deployment
metadata:
  name: squirrel
  namespace: campfire
spec:
  # One replica, and unlike the other campfire workloads this is not a
  # preference. The spool is ReadWriteOnce and it *is* the durability
  # guarantee: a second replica could not mount it, and two processes draining
  # one directory would race to delete files the other had already inserted.
  replicas: 1
  strategy:
    # Recreate, not the default RollingUpdate. Rolling starts the new pod
    # before the old one releases the RWO volume, so the replacement sits
    # Pending on a multi-attach error until the rollout times out. Every other
    # bot here is stateless and never had to say this.
    type: Recreate
  selector:
    matchLabels:
      app: squirrel
  template:
    metadata:
      labels:
        app: squirrel
    spec:
      securityContext:
        runAsNonRoot: true
        # 65532 is distroless's `nonroot`, which is what the image runs as.
        runAsUser: 65532
        runAsGroup: 65532
        # Longhorn hands over a root-owned filesystem. Without fsGroup the
        # nonroot user cannot write the spool, /healthz answers 503 forever,
        # and the pod never goes ready — so it never receives a webhook, and
        # Campfire does not retry the ones it missed. The failure is total and
        # completely silent from the room's side.
        fsGroup: 65532
      containers:
        - name: squirrel
          image: ghcr.io/ronaldlokers/squirrel
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPOOL_DIR
              value: /var/spool/squirrel
            # Where photographs are kept. Unset would be a supported state —
            # the screen simply never offers a camera — so this is the whole of
            # turning the feature on, alongside the volume below.
            - name: PHOTO_DIR
              value: /var/lib/squirrel/photos
            # Seeds the `people` row every boot. Identities bind to it, so that
            # a second transport later resolves to the same person rather than
            # to a second one.
            - name: OWNER_HANDLE
              value: ronald
            # The scheduler has arrived, so the key has too. This pod now holds
            # a credential that can post as @squirrel into any room it can
            # reach — the most sensitive thing in this namespace. See
            # docs/runbooks/squirrel.md for where it came from and how to
            # rotate it.
            #
            # Both of these are needed together and the binary only checks one
            # direction: a key without a URL is rejected at boot, a URL without
            # a key is not. Setting the URL alone leaves Send nil, so the
            # digest and every reply go missing — and the 🐿️ receipt goes with
            # them, because the boost is built from the same base URL.
            - name: CAMPFIRE_BASE_URL
              value: "http://campfire.campfire.svc.cluster.local"
            - name: CAMPFIRE_BOT_KEY
              valueFrom:
                secretKeyRef:
                  name: squirrel-campfire
                  key: CAMPFIRE_BOT_KEY
            # Stated rather than left to the binary's default, which happens
            # to agree with it today. The evening hour is load-bearing twice —
            # it is the clock trigger for the daily nudge and the slot the
            # capture list is sent in, and on a quiet day the two share one
            # message precisely because they are the same instant. A default
            # that drifted in a later release would move both at once.
            - name: EVENING_AT
              value: "19:00"
            # Named DIGEST_TZ, not EVENING_TZ: the daily digest it belonged to
            # is gone, but v0.4.0 renamed only DIGEST_AT. Nothing outside the
            # binary reads it, so the rename is free whenever that file is next
            # opened. Until then the pairing reads odder than it is.
            - name: DIGEST_TZ
              value: "Europe/Amsterdam"
            # The presence route, which Home Assistant calls when I get home.
            # It is the only path on this pod reachable from outside the
            # namespace, so it is stated rather than defaulted: the Ingress in
            # apps/production/squirrel routes exactly this path and nothing
            # else, and the two have to agree or the hop 404s.
            - name: PRESENCE_PATH
              value: /hooks/home
            # You have a coat on. The nudge is deliberately not sent at the
            # moment of arrival, and the same window debounces the several
            # pings a phone flapping between wifi and cellular produces.
            - name: PRESENCE_DELAY
              value: 2m
            # optional: true is what makes the ordering safe. Without the
            # secret the binary refuses to mount the route at all and logs a
            # warning — subtle.ConstantTimeCompare("", "") returns 1, so an
            # empty secret would otherwise authenticate every caller,
            # including one sending no header. A missing Secret therefore
            # costs the presence trigger and nothing else: captures, the nudge
            # that rides back on a message, and the 19:00 fallback all carry
            # on. That is also why this rolls out before the Secret exists.
            - name: PRESENCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: squirrel-presence
                  key: PRESENCE_SECRET
                  optional: true
            # The screen. Empty means the routes are never registered at
            # all — not registered and refusing, which is why this is a plain
            # value and not an optional secretKeyRef like PRESENCE_SECRET
            # above: a mis-wired Secret would silently unmount the whole
            # screen, and this is a username rather than a credential. What
            # authenticates is authentik, in front.
            #
            # It is compared byte for byte against what the forward-auth
            # middleware puts in X-Authentik-Username, so it has to match the
            # authentik username exactly — not the e-mail, not the display
            # name, and not OWNER_HANDLE above, which is the Campfire handle
            # and happens to be a different word. Getting it wrong looks like a
            # blank white page after a successful login: squirrel answers 403
            # with no body, deliberately, and says `refused the pile` with the
            # identity it saw in its log.
            - name: WEB_IDENTITY
              value: ronaldlokers
            # Web Push, and the only thing squirrel will ever interrupt me
            # for: "leave about 14:10" has one useful minute, and a Campfire
            # notification noticed at 14:40 is worse than none because it
            # teaches me not to trust the next one. Everything else it says —
            # the nudge, the evening message — is a suggestion, and a
            # suggestion that waits is doing its job.
            #
            # The public key is meant to be handed to every browser that
            # subscribes, so it is a plain value like WEB_IDENTITY above rather
            # than a secret. It has to match the private half in
            # squirrel-push exactly: a mismatched pair is not a startup error,
            # it is every push being refused by the push service weeks later.
            - name: VAPID_PUBLIC_KEY
              value: BPSmoA-FOxemmpG78Aq66XOze8b10jqxV5ik0ymm48QbEORt3ekQMmk2L_KP9hHNai3WYjjquCrRZkkl_huccxk
            # An address the push service is entitled to complain to. Part of
            # RFC 8292 rather than a courtesy — services reject a token without
            # one — and it reaches Google and Mozilla by design, so it is not a
            # secret either.
            - name: PUSH_CONTACT
              value: mailto:ronald@lokers.email
            # optional: true for the same reason PRESENCE_SECRET has it, and
            # with a better failure: the binary requires all three settings
            # before it will push at all, and the screen requires all three
            # before it will even offer to subscribe. A missing Secret
            # therefore costs the leave-by push and nothing else — the same
            # warning still reaches the Campfire room, which is the channel
            # that always works — and the browser is never asked for a
            # permission that would be spent on silence.
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: squirrel-push
                  key: VAPID_PRIVATE_KEY
                  optional: true
            # The coach. optional: true for the same reason every other
            # credential here has it, and with the gentlest failure of the
            # four: with no key the binary never builds a coach at all, so
            # PickNow() and UnstuckFor() answer instead — the deterministic
            # floor they were kept as. Nothing about the product stops
            # working; it stops being clever.
            #
            # This is the only credential here that can spend money. Squirrel's
            # own monthly counter guards against its own bugs; set a hard spend
            # limit on the OpenAI project to guard against everything else.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: squirrel-openai
                  key: OPENAI_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Both probes hit /healthz, which checks that the spool is writable
          # and deliberately does NOT check Postgres.
          #
          # A readiness probe that failed during a database outage would pull
          # this pod out of its Service. Campfire's delivery would then fail,
          # and Campfire never retries — converting a survivable outage into
          # permanent data loss. The whole point of the spool is that the
          # database can be down and captures still land.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: spool
              mountPath: /var/spool/squirrel
            # Its own volume rather than a directory inside the spool's: the
            # spool is empty in steady state and exists to be drained, and
            # photographs are kept forever. Two lifetimes, two claims, and a
            # backup policy that can differ later without moving files.
            - name: photos
              mountPath: /var/lib/squirrel/photos
      volumes:
        - name: spool
          persistentVolumeClaim:
            claimName: squirrel-spool
        - name: photos
          persistentVolumeClaim:
            claimName: squirrel-photos
