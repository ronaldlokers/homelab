---
# Campfire is the only thing allowed to reach Squirrel, and this rule is the
# only authentication the webhook has: Campfire signs nothing and sends no
# shared secret, so "who can open a socket to port 8080" is the whole control.
#
# The campfire namespace default-denies both directions, so the same hop has to
# be said twice — ingress here, egress below. Same-namespace is not the same as
# allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-campfire-to-squirrel
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: squirrel
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: campfire
      ports:
        - protocol: TCP
          port: 8080
---
# The egress half. campfire's allow-internet-egress excludes 10.0.0.0/8, which
# the pod CIDR sits inside, so without this the webhook never leaves Campfire
# and the room gets "Failed to respond within 7 seconds" with nothing in
# Squirrel's log to explain it — because nothing ever arrived.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-campfire-egress-to-squirrel
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: squirrel
      ports:
        - protocol: TCP
          port: 8080
---
# Squirrel reaches Postgres and Campfire, and nothing else. The Campfire hop
# is new with the scheduler: the daily digest and the 🐿️ boost are the only
# two things this workload ever initiates, and both are outbound HTTP to
# Campfire on port 80. Replies to a webhook still travel inside that webhook's
# own HTTP response and need no rule at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-squirrel-egress
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: squirrel
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: campfire
      ports:
        - protocol: TCP
          port: 80
    # authentik, through the real ingress.
    #
    # squirrel runs the OIDC flow itself from v0.39.0, which means it makes
    # server-to-server calls it never made before: discovery, the token
    # exchange and the JWKS. Forward auth needed none of them — Traefik called
    # the outpost and squirrel spoke to nobody — so no rule for this has ever
    # existed, and its absence was invisible until the day it took both
    # clusters down.
    #
    # Through Traefik rather than to authentik's Service, and that is not a
    # detail. authentik builds every URL in its discovery document from the
    # host it was asked on: fetched over the cluster Service it answers
    # `"issuer": "http://localhost:9000/..."` and hands the browser an
    # authorization endpoint nobody outside can reach. The public hostname has
    # to be the one asked, so the request goes out through the ingress and
    # comes back — the same path the browser takes.
    #
    # **Port 8443, not 443.** Egress is evaluated against the post-DNAT
    # destination and Traefik's Service maps 443 -> 8443, so a rule naming 443
    # never matches and every connection is refused. That is also why the
    # namespace's allow-internet-egress does not already cover this: it permits
    # 0.0.0.0/0 on 80 and 443 while excluding 10.0.0.0/8, and the ingress VIP
    # sits inside that exclusion. See apps/production/gatus, which learned the
    # same thing on 3 August 2026.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443
---
# Campfire's ingress half. The namespace default-denies both directions, so
# the hop has to be said from both ends — and this is the end that is easy to
# forget, because the egress rule above looks like the whole story.
#
# Worth knowing how it fails if it is missing: the capture still lands and the
# room still gets its receipt is the one thing that is NOT true here — the
# boost goes out over this same hop. Captures stay durable regardless, but
# every receipt and every digest silently stops.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-squirrel-to-campfire
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: squirrel
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-squirrel-dns
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: squirrel
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The database's own half. allow-apps-ingress admits namespaces labelled
# homelab.io/needs-database, and campfire is not one of them — it has no
# database of its own, only workloads that use someone else's.
#
# Worth knowing how this fails if it is missing: the drain defers rather than
# errors, so captures keep landing on disk and the room keeps getting its
# squirrel. Nothing reaches Postgres and nothing tells you, until the spool
# directory is the only place a week of thoughts exists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-squirrel-ingress
  namespace: database
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: campfire
          podSelector:
            matchLabels:
              app: squirrel
      ports:
        - protocol: TCP
          port: 5432
