# Where the photographs live.
#
# A photograph of a letter or a serial plate, taken instead of transcribing it.
# They are kept on a volume beside the pod rather than in object storage,
# decided on 20 August 2026: this cluster has no object storage, and adding
# MinIO or Garage would mean a service to patch, back up and keep alive for one
# feature.
#
# What that costs is real and is the reason this file exists rather than a
# bucket: photographs join the pod's lifecycle, and a Postgres restore alone no
# longer restores everything. The rows would come back pointing at files that
# were not there — a note rendering a broken picture, which is a worse thing to
# find than a missing one.
#
# So this claim is backed up, and for a stronger reason than the spool's
# quarantine is. A spooled capture is in flight for under a second in steady
# state; a photograph is kept forever and exists nowhere else. Postgres holds
# only the name of the file.
#
# It does not take backup-daily, though, and that is deliberate. The file is
# written before its row, so a backup taken before the database dump restores a
# row pointing at a file nothing holds — the broken direction named above.
# backup-after-the-dump runs an hour clear of the dump instead; the reasoning is
# in infrastructure/controllers/production/longhorn/recurring-jobs.yaml.
#
# storageClassName is omitted and set per overlay, the same as the spool:
# production annotates both local-path and longhorn as default, so an
# unqualified claim binds non-deterministically.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: squirrel-photos
  namespace: campfire
  labels:
    recurring-job.longhorn.io/backup-after-the-dump: enabled
    recurring-job.longhorn.io/snapshot-daily: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # A phone photograph is two to four megabytes and the app refuses
      # anything over eight. 5Gi is on the order of a thousand of them, which
      # is years of photographing the occasional letter — and Longhorn volumes
      # expand in place, so being wrong here is a one-line change rather than a
      # migration.
      storage: 5Gi
