---
# Default deny all ingress traffic in campfire namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: campfire
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Default deny all egress traffic in campfire namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: campfire
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Allow DNS queries from campfire namespace to kube-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: campfire
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow ingress from Traefik (kube-system) to campfire pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-traefik
  namespace: campfire
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
---
# Two things need the internet: Web Push (deliveries go to Apple's and Google's
# push endpoints, which is the entire notification path on iOS) and link
# unfurling, which fetches whatever URL someone pastes into a room.
#
# The unfurler is the reason for the exclusions. It fetches attacker-chosen URLs
# by design, so without them a pasted link could reach the cluster API, the
# Longhorn UI, the NAS, or link-local metadata. Upstream hardened this itself in
# 2026-07 by blocking IPv6 addresses that map to internal ranges, which says
# they consider it a live risk too. The ipBlock except filters on the resolved
# destination IP, so it also defeats DNS rebinding for these ranges.
#
# IPv6 egress needs no rule: nothing grants an IPv6 allow, so default-deny-egress
# already blocks it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-egress
  namespace: campfire
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8        # RFC1918 private
              - 172.16.0.0/12     # RFC1918 private
              - 192.168.0.0/16    # RFC1918 private
              - 169.254.0.0/16    # link-local / cloud metadata
              - 127.0.0.0/8       # loopback
              - 100.64.0.0/10     # CGNAT (RFC6598)
              - 192.0.0.0/24      # IETF protocol assignments
              - 198.18.0.0/15     # benchmarking
              - 224.0.0.0/4       # multicast
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
