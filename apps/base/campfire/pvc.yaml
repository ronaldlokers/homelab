# Campfire keeps EVERYTHING here: the SQLite database and every uploaded
# attachment, both under /rails/storage. There is no external database, so this
# claim is the entire application state — losing it loses the account, the
# rooms and the history.
#
# That makes what backs this volume up the whole backup story, rather than a
# second line of defence as it is for the Postgres-backed apps. What backs it
# up is the `default` Longhorn recurring-job group, which every volume in the
# cluster belongs to (see
# infrastructure/controllers/production/longhorn/recurring-jobs.yaml) — not a
# label on this PVC; `recurring-job.longhorn.io/*` labels on a PVC select
# nothing (#683). A schedule specific to this volume would need a
# `recurringJobSelector` on the StorageClass or a label on the Longhorn
# `Volume` itself.
# Worth knowing what that story is worth: a volume snapshot of a live SQLite
# database can capture a torn write, because upstream's own documentation warns
# the database "may be written to at any moment". For chat history that is an
# acceptable risk; it would not be for anything transactional.
#
# storageClassName is deliberately omitted here and set per overlay: production
# annotates BOTH local-path and longhorn as default, so an unqualified claim
# binds non-deterministically. Same reasoning as linkding and commafeed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: campfire-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Database is tiny; attachments are what grow. Longhorn volumes can be
      # expanded in place, so start small rather than reserving replicated NVMe
      # against a guess.
      storage: 5Gi
