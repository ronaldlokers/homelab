---
# Campfire is the only thing allowed to reach the bot, and this rule is the
# only authentication the webhook has: Campfire signs nothing and sends no
# shared secret, so "who can open a socket to port 8080" is the whole control.
#
# The campfire namespace default-denies both directions, so the same hop has to
# be said twice — ingress here, egress below. Same-namespace is not the same as
# allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-campfire-to-status-bot
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire-status-bot
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: campfire
      ports:
        - protocol: TCP
          port: 8080
---
# The egress half. campfire's allow-internet-egress excludes 10.0.0.0/8, which
# the pod CIDR sits inside, so without this the webhook never leaves Campfire
# and the room gets "Failed to respond within 7 seconds" with nothing in the
# bot's log to explain it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-campfire-egress-to-status-bot
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: campfire-status-bot
      ports:
        - protocol: TCP
          port: 8080
---
# `why` answers asynchronously, which made the bot a *sender* for the first
# time. Every other verb replies in the HTTP response body, so until now the
# only hop was campfire -> bot, and the reverse direction was never allowed.
#
# The symptom was a "thinking…" message and then silence: the model ran, the
# answer was paid for, and the post failed with ECONNREFUSED. Refused rather
# than timed out because k3s enforces NetworkPolicy with REJECT — a connection
# refused between two pods in a default-deny namespace is a policy, not a
# listener that is down.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-status-bot-egress-to-campfire
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire-status-bot
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: campfire
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-status-bot-ingress-to-campfire
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: campfire-status-bot
      ports:
        - protocol: TCP
          port: 80
---
# The briefing's egress half, for the one question it asks that the Kubernetes
# API cannot answer: what fired overnight and then resolved. The matching
# ingress rule is in infrastructure/configs/production, next to the other
# cross-namespace rules into monitoring.
#
# Only the CronJob needs this, but the label is shared with the Deployment, so
# the webhook pod gets it too. Widening a read-only path to a metrics endpoint
# it never calls is a smaller cost than a second label and a second copy of
# every other rule that label already grants.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-status-bot-egress-to-prometheus
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire-status-bot
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
