apiVersion: apps/v1
kind: Deployment
metadata:
  name: campfire-status-bot
  namespace: campfire
spec:
  # Stateless and idle between mentions. One replica: Campfire delivers each
  # webhook once with no retry, so a second would add nothing but a second
  # ServiceAccount token in flight.
  replicas: 1
  selector:
    matchLabels:
      app: campfire-status-bot
  template:
    metadata:
      labels:
        app: campfire-status-bot
    spec:
      serviceAccountName: campfire-status-bot
      securityContext:
        runAsNonRoot: true
        # The image runs as `node` (uid 1000); 65534 has no home in it.
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: bot
          # renovate: datasource=github-releases depName=ronaldlokers/stringer
          image: ghcr.io/ronaldlokers/stringer:v0.6.0
          args: ["status"]
          ports:
            - name: http
              containerPort: 8080
          # Still no bot key: replies travel back in the HTTP response body,
          # and `why` posts asynchronously to the room.path Campfire hands it
          # in the payload, which already embeds the key. The API key is the
          # one credential here, and only `why` uses it.
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: campfire-status-bot
                  key: ANTHROPIC_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # /healthz is liveness only and does not touch the API. A check that
          # proved RBAC would mean an API read every 10s — more traffic than
          # the bot itself makes — and broken RBAC already shows up in the
          # answer, under "not checked".
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
