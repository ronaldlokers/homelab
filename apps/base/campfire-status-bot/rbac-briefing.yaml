# The briefing's own identity, separate from the responder's.
#
# They ran as one ServiceAccount, which was fine while they did the same thing.
# It stops being fine the moment the briefing takes on checks that read
# Secrets: the responder is the process that reads pod logs and feeds them to a
# model, and what bounds an injected instruction arriving that way is that its
# token cannot read a Secret, cannot exec and cannot write anything. Widening
# that token to suit a nightly job would trade a hard boundary for a soft one —
# "the tool list happens not to expose it".
#
# So the briefing gets its own. It reads the same kinds the responder does,
# minus pod logs and events, which only `why` needs, plus whatever a check it
# has absorbed needs — each such grant carries its reason below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: campfire-morning-briefing
  namespace: campfire
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: campfire-morning-briefing
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # The workloads whose Secret references are checked.
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: [kustomizations]
    verbs: [list]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: [helmreleases]
    verbs: [list]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: [clusters]
    verbs: [list]
  - apiGroups: ["cert-manager.io"]
    resources: [certificates]
    verbs: [list]
  - apiGroups: ["longhorn.io"]
    resources: [volumes]
    verbs: [list]
  # For the secret-reference check, which absorbed the standalone
  # secret-refs-check CronJob. It needs `list` to know which Secrets exist, and
  # `get` to compare a mirrored credential against its source in `database`.
  #
  # RBAC cannot say "names only" — `list` on secrets returns values — so the
  # narrowing is done in the request instead: the cluster-wide list asks for
  # PartialObjectMetadataList, and the API server drops every value server-side.
  # Only names that exist both in `database` and elsewhere are then fetched in
  # full, one at a time.
  #
  # This is why the briefing has its own ServiceAccount. The responder, which
  # feeds pod logs to a model, does not get this rule.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: campfire-morning-briefing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: campfire-morning-briefing
subjects:
  - kind: ServiceAccount
    name: campfire-morning-briefing
    namespace: campfire
