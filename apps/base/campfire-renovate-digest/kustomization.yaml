# No `namespace:` here on purpose — each resource declares its own, matching
# campfire-alert-bridge and campfire-status-bot. All three live in the campfire
# namespace so the hop to Campfire stays in-cluster and in-namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cronjob.yaml
  - network-policies.yaml

# No configMapGenerator: the code lives in ghcr.io/ronaldlokers/stringer and
# arrives by image tag, which Renovate bumps like any other image here. See
# docs/campfire/migration-to-stringer.md.
