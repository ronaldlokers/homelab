# Monday morning: the digest is something to read before deciding what to merge
# that week, not an alert. Renovate itself runs hourly, so the backlog this
# summarises is already up to date whenever this fires.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: campfire-renovate-digest
  namespace: campfire
spec:
  schedule: "0 8 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: campfire-renovate-digest
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # The image runs as `node` (uid 1000); 65534 has no home and npm's
            # entrypoint does not need one, but the uid must exist in the image
            # for runAsNonRoot to be satisfiable without surprises.
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              # Untagged on purpose. Every stringer workload runs the same build, and the
              # tag that build is lives once, in the cluster overlay's `images:` block —
              # see apps/production/kustomization.yaml. Five separately-pinned copies is
              # how the bridge ended up four releases behind the briefing.
              image: ghcr.io/ronaldlokers/stringer
              args: ["renovate"]
              env:
                # GITHUB_TOKEN is Renovate's own token. It can write, which a
                # digest has no use for — worth replacing with a read-only
                # fine-grained token if this outlives the experiment.
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: campfire-renovate-digest
                      key: GITHUB_TOKEN
                # Still CAMPFIRE_URL: stringer reads it as a deprecated alias
                # for ROOM_URL, so the Secret can migrate on its own schedule
                # rather than on this one.
                - name: CAMPFIRE_URL
                  valueFrom:
                    secretKeyRef:
                      name: campfire-renovate-digest
                      key: CAMPFIRE_URL
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          # No script volume: the code is in the image now.
