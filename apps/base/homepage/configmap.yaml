apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    traefik: true
    gateway: false
  settings.yaml: |
    title: Homelab Dashboard
    favicon: https://gethomepage.dev/img/favicon.ico
    theme: dark
    color: slate
    headerStyle: clean
    hideVersion: true
    layout:
      - Services:
          style: row
          columns: 3
  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - icon: github.png
              href: https://github.com/ronaldlokers/homelab
              description: Homelab Repository
  services.yaml: |
    # Services will be configured in environment-specific overlays
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: kubernetes
        expanded: true
        cpu: true
        memory: true
    # Both boxes point at the self-hosted SearXNG, which is what replaced the
    # Kagi subscription these used to spend queries on.
    #
    # The production hostname on purpose, in base, for both clusters: the search
    # is issued by the browser rather than by this pod, and any browser that can
    # load a staging dashboard is on the LAN and can resolve the production
    # instance too. Splitting it per overlay would duplicate the whole widget
    # block to change one hostname that nothing in-cluster ever contacts.
    #
    # No suggestionUrl: SearXNG's /autocompleter sends no CORS headers, so a
    # cross-origin fetch from homepage is rejected by the browser and the box
    # would just stop suggesting, silently.
    - quicklaunch:
        provider: custom
        url: https://searxng.ronaldlokers.nl/search?q=
        target: _blank
    - search:
        provider: custom
        url: https://searxng.ronaldlokers.nl/search?q=
        target: _blank
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
