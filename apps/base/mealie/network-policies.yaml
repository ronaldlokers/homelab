---
# Default deny all ingress traffic in mealie namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Default deny all egress traffic in mealie namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Allow DNS queries from mealie namespace to kube-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow ingress from Traefik (kube-system) to mealie pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-traefik
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
---
# Allow Prometheus to scrape mealie pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
---
# Allow mealie to connect to PostgreSQL in database namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database-egress
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5432
---
# Allow mealie to fetch recipes from external URLs (recipe import).
# Excludes internal/reserved IPv4 ranges so the scraper can't be pointed at
# cluster, LAN, or link-local/metadata services (SSRF guard). The ipBlock
# except filters on the resolved destination IP, so it also defeats DNS
# rebinding for these ranges. IPv6 egress needs no rule here: nothing grants
# an IPv6 allow, so default-deny-egress already blocks it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-egress
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8        # RFC1918 private
              - 172.16.0.0/12     # RFC1918 private
              - 192.168.0.0/16    # RFC1918 private
              - 169.254.0.0/16    # link-local / cloud metadata
              - 127.0.0.0/8       # loopback
              - 100.64.0.0/10     # CGNAT (RFC6598)
              - 192.0.0.0/24      # IETF protocol assignments
              - 198.18.0.0/15     # benchmarking
              - 224.0.0.0/4       # multicast
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
# Allow gatus to probe this app's health endpoint (production uptime monitoring)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gatus-ingress
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
      ports:
        - protocol: TCP
          port: 9000
