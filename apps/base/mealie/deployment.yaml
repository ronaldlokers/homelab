apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      securityContext:
        fsGroup: 911
      containers:
        - name: mealie
          ports:
            - name: http
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
          # Gates the liveness probe until the app has actually started.
          #
          # Without this, liveness begins after initialDelaySeconds and kills the
          # container once failureThreshold is reached — 120s total here. That is
          # ample on an idle cluster and not ample during convergence, when every
          # pod restarts at once and startup work contends for one disk.
          #
          # Observed on staging: linkding accumulated 47 restarts in 19 hours,
          # every one exiting "Completed" (exit 0) at almost exactly 120s — the
          # signature of SIGTERM from a failed liveness probe, not a crash.
          #
          # 30 x 10s gives startup five minutes; liveness then takes over
          # unchanged and still catches a process that dies later.
          startupProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
