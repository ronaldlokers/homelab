apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  # Required by the ReadWriteOnce linkding-data volume. A RollingUpdate starts
  # the replacement pod before the old one releases the claim, so if the two land
  # on different nodes the new pod blocks on a multi-attach error and the rollout
  # stalls. Every other PVC-backed workload here (commafeed, mealie, ntfy,
  # pgadmin, speedtest) uses Recreate for the same reason.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID
        runAsUser: 33 # www-data user ID
        runAsGroup: 33 # www-data group ID
      containers:
        - name: linkding
          ports:
            - name: http
              containerPort: 9090
          envFrom:
            - secretRef:
                name: linkding-container-env
          securityContext:
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Defined here rather than in each overlay patch: both environments
          # mounted this path identically, and keeping the mount next to the
          # claim means a new overlay cannot forget it and silently fall back to
          # ephemeral storage.
          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data
