# Secrets are granted per namespace rather than cluster-wide: the only ones
# needed are the object-store credentials next to the clusters. secret-refs-check
# has to read every namespace and says so in its own rbac.yaml; this one does
# not, so it should not.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recovery-source-check
  namespace: database
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recovery-source-check
  namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: recovery-source-check
subjects:
  - kind: ServiceAccount
    name: recovery-source-check
    namespace: recovery-source-check
