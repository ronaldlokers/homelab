apiVersion: v1
kind: ServiceAccount
metadata:
  name: recovery-source-check
  namespace: recovery-source-check
---
# Cluster-scoped, but read-only and narrow: the Cluster and ObjectStore specs
# say where each cluster recovers from and archives to, and the pods are where
# barman actually runs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: recovery-source-check
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: [clusters]
    verbs: [get, list]
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: [objectstores]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # barman-cloud-backup-list runs inside a cluster pod, because that is the
  # tool a real restore would use.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: recovery-source-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: recovery-source-check
subjects:
  - kind: ServiceAccount
    name: recovery-source-check
    namespace: recovery-source-check
---
# Secrets are granted per namespace rather than cluster-wide: the only ones
# needed are the object-store credentials next to the clusters. secret-refs-check
# has to read every namespace and says so in its own rbac.yaml; this one does
# not, so it should not.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recovery-source-check
  namespace: database
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recovery-source-check
  namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: recovery-source-check
subjects:
  - kind: ServiceAccount
    name: recovery-source-check
    namespace: recovery-source-check
