apiVersion: v1
kind: ServiceAccount
metadata:
  name: campfire-kube-actor
  namespace: campfire
---
# The point of this file is what is missing from it.
#
# No get, no list, no watch — this process never reads anything, so a bug here
# cannot exfiltrate. No secrets, no configmaps, no pods, no pods/log, no exec,
# no create, no delete. `patch` on two kinds is the entire grant.
#
# Kustomizations are namespaced to flux-system, so this is a Role rather than a
# ClusterRole. Deployments are everywhere, so that half has to be cluster-wide
# — see the ClusterRole below and the note on what bounds it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: campfire-kube-actor
  namespace: flux-system
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: [kustomizations]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: campfire-kube-actor
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: campfire-kube-actor
subjects:
  - kind: ServiceAccount
    name: campfire-kube-actor
    namespace: campfire
---
# Cluster-scoped because the restartable deployments live in fourteen
# namespaces, and fourteen RoleBindings that each need their namespace to exist
# is a worse failure mode than this grant.
#
# What bounds it is that `patch` is the only verb: the worst a compromised
# actor can do is roll a Deployment that was already running. It cannot read a
# Secret, scale to zero, or delete anything. The named allowlist in
# kube-actor.py is the finer control, and it is enforced before the patch is
# built rather than by RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: campfire-kube-actor
rules:
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: campfire-kube-actor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: campfire-kube-actor
subjects:
  - kind: ServiceAccount
    name: campfire-kube-actor
    namespace: campfire
