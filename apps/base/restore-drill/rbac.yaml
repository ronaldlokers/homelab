# What the drill may do, and — more to the point — what it may destroy.
#
# It runs in `database`, beside the clusters it restores, because a scratch
# cluster has to reach the same object store and the same Secret. Everything
# here is namespaced: nothing about this job concerns any other namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restore-drill
  namespace: database
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restore-drill
  namespace: database
rules:
  # Read every cluster: the drill derives each scratch cluster's recovery
  # config from the live one rather than carrying its own copy of a
  # destinationPath that would rot the next time a prefix is rotated.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: [clusters]
    verbs: [get, list, create]
  # Deletion is restricted by name, and that is the guard that matters.
  #
  # RBAC cannot limit `create` by name, so the drill could in principle create
  # a cluster called anything. It cannot delete one: these three names are the
  # only clusters this ServiceAccount may remove, so no bug, typo or injected
  # argument can turn a rehearsal into the disaster.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: [clusters]
    verbs: [delete]
    resourceNames: [drill-postgres, drill-immich, drill-nightscout]
  # The PVCs CloudNativePG leaves behind when a Cluster is deleted, which are
  # selected by the cnpg.io/cluster label rather than by name.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, delete]
  # Reading the restored database: which pods exist, and psql inside one.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restore-drill
  namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restore-drill
subjects:
  - kind: ServiceAccount
    name: restore-drill
    namespace: database
---
# PersistentVolumes are cluster-scoped, so this is the one piece of the drill
# that cannot be a namespaced Role no matter how it is written — and RBAC has
# no way to restrict it by name the way `delete clusters` above is restricted,
# because the PV names are Longhorn-generated at provision time.
#
# The scope this can't declare, the code supplies instead: destroy() only
# ever learns a PV name by reading .spec.volumeName off a PVC it already found
# through the drill-postgres/drill-immich/drill-nightscout label selector, so
# in practice this can only ever touch a PV bound to one of this drill's own
# scratch PVCs. `patch`, not `delete` — it only ever flips
# persistentVolumeReclaimPolicy to Delete; the PVC delete that the namespaced
# Role above already permits is what actually triggers the reclaim.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: restore-drill
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: restore-drill
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: restore-drill
subjects:
  - kind: ServiceAccount
    name: restore-drill
    namespace: database
