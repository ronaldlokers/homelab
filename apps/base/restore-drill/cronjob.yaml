# Restore every backup into a throwaway cluster, weekly, and see what comes back.
#
# 05:00 on Sunday, Europe/Amsterdam: three hours before Almanac files the
# week's sheets, so a failed drill is already in the room by the time anyone
# reads them.
#
# This used to also claim to sit clear of the 02:45-03:30 UTC backup window —
# true in winter, when 05:00 CET is 04:00 UTC, and false in summer, when
# 05:00 CEST is 03:00 UTC, squarely inside it. The ScheduledBackups run on a
# plain UTC cron with no timezone; this job's local-time schedule does not
# track them, and never has. That stopped mattering for correctness once the
# point-in-time restore started anchoring on each cluster's own
# ScheduledBackup instead of assuming it had already run (see
# restore-drill.py's backup_anchor()) — the schedule below is now free to sit
# wherever the Almanac timing wants it, DST included.
#
# The runbook claims an RTO of 20-30 minutes and an RPO of near-zero, and
# nothing has ever tested either. recovery-source-check proves the *pointer*
# resolves to a prefix with a recent backup — a catalogue listing, not a
# restore. This runs the restore.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-drill
  namespace: database
spec:
  schedule: "0 5 * * 0"
  timeZone: "Europe/Amsterdam"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A failed Job object is what keeps KubeJobFailed firing — the alert
      # tracks the object, not the failure — so this is how long one bad run
      # keeps alerting. A full cycle for a weekly job: the failure is still
      # here to investigate right up until the next run replaces it.
      ttlSecondsAfterFinished: 604800
      # No retry. Six restores that half-ran are worse than one clean failure:
      # the scratch clusters are deleted on the way out of each drill, and a
      # second attempt racing the first would fight over the same names.
      backoffLimit: 0
      # Twice the sum of the per-restore timeouts, so a wedged run is killed
      # rather than left holding Longhorn volumes until next Sunday.
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app: restore-drill
        spec:
          serviceAccountName: restore-drill
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drill
              # kubectl and python3 in one image, as the other checks use.
              image: alpine/k8s:1.36.2
              command: ["/bin/sh", "-c"]
              args:
                - |
                  python3 /opt/check/restore-drill.py
              env:
                # Almanac's room, mirrored into this namespace by reflector —
                # the credential itself lives once, in campfire.
                - name: CAMPFIRE_URL
                  valueFrom:
                    secretKeyRef:
                      name: campfire-almanac
                      key: CAMPFIRE_URL
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: script
                  mountPath: /opt/check
          volumes:
            - name: script
              configMap:
                name: restore-drill-script
