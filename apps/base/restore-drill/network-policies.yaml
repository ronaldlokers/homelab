---
# The drill posts its weekly record to Campfire, which is two namespaces away
# and denies ingress by default. Both halves are required — egress alone gets a
# connection refused at the far end, which is the mistake the speedtest digest
# made and took two runs to find.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-restore-drill-to-campfire
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: restore-drill
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: campfire
          podSelector:
            matchLabels:
              app: campfire
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-restore-drill-ingress-to-campfire
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app: restore-drill
      ports:
        - protocol: TCP
          port: 80
