---
# The check posts its finding into the Alertmanager room, so it needs the same
# hop every other poster in this namespace has. The campfire namespace
# default-denies both directions, so it has to be said twice — egress here,
# ingress below. Same-namespace is not the same as allowed.
#
# Until now this Job only talked to the Kubernetes API, which
# allow-campfire-status-bot-to-k8s-api already covers. Reporting what it found
# is what makes it a sender.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notify-check-egress-to-campfire
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire-notify-check
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: campfire
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notify-check-ingress-to-campfire
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: campfire-notify-check
      ports:
        - protocol: TCP
          port: 80
