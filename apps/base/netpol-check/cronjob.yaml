# Staging enforced no NetworkPolicy at all for weeks and nothing reported it
# (#282). A container restart fixed it and the cause was never established, so
# this watches for the recurrence rather than trusting that it will not happen.
#
# How a failure is reported differs per cluster, so the overlays supply the
# container args.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netpol-check
  namespace: netpol-check
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: netpol-check
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              # kubectl and python3 in one image, so the script runs unchanged.
              image: alpine/k8s:1.36.2
              command: ["/bin/sh", "-c"]
              args:
                - |
                  python3 /opt/check/netpol-check.py
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: script
                  mountPath: /opt/check
          volumes:
            - name: script
              configMap:
                name: netpol-check-script
