---
# Default deny all ingress traffic in searxng namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: searxng
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Default deny all egress traffic in searxng namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: searxng
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Allow DNS queries from searxng namespace to kube-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: searxng
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow ingress from Traefik (kube-system) to searxng pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-traefik
  namespace: searxng
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
---
# Allow Prometheus to scrape searxng pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: searxng
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
---
# Allow searxng to query the upstream search engines.
#
# This is the one workload here whose entire job is fetching arbitrary URLs on
# behalf of a user, so the SSRF guard matters more than elsewhere: image_proxy
# and favicon lookups both follow addresses that come back in results. The
# ipBlock except list filters on the resolved destination IP, so it also defeats
# DNS rebinding for these ranges. IPv6 egress needs no rule — nothing grants an
# IPv6 allow, so default-deny-egress already blocks it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-egress
  namespace: searxng
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8        # RFC1918 private
              - 172.16.0.0/12     # RFC1918 private
              - 192.168.0.0/16    # RFC1918 private
              - 169.254.0.0/16    # link-local / cloud metadata
              - 127.0.0.0/8       # loopback
              - 100.64.0.0/10     # CGNAT (RFC6598)
              - 192.0.0.0/24      # IETF protocol assignments
              - 198.18.0.0/15     # benchmarking
              - 224.0.0.0/4       # multicast
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
# Allow gatus to probe this app's health endpoint (production uptime monitoring)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gatus-ingress
  namespace: searxng
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
      ports:
        - protocol: TCP
          port: 8080
