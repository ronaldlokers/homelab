# Two failures this repo has already had, neither of which anything reported:
# a workload referencing a Secret that does not exist (five apps at once), and
# a mirrored credential drifting from its source (Immich, 500s for four hours).
#
# Daily rather than hourly: both failures are introduced by a change, not by
# drift over time, and a Secret that goes missing surfaces as a broken pod
# within the hour anyway.
#
# How a failure is reported differs per cluster, so the overlays supply the
# container args.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-refs-check
  namespace: secret-refs-check
spec:
  schedule: "41 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: secret-refs-check
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: alpine/k8s:1.36.2
              command: ["/bin/sh", "-c"]
              args:
                - |
                  python3 /opt/check/secret-refs-check.py
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: script
                  mountPath: /opt/check
          volumes:
            - name: script
              configMap:
                name: secret-refs-check-script
