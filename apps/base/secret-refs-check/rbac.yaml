apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-refs-check
  namespace: secret-refs-check
---
# This reads Secret contents in every namespace, which is a real privilege and
# the reason this file is worth reading before approving it.
#
# It cannot be narrowed. The existence half has to see Secrets wherever a
# workload runs, and the drift half compares the credential itself. RBAC has no
# way to express "names only" or "this key only" — a list request returns whole
# objects, so any narrowing would be client-side and not a control.
#
# What bounds the exposure is that one CronJob uses this ServiceAccount, it
# prints digests rather than values, and it has no path off the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-refs-check
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-refs-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-refs-check
subjects:
  - kind: ServiceAccount
    name: secret-refs-check
    namespace: secret-refs-check
