# Staging only. Production runs this check inside the morning briefing, which
# reports what drifted rather than only that a Job failed; staging has no
# Campfire to brief, so the CronJob is still how it gets asked there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: secret-refs-check
resources:
  - namespace.yaml
  - rbac.yaml
  - cronjob.yaml

# A copy of scripts/secret-refs-check.py: kustomize refuses to read files
# outside its own directory. validate.sh fails if the two diverge.
configMapGenerator:
  - name: secret-refs-check-script
    files:
      - secret-refs-check.py

generatorOptions:
  disableNameSuffixHash: true
