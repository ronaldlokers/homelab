---
# The campfire namespace default-denies both directions, so each hop of
# Alertmanager -> bridge -> Campfire needs saying out loud. The matching egress
# rule on the Alertmanager side lives in
# infrastructure/configs/base/network-policies/allow-alertmanager-to-campfire.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-to-bridge
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire-alert-bridge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 8080
---
# Same namespace is not the same as allowed: default-deny-egress covers pods in
# this namespace talking to each other too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bridge-egress-to-campfire
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire-alert-bridge
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: campfire
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bridge-ingress-to-campfire
  namespace: campfire
spec:
  podSelector:
    matchLabels:
      app: campfire
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: campfire-alert-bridge
      ports:
        - protocol: TCP
          port: 80
