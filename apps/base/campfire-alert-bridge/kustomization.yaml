# No `namespace:` here on purpose — each resource declares its own, matching
# recovery-source-check. These live in the campfire namespace so the hop to
# Campfire itself stays in-cluster and in-namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - network-policies.yaml

# No configMapGenerator: the code lives in ghcr.io/ronaldlokers/stringer and
# arrives by image tag, which Renovate bumps like any other image here. A tag
# change rolls the pod on its own, which is what the ConfigMap hash suffix used
# to be for. See docs/campfire/migration-to-stringer.md.
