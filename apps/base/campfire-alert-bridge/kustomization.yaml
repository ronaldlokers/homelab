# No `namespace:` here on purpose — each resource declares its own, matching
# recovery-source-check. These live in the campfire namespace so the hop to
# Campfire itself stays in-cluster and in-namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - network-policies.yaml

# Hash suffix left ON (unlike recovery-source-check, whose CronJob names the
# ConfigMap): the suffix changes when the script changes, which rewrites the
# Deployment's volume reference and rolls the pod. Without it an edited script
# applies cleanly and the running process keeps serving the old code.
configMapGenerator:
  - name: campfire-alert-bridge-script
    namespace: campfire
    files:
      - campfire-alert-bridge.py
