apiVersion: apps/v1
kind: Deployment
metadata:
  name: campfire-alert-bridge
  namespace: campfire
spec:
  # Stateless: it holds nothing between requests. One replica is enough for a
  # webhook that fires at most every groupInterval (5m), and a second would only
  # matter if Alertmanager could not retry — which it can, which is why publish
  # failures return 5xx.
  replicas: 1
  selector:
    matchLabels:
      app: campfire-alert-bridge
  template:
    metadata:
      labels:
        app: campfire-alert-bridge
    spec:
      securityContext:
        runAsNonRoot: true
        # The image runs as `node` (uid 1000); 65534 has no home in it.
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: bridge
          # Untagged on purpose. Every stringer workload runs the same build, and the
          # tag that build is lives once, in the cluster overlay's `images:` block —
          # see apps/production/kustomization.yaml. Five separately-pinned copies is
          # how the bridge ended up four releases behind the briefing.
          image: ghcr.io/ronaldlokers/stringer
          args: ["alerts"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # Each holds a room and a bot key, so each is a whole credential.
            # One destination per source: /alerts -> #Alertmanager, /flux -> #Flux.
            - name: CAMPFIRE_URL
              valueFrom:
                secretKeyRef:
                  name: campfire-alert-bridge
                  key: CAMPFIRE_URL
            # Where a cluster with no Campfire of its own files its
            # briefing. The briefing's own Secret rather than a copy of the
            # URL: same room, same bot key, and a second copy of a credential
            # is the drift secret-refs-check exists to catch.
            #
            # Unset would not break anything — /briefing is the one path whose
            # absence does not make the bridge unhealthy, because the Job that
            # files a briefing fails visibly in the cluster that sent it, while
            # Alertmanager and Flux retry a 404 in silence.
            - name: CAMPFIRE_BRIEFING_URL
              valueFrom:
                secretKeyRef:
                  name: campfire-morning-briefing
                  key: CAMPFIRE_URL
            # Who to wake, for firing alerts, Flux errors and check findings.
            # Not for resolutions, routine reconciliations or a clear.
            - name: CAMPFIRE_MENTION_SGID
              valueFrom:
                secretKeyRef:
                  name: campfire-mention
                  key: CAMPFIRE_MENTION_SGID
            - name: CAMPFIRE_FLUX_URL
              valueFrom:
                secretKeyRef:
                  name: campfire-alert-bridge
                  key: CAMPFIRE_FLUX_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # /healthz reports 503 while CAMPFIRE_URL is unset, so a missing or
          # mis-keyed secret fails the readiness gate instead of quietly
          # accepting alerts and dropping them.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
