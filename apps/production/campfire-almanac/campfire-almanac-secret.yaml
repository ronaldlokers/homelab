# Almanac: the bot that posts statistics, whatever their subject.
#
# One credential for every sheet rather than one per beat. The room and the bot
# key are both in the URL, so the whole value is the credential — and a second
# copy of it is the drift the bridge and the briefing already carry comments
# about.
#
# In-cluster, like the other digests: campfire's egress policy allows the
# `app: campfire` pod on :80 and nothing else, so the public hostname resolves
# to the LAN VIP and is refused. It also saves a round trip out to Traefik and
# back for a message that is already inside the cluster.
#
# Rotate by resetting the bot key in Campfire (User::Bot#reset_bot_key), which
# invalidates this immediately.
apiVersion: v1
kind: Secret
metadata:
    name: campfire-almanac
    namespace: campfire
    annotations:
        # The restore drill runs in `database` and files its weekly record as
        # Almanac. Reflector copies the payload there, rather than a second
        # encrypted copy of the same room URL living in this repository.
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: database
type: Opaque
stringData:
    CAMPFIRE_URL: ENC[AES256_GCM,data:FPeR0dJuqfDNdnb4prafKPBDM/fX7/nnlsds+ImjQ4ydtfzm88tNJsXjUyX57+OiOEiV1sVKB3Q2Gk6yaEGW8CjZqKdookhVQvY=,iv:bvA2z9opClogZT5vogibi0S2RM7TtUWjhmaUHgL0AG0=,tag:hbbooq9NijqKWmPQ9BVkMw==,type:str]
