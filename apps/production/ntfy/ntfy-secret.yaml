# ntfy server credentials and publisher accounts.
#
# auth-users is a comma-separated list of `name:bcrypt:role`. ntfy syncs it into
# user.db on startup, so the accounts are declarative rather than CLI state that
# would be lost with the volume.
#
# Every publisher has its own account granted write-only on exactly one topic
# (see NTFY_AUTH_ACCESS in deployment-patch.yaml). Anonymous publishing is no
# longer granted anywhere: auth-default-access is deny-all and the `*` entries
# are gone, so an unauthenticated POST is now rejected.
apiVersion: v1
kind: Secret
metadata:
    name: ntfy-secret
    namespace: ntfy
type: Opaque
