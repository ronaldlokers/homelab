# ntfy server credentials and publisher accounts.
#
# auth-users is a comma-separated list of `name:bcrypt:role`. ntfy syncs it into
# user.db on startup, so the accounts are declarative rather than CLI state that
# would be lost with the volume.
#
# Every publisher has its own account, granted write-only on just the topics it
# actually sends to (see NTFY_AUTH_ACCESS in deployment-patch.yaml). Anonymous
# publishing is not granted anywhere: auth-default-access is deny-all and there
# are no `*` entries, so an unauthenticated POST is rejected.
#
# There is deliberately no separate `deurbel` account. The doorbell notification
# is sent by Home Assistant, not by the doorbell itself, so the homeassistant
# account holds both topics and there is one credential to keep in sync instead
# of two.
