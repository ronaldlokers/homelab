# ntfy server credentials and publisher accounts.
#
# auth-users is a comma-separated list of `name:bcrypt:role`. ntfy syncs it into
# user.db on startup, so the accounts are declarative rather than CLI state that
# would be lost with the volume.
#
# Every publisher has its own account, granted write-only on just the topics it
# sends to (see NTFY_AUTH_ACCESS in deployment-patch.yaml). Anonymous publishing
# is not granted anywhere: auth-default-access is deny-all and there are no `*`
# entries, so an unauthenticated POST is rejected.
#
# There is deliberately no separate `deurbel` account — the doorbell
# notification is sent by Home Assistant, so that account holds both topics.
#
# gatus and proxmox were publishing with ACCESS TOKENS belonging to `ronald`,
# who is an admin and therefore has read-write on every topic. Scoping the other
# publishers achieved little while two admin-capable tokens were in circulation,
# so both now have their own write-only account.
