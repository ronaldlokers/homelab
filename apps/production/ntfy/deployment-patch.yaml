apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  template:
    spec:
      containers:
        - name: ntfy
          env:
            - name: NTFY_WEB_PUSH_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: ntfy-secret
                  key: web-push-public-key
            - name: NTFY_WEB_PUSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: ntfy-secret
                  key: web-push-private-key
            - name: NTFY_UPSTREAM_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ntfy-secret
                  key: upstream-access-token
            - name: NTFY_AUTH_FILE
              valueFrom:
                secretKeyRef:
                  name: ntfy-secret
                  key: auth-file
            - name: NTFY_AUTH_DEFAULT_ACCESS
              valueFrom:
                secretKeyRef:
                  name: ntfy-secret
                  key: auth-default-access
            - name: NTFY_AUTH_USERS
              valueFrom:
                secretKeyRef:
                  name: ntfy-secret
                  key: auth-users
            - name: NTFY_AUTH_ACCESS
              # One account per publisher, each write-only on only the topics
              # it actually sends to. homeassistant covers both `homeassistant`
              # and `deurbel`: the doorbell notification is sent by Home
              # Assistant, so a separate `deurbel` account would be a second
              # credential to keep in sync for the same publisher.
              #
              # homepage is the only reader: its dashboard widget polls the
              # gatus topic for a message count. read-only, one topic, and it
              # cannot publish anything.
              #
              # These were `*:<topic>:write-only` — `*` is anonymous, so anyone
              # on the internet could publish to all five. That let a stranger
              # spoof a doorbell press or a production Flux alarm. Reading was
              # never anonymous, so subscribers are unaffected.
              #
              # A grant must exist here BEFORE its publisher starts posting, or
              # the alerts stop arriving with no error anywhere — ntfy just 403s
              # the publish. flux-staging stays separate from flux so a wedged
              # staging cluster cannot bury a production alarm.
              value: "alertmanager:alerts:write-only,fluxprod:flux:write-only,fluxstaging:flux-staging:write-only,homeassistant:homeassistant:write-only,homeassistant:deurbel:write-only,gatus:homelab-gatus:write-only,gatus:homelab-gatus-staging:write-only,proxmox:proxmox:write-only,homepage:homelab-gatus:read-only"

