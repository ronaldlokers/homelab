apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: speedtest
resources:
- ../../base/speedtest
- ingress.yaml
- speedtest-env-secret.yaml
- prometheus-rbac.yaml

images:
- name: lscr.io/linuxserver/speedtest-tracker
  newTag: 1.14.7
patches:
- path: deployment-patch.yaml
# Opt in to Reloader: roll this workload when a mounted ConfigMap or Secret
# changes. Without it a SOPS secret rotation applies cleanly and the pod keeps
# serving the old value, because env/envFrom are injected only at pod creation.
- target:
    kind: Deployment
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: placeholder
      annotations:
        reloader.stakater.com/auto: "true"
