# Token Gatus uses to publish alerts to the ntfy homelab-gatus topic.
#
# This was an access token belonging to `ronald`, who is an ntfy admin — so it
# carried read-write on every topic, not just the one Gatus publishes to. It is
# now a token for the dedicated `gatus` account, which holds write-only on
# homelab-gatus and homelab-gatus-staging and nothing else (#165).
#
# Revoke the old admin token once this is confirmed working:
#   ntfy token list         # find the one labelled "gatus" under user ronald
#   ntfy token remove ronald <token>
