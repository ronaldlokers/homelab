# Production Gatus checks in-cluster services directly (the external VIP isn't
# reachable pod->VIP from inside), so it needs egress to the monitored app
# namespaces on their service ports, plus the Proxmox backend host. External
# targets on 443 (lokilabs) are covered by the base allow-egress-monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-internal-targets
  namespace: gatus
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              homelab.io/app: "true"
      ports:
        - protocol: TCP
          port: 9090 # linkding
        - protocol: TCP
          port: 2283 # immich-server
        - protocol: TCP
          port: 9000 # mealie
        - protocol: TCP
          port: 80 # ntfy (health check + alert publishing)
    - to:
        - ipBlock:
            cidr: 10.0.40.20/32
      ports:
        - protocol: TCP
          port: 8006 # proxmox backend
    # Grafana is checked on its Service rather than through the ingress, and
    # deliberately so. Its router carries the local-network-only middleware,
    # which sees a pod address for an in-cluster prober and answers 403 — so
    # the check reported DOWN continuously while grafana was perfectly
    # healthy. A row that is always red is one nobody reads.
    #
    # Port 3000, not 80: egress is evaluated after DNAT and the Service maps
    # 80 -> 3000.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 3000
    # Reach Traefik so checks can go through the real ingress path — the same
    # TLS termination and routing an external client hits — rather than
    # bypassing it via ClusterIP over plain HTTP.
    #
    # The ports are 8000/8443, NOT 80/443. NetworkPolicy egress is evaluated
    # against the post-DNAT destination, and Traefik's Service maps 80->8000 and
    # 443->8443, so a rule naming 80/443 never matches and every connection is
    # refused. That is why the existing `allow-egress-monitoring` rule
    # (0.0.0.0/0 on 80/443) does not cover it, and why reaching ntfy on 80 works
    # — that Service targets port 80, so the port is unchanged by DNAT.
    #
    # This is why Gatus previously could not check the public URLs at all, which
    # the config.yaml comment misattributed to the MetalLB VIP refusing pod
    # connections. Retested 2026-08-03: pod -> VIP works fine.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000 # traefik web entrypoint (Service port 80)
        - protocol: TCP
          port: 8443 # traefik websecure entrypoint (Service port 443)
