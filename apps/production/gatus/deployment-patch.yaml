# Inject the ntfy publish token (from the SOPS-encrypted gatus-alerting secret)
# as NTFY_TOKEN, which Gatus substitutes into ${NTFY_TOKEN} in its config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
spec:
  template:
    spec:
      containers:
        - name: gatus
          envFrom:
            - secretRef:
                name: gatus-alerting
          env:
            # Both substituted into the storage DSN in config.yaml. The username
            # comes from the Secret rather than being written into the DSN, so
            # the role name and its password cannot drift apart (#219).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: password
