metrics: true

# Persist check history across restarts (production). Connects as gatus' own
# role, which owns the gatus database and nothing else — it was the shared `app`
# role, which owns every database (#219).
#
# Both ${POSTGRES_USER} and ${POSTGRES_PASSWORD} are substituted by Gatus from
# the environment, the same mechanism ${NTFY_TOKEN} already uses below. The role
# name is injected rather than written literally here so it cannot drift from
# the password it is paired with.
storage:
  type: postgres
  path: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-cluster-rw.database.svc.cluster.local:5432/gatus?sslmode=disable"

ui:
  title: "Homelab Status"
  header: "Homelab Status"

# Alerts post into the Campfire #Gatus room as Argus, via the INTERNAL
# service — the external MetalLB VIP is not reliably reachable pod->VIP from
# inside the cluster (the same reason the ntfy address it replaced was internal).
#
# The `custom` provider rather than a dedicated one: Campfire has no Gatus
# integration, its bot endpoint takes the request body as the message, and
# `custom` is the only provider that lets the body be templated. That also means
# Gatus talks to Campfire directly — unlike Alertmanager and Flux, which have no
# body templating and go through campfire-alert-bridge to be formatted.
#
# ${CAMPFIRE_URL} carries the room and bot key and is injected from the SOPS
# gatus-alerting secret, the same mechanism ${NTFY_TOKEN} used. It must not be
# written literally here: config.yaml is a ConfigMap, and validate.sh fails on
# credentials outside a Secret (#321).
#
# The body is HTML because Campfire stores rich text and ignores newline
# characters — a plain-text body arrives as one run-on line. See
# docs/stack/applications/campfire.md.
alerting:
  custom:
    url: "${CAMPFIRE_URL}"
    method: "POST"
    headers:
      Content-Type: "text/html; charset=utf-8"
    body: "<strong>[ALERT_TRIGGERED_OR_RESOLVED] [ENDPOINT_NAME]</strong><ul><li>group: <code>[ENDPOINT_GROUP]</code></li><li>url: <code>[ENDPOINT_URL]</code></li></ul><pre>[RESULT_ERRORS]</pre>"
    placeholders:
      ALERT_TRIGGERED_OR_RESOLVED:
        TRIGGERED: "🚨 DOWN:"
        RESOLVED: "✅ RECOVERED:"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

# Every homelab service is checked at its real public URL, through Traefik and
# real TLS — the same path an external client takes. Each entry asserts both
# reachability and certificate validity, so one check covers the app being up
# AND the certificate being current.
#
# This replaces internal ClusterIP checks over plain HTTP. Those confirmed the
# app was running but never traversed TLS or the ingress, which is why
# commafeed and speedtest served certificates that had expired four months
# earlier while every check stayed green (2026-08-03).
#
# The previous comment here claimed "the MetalLB VIP refuses pod->VIP
# connections". That was wrong. Gatus could not reach Traefik because the
# NetworkPolicy allowed egress on ports 80/443 while Traefik's Service targets
# 8000/8443, and egress is evaluated post-DNAT. Fixed in the egress policy;
# pod -> VIP verified working.
#
# [STATUS] < 400 rather than == 200: several apps legitimately redirect to a
# login page (grafana, linkding, speedtest all return 302). Asserting < 400
# means "reached the app and it answered", which is the useful signal.
#
# 336h = 14 days. cert-manager renews at 30 days remaining, so crossing this
# means renewal has been failing for a fortnight.
endpoints:
  - name: commafeed
    group: homelab
    url: "https://commafeed.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: fizzy
    group: homelab
    url: "https://fizzy.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: homepage
    group: homelab
    url: "https://homepage.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: immich
    group: homelab
    url: "https://immich.ronaldlokers.nl/api/server/ping"
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: linkding
    group: homelab
    url: "https://linkding.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: mealie
    group: homelab
    url: "https://mealie.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: tandoor
    group: homelab
    url: "https://tandoor.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: nightscout
    group: homelab
    url: "https://nightscout.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: ntfy
    group: homelab
    url: "https://ntfy.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: speedtest
    group: homelab
    url: "https://speedtest.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  # Checked on its Service, not through the ingress. Grafana's router carries
  # the local-network-only middleware, which sees a pod address for an
  # in-cluster prober and answers 403 — so this row was red continuously while
  # grafana was healthy, which is worse than not checking it. The trade is
  # that the ingress path for grafana is not covered; the LAN gate itself is
  # what makes that untestable from here.
  - name: grafana
    group: homelab
    url: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
  - name: gatus
    group: homelab
    url: "https://gatus.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  # These carry the local-network-only middleware, so a request from a pod is
  # correctly refused with 403 — pod IPs are not inside the 10.0.0.0/16
  # allowlist. Asserting 403 still exercises DNS, TCP, TLS and Traefik routing,
  # so an expired or wrong certificate fails the check; it additionally proves
  # the LAN restriction is still in force.
  - name: longhorn
    group: homelab-lan-only
    url: "https://longhorn.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] == 403"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: pgadmin
    group: homelab-lan-only
    url: "https://pgadmin.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] == 403"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: prometheus
    group: homelab-lan-only
    url: "https://prometheus.ronaldlokers.nl"
    interval: 60s
    conditions:
      - "[STATUS] == 403"
      - "[CERTIFICATE_EXPIRATION] > 336h"
    alerts:
      - type: custom
  - name: lokilabs-healthz
    group: external
    url: "https://lokilabs.nl/api/healthz"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: custom
  - name: proxmox
    group: infrastructure
    # Checked at the backend host directly — the ingress VIP isn't reachable from
    # inside the cluster. Proxmox serves a self-signed cert, so skip TLS verify.
    url: "https://10.0.40.20:8006"
    interval: 60s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
