# Who the bots wake, when something is actually wrong.
#
# Not a password: a signed global id for a user, which Campfire mints with
# `User#attachable_sgid` and which lets the holder mention that user. It is
# encrypted because it identifies a person and because the room is not the
# place to leave it, not because possession is dangerous.
#
# It has no expiry — Rails mints attachable sgids without one — so it works
# until SECRET_KEY_BASE is rotated. That rotation invalidates every stored sgid
# at once and silently: the messages keep posting and stop notifying. If
# notifications go quiet after a Campfire upgrade, this is the first thing to
# check.
#
# Obtain a replacement with:
#   kubectl exec -n campfire deploy/campfire -c campfire -- \
#     bin/rails runner 'puts User.find(1).attachable_sgid'
apiVersion: v1
kind: Secret
metadata:
    name: campfire-mention
    namespace: campfire
type: Opaque
