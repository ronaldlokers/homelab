# Squirrel's Campfire bot key.
#
# This is the most sensitive thing in the campfire namespace: it can post as
# @squirrel into any room the bot can reach. It arrived with phase 2 — before
# the scheduler, every reply travelled inside the webhook's own HTTP response
# and this pod held no Campfire credential at all.
#
# Where it comes from: Campfire's own bot admin, on the Squirrel bot user. It
# is the same `bot_key` that appears in the webhook URL Campfire calls, which
# is why the room path in an inbound payload is treated as secret too.
#
# Paired with CAMPFIRE_BASE_URL in apps/base/squirrel/deployment.yaml. The
# binary rejects a key with no URL at boot but accepts a URL with no key, so
# the failure to watch for is the URL alone: Send stays nil and every digest,
# every reply and every 🐿️ receipt goes missing while captures keep landing.
#
# Rotating it: docs/runbooks/squirrel.md.
apiVersion: v1
kind: Secret
metadata:
    name: squirrel-campfire
    namespace: campfire
type: Opaque
stringData:
    CAMPFIRE_BOT_KEY: ENC[AES256_GCM,data:pv9/MJ0kJcS/z75UWxE=,iv:lVAQGJpq04bD9Xdo2f8ie6518B2tD9ofCbq90j8qzBo=,tag:eQHIjQChnF1v4/ntBvo+dQ==,type:str]
