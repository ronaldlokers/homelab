# The screen, and why it is a second Ingress rather than a second path on the
# first one.
#
# Traefik's middleware chain is set per router, and an Ingress is one router.
# The presence webhook must NOT go through authentik: Home Assistant is a
# machine holding a shared secret, not a browser holding a session, and a
# forward-auth in front of it would answer its POST with a login page forever.
# So /hooks/home keeps its own object and its own chain, and the screen gets
# this one.
#
# Order in the chain:
#
#   https-redirect — before anything travels over a plaintext hop
#   lan-or-tailnet — the address check, which is now the whole chain
#
# `authentik-forward-auth` was the third link until 25 August 2026. Squirrel
# runs the OIDC flow itself from v0.39.0 — it holds a session, sets a cookie
# and serves /auth — so a forward-auth in front of it would be a second login
# in front of the first.
#
# **The address check stays, and it is doing a different job now.** It used to
# be what made the identity header trustworthy: the header was a plain string
# squirrel believed completely, and what made that safe was that nothing but
# Traefik could open a socket to the pod. A session cookie needs no such
# arrangement — it is proof on its own. What the rule still buys is that the
# login page itself is not reachable from the internet, which is worth keeping
# for the same reason it always was: *.ronaldlokers.nl resolves to a private
# address, and widening this would be spending reachability on nothing.
#
# `lan-or-tailnet` rather than `local-network-only`, because the pile is the
# one thing here worth reading from a phone that is not at home. It is the
# wider of the two rules and this is where the widening is affordable: what it
# admits is the cluster's own pod network, and authentik still stands between
# that and the pile. See the middleware's own comment for why the tailnet's
# 100.64.0.0/10 does not appear in it.
#
# `pathType: Prefix` on / is one broad rule rather than an enumeration. The
# screen is at the root from v0.10.0 — home at /, the deck at /pile, the chores
# at /chores — and enumerating them would mean a change here for every new
# route, where forgetting one produces a 404 that looks like an application bug.
# Traefik routes on the longest matching prefix, so the narrower rules (the
# assets, the outpost, the presence hook) keep winning without this one having
# to know about them.
#
# /transports/campfire and /healthz are reachable through this rule and are no
# longer behind a forward-auth. Both are inside squirrel's own guard: an
# unauthenticated GET for a page redirects to /auth and everything else gets a
# 401 with no body. Campfire delivers in-cluster and never traverses this
# ingress, and the kubelet's probes are in-cluster too.
#
# /auth, /auth/in, /auth/callback and /auth/out are the four routes squirrel
# leaves outside its own guard, necessarily: somebody with no session has to be
# able to get one. They match this rule's prefix and need no object of their
# own.
#
# The object is still called squirrel-pile although it is now the whole screen.
# Renaming it would mean Flux deleting one router and creating another, and the
# name buys nothing worth a gap in the only route the screen has.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squirrel-pile
  namespace: campfire
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-lan-or-tailnet@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: squirrel.ronaldlokers.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: squirrel
                port:
                  number: 8080
  tls:
    - hosts:
        - squirrel.ronaldlokers.nl
