# The screen, and why it is a second Ingress rather than a second path on the
# first one.
#
# Traefik's middleware chain is set per router, and an Ingress is one router.
# The presence webhook must NOT go through authentik: Home Assistant is a
# machine holding a shared secret, not a browser holding a session, and a
# forward-auth in front of it would answer its POST with a login page forever.
# So /hooks/home keeps its own object and its own chain, and the screen gets
# this one.
#
# Order in the chain is the whole point:
#
#   https-redirect         — before anything reads a header off a plaintext hop
#   lan-or-tailnet         — the address check stays the outer layer, so a
#                            request from outside is refused before it can
#                            reach a login flow at all
#   authentik-forward-auth — then, and only then, who is this
#
# The ipAllowList first is not belt-and-braces. The identity arrives as a plain
# header that squirrel trusts completely, and what makes that safe is that
# nothing but Traefik can open a socket to the pod (campfire's
# allow-ingress-from-traefik is the entire ingress rule). Putting authentik in
# front of the address check would widen the surface to the internet for the
# sake of a login page that nobody outside can use anyway — and
# *.ronaldlokers.nl resolves to a private address, so they could not reach it
# regardless.
#
# `lan-or-tailnet` rather than `local-network-only`, because the pile is the
# one thing here worth reading from a phone that is not at home. It is the
# wider of the two rules and this is where the widening is affordable: what it
# admits is the cluster's own pod network, and authentik still stands between
# that and the pile. See the middleware's own comment for why the tailnet's
# 100.64.0.0/10 does not appear in it.
#
# `pathType: Prefix` on / is one broad rule rather than an enumeration. The
# screen is at the root from v0.10.0 — home at /, the deck at /pile, the chores
# at /chores — and enumerating them would mean a change here for every new
# route, where forgetting one produces a 404 that looks like an application bug.
# Traefik routes on the longest matching prefix, so the narrower rules (the
# assets, the outpost, the presence hook) keep winning without this one having
# to know about them.
#
# Two paths become reachable from outside that were not before:
# /transports/campfire and /healthz. Both now sit behind authentik, so an
# anonymous caller gets a login page rather than a webhook. Campfire delivers
# in-cluster and never traverses this ingress, and the kubelet's probes are
# in-cluster too, so nothing that depends on either changes.
#
# The object is still called squirrel-pile although it is now the whole screen.
# Renaming it would mean Flux deleting one router and creating another, and the
# name buys nothing worth a gap in the only route the screen has.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squirrel-pile
  namespace: campfire
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-lan-or-tailnet@kubernetescrd,kube-system-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: squirrel.ronaldlokers.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: squirrel
                port:
                  number: 8080
  tls:
    - hosts:
        - squirrel.ronaldlokers.nl
