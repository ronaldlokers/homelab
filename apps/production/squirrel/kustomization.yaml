apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/squirrel/
  - squirrel-campfire-secret.yaml
  # The Ingress is production-only because it carries a hostname. Staging has
  # no Home Assistant to report arrivals to it.
  - ingress.yaml
  # The screen's own router, so the presence webhook keeps a chain without
  # authentik in it — see the comment at the top of the file.
  - ingress-pile.yaml
  # The assets and the manifest, without the identity check — a browser fetches
  # both without cookies, so behind it an installed app has no icon at all.
  - ingress-assets.yaml
  # In the authentik namespace, because an Ingress backend is namespace-local.
  # It is the way back from the login redirect.
  - ingress-outpost.yaml
  # The shared secret Home Assistant sends. Separate from squirrel-campfire so
  # the two rotate independently — see the comments in the file. The Deployment
  # reads PRESENCE_SECRET with optional: true, so losing this Secret costs the
  # presence trigger and nothing else.
  - squirrel-presence-secret.yaml
  - squirrel-push-secret.yaml
  - squirrel-openai-secret.yaml

patches:
  - path: deployment-postgres-patch.yaml

  # Opt in to Reloader: roll this workload when a mounted Secret changes.
  # Without it a pg-role-squirrel rotation applies cleanly and the pod keeps
  # authenticating with the old password, because env is injected only at pod
  # creation. The failure is quiet — the drain defers, captures pile up on the
  # spool, and the room never notices. The same now goes for a bot-key
  # rotation, where the quiet failure is every receipt and every digest
  # stopping while captures carry on landing.
  - target:
      kind: Deployment
      name: squirrel
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: squirrel
        annotations:
          reloader.stakater.com/auto: "true"

  # The base PVC omits storageClassName, which would fall to the cluster
  # default. Production annotates two StorageClasses as default, so state it.
  - target:
      kind: PersistentVolumeClaim
      name: squirrel-spool
    patch: |
      - op: add
        path: /spec/storageClassName
        value: longhorn

  # The same, and for the same reason. Longhorn matters more here than for the
  # spool: a photograph exists nowhere but this volume, and local-path is not
  # backed up.
  - target:
      kind: PersistentVolumeClaim
      name: squirrel-photos
    patch: |
      - op: add
        path: /spec/storageClassName
        value: longhorn

# Squirrel is not a stringer workload and is versioned on its own cadence, so
# it is pinned here rather than by the shared stringer image tag below in
# apps/production/kustomization.yaml. Renovate reads this through its kustomize
# manager, against the registry: a tag only exists here once the multi-arch
# image is actually pushed, so a release whose build failed cannot be proposed.
images:
  - name: ghcr.io/ronaldlokers/squirrel
    newTag: v0.18.0
