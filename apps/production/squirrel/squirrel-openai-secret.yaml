# The OpenAI key the coach signs its requests with.
#
#   sops -d apps/production/squirrel/squirrel-openai-secret.yaml
#
# Kept apart from squirrel-campfire, squirrel-presence and squirrel-push rather
# than added as a key to one of them. Four credentials, four blast radii — the
# bot key can post as @squirrel into any room it can reach, the presence token
# can make the bot nudge me, the push key can put a notification on my phone,
# and this one can spend money. Rotating one should not roll the others.
#
# This one is different from the other three in a way worth writing down: it is
# the only credential here with a *financial* blast radius. A leak costs money
# rather than privacy or noise. Squirrel's own monthly budget counter is a
# backstop against its own bugs, not against a stolen key — the hard spend
# limit on the OpenAI project is what guards against everything else, and it is
# set.
#
# Project-scoped (sk-proj-), not a service-account key. It can reach one
# project's models and nothing else in the organisation, which is the whole of
# what the coach needs.
#
# The binary reads it as optional: with no key the coach is never built and the
# deterministic picker and ladder answer instead — the floor they were kept as.
# A gap between revoking and replacing costs the coach and nothing else.
#
# Reloader watches this: a rotation restarts the pod. Without that the pod would
# keep signing with the old key and every call would 401 with nothing in the
# room to say so.
