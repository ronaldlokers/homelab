# The stylesheet, the script, the fonts, the mark, the icons and the manifest —
# reachable without proving who you are.
#
# This exists because an installed app kept showing a letter tile instead of its
# icon. A browser fetches a manifest with credentials omitted, and it fetches
# the icons *named in that manifest* from the browser process rather than from
# the page — neither carries the Authentik cookie. Behind forward-auth both get
# a 302 and a page of login HTML, so Chrome has no icon it can use and falls
# back to the first letter of the app's name. Nothing logs, and the symptom
# points at the artwork.
#
# `crossorigin="use-credentials"` on the manifest link fixes the manifest fetch
# and is still there. It does not fix the icon fetches, which is why this
# route exists.
#
# What it gives away: a stylesheet, a script, two fonts, a squirrel and a JSON
# file naming them. No notes, no chores, no identity — the paths under here hold
# no user data at all, which is the whole reason this is acceptable rather than
# a hole. Everything that can read a note still goes through authentik.
#
# The worker is here too. It carries no notes — only which files to keep and
# what to say when the network is gone — and it is fetched by the browser
# process rather than by the page.
#
# `lan-or-tailnet` and the HTTPS redirect stay: this is reachable from the same
# places the screen is and nowhere else.
#
# `router.priority` is why these three win over the screen's `/`, and it is not
# the belt-and-braces it looks like. Traefik does not rank routers by how
# specific they are; it ranks them by the *length of the rule string*, and
# `PathPrefix(`/`)` is fifteen characters while `Path(`/sw.js`)` is fourteen. So
# the broad rule outranked the worker and Authentik answered it with a login
# page — while /static/ and /manifest.webmanifest happened to win because their
# names are long. A rule that is correct by the length of a path is a rule that
# breaks the next time someone adds a short one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squirrel-assets
  namespace: campfire
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-lan-or-tailnet@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: squirrel.ronaldlokers.nl
      http:
        paths:
          - path: /static/
            pathType: Prefix
            backend:
              service:
                name: squirrel
                port:
                  number: 8080
          - path: /manifest.webmanifest
            pathType: Exact
            backend:
              service:
                name: squirrel
                port:
                  number: 8080
          - path: /sw.js
            pathType: Exact
            backend:
              service:
                name: squirrel
                port:
                  number: 8080
  tls:
    - hosts:
        - squirrel.ronaldlokers.nl
