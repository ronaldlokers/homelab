# The VAPID private key Squirrel signs its Web Push tokens with.
#
# Read it back with
#
#   sops -d apps/production/squirrel/squirrel-push-secret.yaml
#
# The other two halves of this setting are NOT here and are not credentials:
# VAPID_PUBLIC_KEY is meant to be handed to every browser that subscribes, and
# PUSH_CONTACT is an address the push service is entitled to complain to. Both
# are plain values on the Deployment, the same reasoning WEB_IDENTITY carries.
#
# Kept apart from squirrel-presence and squirrel-campfire rather than added as
# a key to either. Three credentials with three blast radii — the bot key can
# post as @squirrel into any room it can reach, the presence token can make the
# bot nudge me, and this one can put a notification on my phone — and rotating
# one should not roll the others.
#
# Rotating this costs the subscriptions and nothing else: a browser whose
# server key has changed is refused by its push service, and every browser
# re-subscribes on its next visit to the screen. Nothing is lost, because
# nothing about a subscription is worth keeping.
#
# Reloader watches this: `reloader.stakater.com/auto` on the Deployment means a
# rotation restarts the pod. Without it the pod would keep signing with the old
# key and every push would be refused with nothing in the room to say so.
apiVersion: v1
kind: Secret
metadata:
    name: squirrel-push
    namespace: campfire
type: Opaque
