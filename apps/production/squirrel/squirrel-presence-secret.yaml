# The shared secret Home Assistant sends as X-Squirrel-Token when it reports
# that I have arrived home. Generated at random and never typed anywhere: read
# it back with
#
#   sops -d apps/production/squirrel/squirrel-presence-secret.yaml
#
# to paste into the Home Assistant automation, and see
# docs/runbooks/squirrel.md for the automation itself.
#
# Kept apart from squirrel-campfire rather than added as a second key to it.
# They are different credentials with different blast radii — the bot key can
# post as @squirrel into any room it can reach, this one can make the bot nudge
# me about a chore — and rotating one should not roll the other.
#
# Reloader watches this: `reloader.stakater.com/auto` on the Deployment means a
# rotation restarts the pod. Without that the pod would keep comparing against
# the old value and every ping would 403 with nothing in the room to say so.
apiVersion: v1
kind: Secret
metadata:
    name: squirrel-presence
    namespace: campfire
type: Opaque
stringData:
    PRESENCE_SECRET: ENC[AES256_GCM,data:ltmeR+R+uD6ZT9cICT5phZNt486R12XI5biDXL/IfrGrT7iOjkMzqXp+AdY=,iv:LusQsR0bvW7h99Dp8+K+oA3EEdozpYbQoPLAdJt6yt0=,tag:H7SGKxRvqteMGqs199xOag==,type:str]
