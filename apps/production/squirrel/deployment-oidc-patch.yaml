# The way in, now that Squirrel does its own authentication.
#
# From v0.39.0 the application runs the OIDC flow itself: it holds a session,
# sets a cookie and serves /auth. Before that Traefik called an Authentik
# forward-auth outpost and Squirrel compared one header to WEB_IDENTITY.
#
# A separate patch from deployment-postgres-patch.yaml because the two answer
# different questions and rotate on different days. This one is merged into the
# base env by name, so only these entries are added.
#
# **These values are per-cluster and that is why they are here rather than in
# the base.** The issuer and the redirect both carry a hostname, and staging's
# are its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squirrel
  namespace: campfire
spec:
  template:
    spec:
      containers:
        - name: squirrel
          env:
            # Authentik's issuer for this application. It must match what
            # authentik publishes byte for byte, trailing slash included — the
            # library compares the issuer it discovers against the one it was
            # given, and a mismatch is a boot that fails rather than a login
            # that half-works.
            - name: WEB_OIDC_ISSUER
              value: https://authentik.ronaldlokers.nl/application/o/squirrel/
            # Declared in the blueprint rather than generated by authentik, the
            # same as every other client here: letting authentik generate it
            # leaves the working value only in its database, so recreating it
            # breaks the client.
            - name: WEB_OIDC_CLIENT_ID
              value: squirrel
            - name: WEB_OIDC_REDIRECT_URL
              value: https://squirrel.ronaldlokers.nl/auth/callback
            # The group an account must be in. **Empty refuses the mount** —
            # the only setting on this pod that is dangerous to default,
            # because every other missing value costs a feature and this one
            # would cost the pile.
            #
            # It is bound on the application in authentik as well, and checked
            # again here against the id token's `groups` claim. Not two gates
            # for the sake of two: a misconfigured binding would otherwise hand
            # out piles silently.
            - name: WEB_REQUIRED_GROUP
              value: squirrel-users
            # My own OIDC subject, seeded so the first login lands on the
            # person who already owns this pile rather than making a second one
            # beside it.
            #
            # It is authentik's user *uuid* — not the username, and not the
            # integer primary key in the admin URL. The blueprint sets
            # `sub_mode: user_uuid` precisely so that this value is one that can
            # be read back rather than derived; authentik's default sub_mode is
            # hashed_user_id, which appears nowhere.
            #
            # Read it back with:
            #
            #   kubectl --context=production -n authentik exec deploy/authentik-server -- \
            #     ak shell -c "from authentik.core.models import User; \
            #     print(User.objects.get(username='"'"'ronaldlokers'"'"').uuid)"
            #
            # Not a credential — it is an identifier, like the username it
            # replaced — so it is a plain value here rather than a Secret.
            #
            # Getting it wrong is not an error: it is a successful login onto
            # an empty pile, with every note still in the database belonging to
            # somebody who can no longer sign in. Nothing is lost, and the fix
            # is this value plus the next login.
            - name: WEB_OIDC_SUB
              value: 46afd51d-5880-48b8-bdde-cad8b2b54f9d
            # NOT optional, unlike every other credential on this pod. The
            # others degrade to less product — no push, no coach, no presence
            # hook. A missing client secret would leave a screen nobody can
            # sign into, so the binary refuses to boot instead, and this
            # secretKeyRef is what makes that refusal happen at the right
            # moment.
            - name: WEB_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: squirrel-oidc
                  key: WEB_OIDC_CLIENT_SECRET
            # What anybody who is not the owner may spend on the coach in a
            # month. Small on purpose: a demo account exists to be tried, not
            # lived in, and two of them must not be two monthly allowances.
            #
            # The owner's own ceiling is COACH_BUDGET_EUR, which is unset here
            # and defaults to ten.
            - name: COACH_BUDGET_GUEST_EUR
              value: "1"
