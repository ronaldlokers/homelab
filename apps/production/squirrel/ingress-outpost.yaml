# The half of forward auth that is easy to leave out.
#
# When authentik does not recognise a caller it answers Traefik with a redirect
# to its own login, and the way back is /outpost.goauthentik.io/ **on the
# protected host** — not on authentik.ronaldlokers.nl. Without this object the
# screen redirects to a path that 404s, which looks like the middleware being
# broken rather than a missing route.
#
# It lives in the authentik namespace because an Ingress can only name backends
# in its own namespace, and the backend here is authentik-server. It lives in
# *this directory* because squirrel is the only reason it exists: a second
# forward-auth host later needs its own copy, and deleting squirrel should take
# this with it.
#
# No forward-auth middleware on this one, for the obvious reason: authenticating
# the route that exists to authenticate is a loop. It keeps the LAN check and
# the HTTPS redirect, so the login flow is reachable from exactly where the
# screen is.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squirrel-outpost
  namespace: authentik
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd,kube-system-local-network-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: squirrel.ronaldlokers.nl
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
  tls:
    - hosts:
        - squirrel.ronaldlokers.nl
