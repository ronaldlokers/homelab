# One room and bot key per source, each a whole credential: anyone holding one
# of these URLs can post to that room. In-cluster addresses, so the bridge never
# leaves the cluster to reach Campfire and needs no internet egress.
#
# Note that shared rooms default to involvement "mentions"
# (Room#default_involvement) and a bot mentions nobody, so BOTH ROOMS ONLY
# NOTIFY BECAUSE THEIR INVOLVEMENT WAS SET TO "everything" BY HAND. Recreating a
# room resets that and its messages go quiet with nothing in the logs to say so.
# See docs/stack/applications/campfire.md.
#
# Rotating a key (account settings -> the bot -> regenerate) requires updating
# the matching value here; Reloader rolls the pod when it changes.
apiVersion: v1
kind: Secret
metadata:
    name: campfire-alert-bridge
    namespace: campfire
type: Opaque
