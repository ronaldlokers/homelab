# The room and bot key together are the credential: anyone holding this URL can
# post to that room. In-cluster address, so the bridge never leaves the cluster
# to reach Campfire and needs no internet egress.
#
# Room 2 is the shared #Alertmanager room. Note that shared rooms default to
# involvement "mentions" (Room#default_involvement) and a bot mentions nobody,
# so THIS ROOM ONLY NOTIFIES BECAUSE ITS INVOLVEMENT WAS SET TO "everything" BY
# HAND. Recreating the room resets that and alerts go quiet with nothing in the
# logs to say so. Direct rooms default to "everything" and need no setting —
# that is the trade being made here for a shared, searchable room.
#
# Rotating the key (account settings -> the bot -> regenerate) requires
# updating this value; Reloader rolls the pod when it changes.
