# The room and bot key together are the credential: anyone holding this URL can
# post to that room. In-cluster address, so the bridge never leaves the cluster
# to reach Campfire and needs no internet egress.
#
# Room 3 is the DIRECT room between Ronald and the Alertmanager bot, not the
# shared #Alertmanager room. Direct rooms default to involvement "everything"
# (Rooms::Direct#default_involvement), while open and closed rooms default to
# "mentions" — and a bot mentions nobody, so alerts in a shared room push only
# after someone flips that setting by hand, and silently stop pushing if the
# room is ever recreated. The direct payload also titles the notification with
# the sender rather than repeating it in the body.
#
# Rotating the key (account settings -> the bot -> regenerate) requires
# updating this value; Reloader rolls the pod when it changes.
apiVersion: v1
kind: Secret
metadata:
    name: campfire-alert-bridge
    namespace: campfire
type: Opaque
