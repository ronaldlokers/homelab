# linkding's own PostgreSQL role (#219).
#
# Was the shared `app` role, which owns every database — so this Secret used to
# be a credential valid against all of them, including Nightscout's glucose
# store. It now reaches the linkding database and nothing else.
#
# The role is declared in the cluster's managed.roles and its password lives in
# pg-role-linkding in the database namespace; this is the app-side copy, because
# Secrets are namespace-scoped.
#
# Migration procedure: docs/runbooks/postgres-per-app-role-migration.md
