apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mealie
resources:
- postgres-credentials-secret.yaml
- ../../base/mealie/
- pvc.yaml
- ingress.yaml
- network-policy-homepage.yaml
- mealie-oidc-secret.yaml
- network-policy-oidc.yaml
patches:
# Opt in to Reloader: roll this workload when a Secret it reads changes.
# Without it a SOPS secret rotation applies cleanly and the pod keeps serving
# the old value, because env and envFrom are injected only at pod creation.
- target:
    kind: Deployment
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: placeholder
      annotations:
        reloader.stakater.com/auto: "true"
- path: deployment-postgres-patch.yaml
