# Let homepage's dashboard widget read the recipe statistics.
#
# Additive: this namespace already denies ingress by default and names
# traefik, gatus and prometheus explicitly, so one more source opens nothing
# that was previously closed to everyone. The failure mode to avoid is the
# opposite one — adding a first policy to a namespace that had none, which is
# what took the ingress down when it was done to traefik.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-homepage-ingress
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
      ports:
        - protocol: TCP
          port: 9000
