# Egress to authentik for the server-side half of OIDC: discovery and the
# token exchange. Without it the login fails after authentik has said yes.
#
# The MetalLB VIP is rewritten to a Traefik pod before egress rules are
# evaluated, so this names Traefik on 8443 rather than the VIP (#293).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oidc-egress
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443
