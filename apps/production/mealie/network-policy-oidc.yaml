# Egress to authentik, for the half of OIDC the browser never touches.
#
# The login redirect happens in the user's browser and needs nothing from this
# policy. Mealie itself then fetches the discovery document and exchanges the
# authorization code for a token, server to server, against authentik's public
# URL — which resolves to the cluster's own ingress address:
#
#   authentik.ronaldlokers.nl -> 10.0.40.100
#
# That address is inside 10.0.0.0/8, which allow-internet-egress excludes on
# purpose as an SSRF guard. Without this rule the login fails at the token
# exchange, after authentik has already said yes, and the error appears on
# Mealie's side pointing away from the cause.
#
# Unlike staging, production actually enforces NetworkPolicy (#282), so this
# is load-bearing here rather than documentation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oidc-egress
  namespace: mealie
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.40.100/32
      ports:
        - protocol: TCP
          port: 443
