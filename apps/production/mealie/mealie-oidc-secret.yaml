# Mealie's OIDC client credentials.
#
# These MUST match apps/production/authentik/blueprints.yaml, which declares
# the same pair on the authentik side. Declaring them in both places rather
# than letting authentik generate them is what makes authentik rebuildable
# without breaking this application.
#
# Changing them is a two-step operation: the Secret changes, and then the
# Deployment has to be restarted by hand, because envFrom does not restart
# pods when the Secret behind it changes (#281).
