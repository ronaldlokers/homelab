apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.22.0
          # OIDC via authentik (#270). Non-secret settings are here so they are
          # readable; the client id and secret come from the SOPS-encrypted
          # mealie-oidc Secret, and are declared on the authentik side too so
          # that rebuilding authentik does not invalidate them.
          #
          # The provider is reached over HTTPS at its public hostname rather
          # than a cluster-internal Service, because the issuer in the token
          # must match the issuer Mealie validates against, and the browser
          # necessarily sees the public one. That path needs
          # network-policy-oidc.yaml, which production enforces for real.
          envFrom:
            - secretRef:
                name: mealie-oidc
          env:
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: "https://authentik.ronaldlokers.nl/application/o/mealie-production/.well-known/openid-configuration"
            - name: OIDC_PROVIDER_NAME
              value: "authentik"
            # authentik decides who reaches the app at all, so first-login
            # account creation adds no exposure.
            - name: OIDC_SIGNUP_ENABLED
              value: "true"

            # /login?direct=1 still renders, but without password fields.
            - name: OIDC_AUTO_REDIRECT
              value: "true"
            # Hides the fields; does not disable password auth in the API
            # (#295). BREAK-GLASS if authentik is down:
            #   kubectl set env deploy/mealie -n mealie ALLOW_PASSWORD_LOGIN=true
            # Flux reverts it on the next reconcile.
            - name: ALLOW_PASSWORD_LOGIN
              value: "false"
            # authentik's email mapping hardcodes email_verified false and
            # Mealie refuses the login without it. Relaxed here rather than in
            # the mapping, which would assert the claim to every client.
            #
            # REVISIT IF SELF-ENROLMENT IS ENABLED: unverified addresses plus
            # email matching is an account-takeover path.
            - name: OIDC_REQUIRES_EMAIL_VERIFICATION
              value: "false"
            - name: DB_ENGINE
              value: "postgres"
            - name: POSTGRES_SERVER
              value: "postgres-cluster-rw.database.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "mealie"
            # Was the shared `app` role. Taken from the Secret so the role name
            # and its password can never drift apart (#219).
            # pg-role-mealie is mirrored here from the database namespace by
            # reflector, so this is the same object CNPG reconciles the role
            # against rather than a copy that can drift (#268).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pg-role-mealie
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-role-mealie
                  key: password
            - name: BASE_URL
              value: "https://mealie.ronaldlokers.nl"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: ALLOW_SIGNUP
              value: "false"
            - name: PUID
              value: "911"
            - name: PGID
              value: "911"
          volumeMounts:
            - name: mealie-data
              mountPath: "/app/data"
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-data
