apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  # Two replicas: cloudflared is stateless and each opens its own connections to
  # the Cloudflare edge, giving HA for the public ntfy/immich path.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Two replicas are only redundancy if they are on different nodes.
      # Nothing enforced that: they currently sit on kube-srv-2 and
      # kube-srv-3 by scheduler luck, and both could equally land together,
      # at which point one node failure takes the internet path down
      # entirely despite replicas: 2.
      #
      # maxSkew 1 over 3 nodes with 2 replicas is always satisfiable, and
      # remains so with one node cordoned.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            # Token-based (remotely-managed) tunnel: cloudflared reads the tunnel
            # token from TUNNEL_TOKEN. Public hostname routing lives in the
            # Cloudflare Zero Trust dashboard (ntfy/immich -> internal services).
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
