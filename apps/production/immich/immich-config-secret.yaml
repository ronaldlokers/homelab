# Immich's system configuration, in git rather than in its database.
#
# Immich normally keeps these settings in a database table edited through the
# admin UI. Setting IMMICH_CONFIG_FILE moves the source of truth here, which
# is what makes the OAuth client survive a rebuild — the coupling in #268,
# where a recreated database silently invalidated a credential, is exactly
# what this avoids.
#
# The trade is that the admin settings page becomes read-only. Anything not
# named in this file falls back to immich's defaults, so a setting changed in
# the UI before this landed must be added here or it is silently reverted.
# storageTemplate was the only one.
#
# A Secret rather than a ConfigMap because the OAuth client secret is in it.
apiVersion: v1
kind: Secret
metadata:
    name: immich-config
    namespace: immich
type: Opaque
