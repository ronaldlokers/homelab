# Immich's credential for immich-cluster's `app` role.
#
# This is a namespace-local copy of CloudNativePG's generated password, because
# Secrets are namespace-scoped and the cluster's own secret lives in `database`.
#
# It MUST be re-copied whenever immich-cluster is recreated. CNPG generates a
# fresh password on cluster creation, and a physical restore does not bring the
# old one back — the restored pg_authid holds the password from the backup while
# the new immich-cluster-app Secret holds a different one, and CNPG reconciles
# the role to match its Secret. Shrinking this cluster's storage 50Gi -> 20Gi
# (#260) required exactly that delete-and-restore, and this copy was missed:
#
#   PostgresError: password authentication failed for user "app"
#
# Immich returned 500 on login for about four hours. Nothing caught it because
# the pods stayed Running with an established connection pool and the database
# itself verified fine — the failure only appears when a new connection is
# opened, which is the same shape as the streaming_replica break the same night.
apiVersion: v1
kind: Secret
metadata:
    name: postgres-app-credentials
    namespace: immich
type: Opaque
