# Credentials for the shared CloudNativePG `app` role.
#
# The value is CNPG's own generated password from the immich-cluster-app Secret in
# the database namespace. Secrets are namespace-scoped, so each consumer needs
# its own copy; this is that copy, not a second credential.
#
# Until #166 the cluster's pg_hba said `host all app all trust`, so every app
# connected with an empty password and any pod that could reach port 5432
# authenticated as `app` against every database. These credentials are
# distributed first, while trust is still in effect and therefore ignores them,
# so that flipping pg_hba to scram-sha-256 is a no-downtime change rather than a
# simultaneous break-and-fix.
#
# If the immich-cluster-app Secret is ever regenerated, every copy has to be
# updated with it.
