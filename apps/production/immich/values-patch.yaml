apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chart:
    spec:
      version: "0.10.3"
  values:
    persistence:
      config:
        enabled: true
        type: secret
        name: immich-config
        advancedMounts:
          main:
            main:
              - path: /config
                readOnly: true

    controllers:
      main:
        containers:
          main:
            env:
              # Move the source of truth for immich's settings out of its
              # database and into git. The admin settings page becomes
              # read-only as a result.
              IMMICH_CONFIG_FILE:
                value: /config/immich.json
            image:
              tag: v2.3.1
            # Measured: 3m CPU, 414Mi memory at rest. 4Gi was a 10x
            # over-reservation; 50m CPU made hpa.yaml's 50% target scale out at 25m,
            # which nominal load crosses. At 200m the threshold is 100m. No limits,
            # so a lower memory request cannot cause an OOM — it only changes
            # scheduling and eviction ranking.
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
    server:
      ingress:
        main:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: kube-system-https-redirect@kubernetescrd
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
          hosts:
            - host: immich.ronaldlokers.nl
              paths:
                - path: /
                  pathType: Prefix
                  service:
                    identifier: main
                    port: 2283
            # Private-only host under the *.private.ronaldlokers.nl zone: resolves
            # to the VIP (private DNS wildcard), never proxied through Cloudflare
            # Tunnel, so it's reachable over LAN/tailnet with no 100MB upload cap.
            # Point the Immich app here for uploading large videos; keep
            # immich.ronaldlokers.nl (public via the tunnel) for sharing/viewing.
            - host: immich.private.ronaldlokers.nl
              paths:
                - path: /
                  pathType: Prefix
                  service:
                    identifier: main
                    port: 2283
          tls:
            - hosts:
                - immich.ronaldlokers.nl
                - immich.private.ronaldlokers.nl
    machine-learning:
      persistence:
        cache:
          storageClass: longhorn
          accessMode: ReadWriteMany
      # Measured: 3m CPU, 238Mi memory at rest. Kept at 2Gi rather than 1Gi
      # because model loading spikes well above idle; there are no limits, so
      # this is a scheduling floor, not a cap.
      resources:
        requests:
          cpu: 200m
          memory: 2Gi
