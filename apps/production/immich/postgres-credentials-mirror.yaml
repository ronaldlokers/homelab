# Pulls the CNPG-generated credential into this namespace rather than keeping a
# copy of it (#268).
#
# Declared here, on the target, instead of annotating the source: CNPG's
# inheritedMetadata applies to every Secret it creates, which also mirrored
# immich-cluster-superuser into this namespace.
apiVersion: v1
kind: Secret
metadata:
  name: immich-cluster-app
  namespace: immich
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "database/immich-cluster-app"
type: Opaque
