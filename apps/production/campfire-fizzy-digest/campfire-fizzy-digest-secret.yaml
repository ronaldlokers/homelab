# A Fizzy personal access token, read-only in practice: the digest lists cards
# and never writes one.
#
# This is the durable home the Homelab board's own card #28 asked for. It lived
# in a chat transcript, which meant the next session had nothing to read it
# from — and a board that cannot be read is a board that stops being used.
#
# Generated in Fizzy under profile → API. Rotate by generating a new one there
# and re-encrypting this file; the old token stops working when it is revoked.
