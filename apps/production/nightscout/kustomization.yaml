apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nightscout
resources:
- ../../base/nightscout/
- nightscout-env-secret.yaml
- ferretdb-url-secret.yaml
- ingress.yaml

images:
- name: nightscout/cgm-remote-monitor
  newTag: 15.0.7
- name: ghcr.io/ferretdb/ferretdb
  newTag: 2.7.0
patches:
- path: deployment-patch.yaml
- path: ferretdb-deployment-patch.yaml
# Opt in to Reloader: roll this workload when a mounted ConfigMap or Secret
# changes. Without it a SOPS secret rotation applies cleanly and the pod keeps
# serving the old value, because env/envFrom are injected only at pod creation.
- target:
    kind: Deployment
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: placeholder
      annotations:
        reloader.stakater.com/auto: "true"
