# FerretDB's connection to nightscout-cluster — the PostgreSQL cluster that
# exists solely for Nightscout, which backs the DocumentDB extension Nightscout
# talks to as MongoDB.
#
# Was the SHARED postgres-cluster, whose `postgres` database held the glucose
# data alongside every other application's reach. DocumentDB can only live in
# the one database named by cron.database_name, so a per-app database was never
# possible there — a dedicated cluster was the only way to isolate it (#249).
#
# The password is nightscout-cluster's own `app` role. That cluster is
# single-tenant, so `app` there is isolated by construction. CNPG generates the
# password as alphanumeric only, so it needs no percent-encoding here.
#
# The MongoDB database name stays `postgres`, because that is where DocumentDB
# lives in the new cluster too — so Nightscout's MONGODB_URI is unchanged.
