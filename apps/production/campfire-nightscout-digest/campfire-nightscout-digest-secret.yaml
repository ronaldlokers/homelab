# Two credentials for the daily glucose digest.
#
# CAMPFIRE_URL is the bot endpoint for the private #Health room, with the room
# and bot key embedded, so the whole value is the credential.
#
# It belongs to a **dedicated Health bot**, not the Kubernetes one. The
# Kubernetes bot holds an Anthropic API key, reads pod logs and can ask the
# actor to change the cluster; none of that should be the identity that
# publishes health data, and it is no longer a member of that room.
#
# NIGHTSCOUT_API_SECRET_SHA1 is what the API expects in its `api-secret`
# header. It is the SHA1 of Nightscout's API_SECRET, and it is stored rather
# than the plaintext on purpose: the hash opens the API, but it cannot be typed
# into the Nightscout login form, so this job cannot be used to sign in as
# admin. That is a mitigation, not a fix — the API access it grants is still
# read *and write*.
#
# The fix is a Nightscout subject with the `readable` role: create one in admin
# and swap this value for its token, changing nothing else. See the digest
# script, which sends whichever it is given.
apiVersion: v1
kind: Secret
metadata:
    name: campfire-nightscout-digest
    namespace: campfire
type: Opaque
stringData:
    CAMPFIRE_URL: ENC[AES256_GCM,data:vsb6cmqsCITbo21xbpm4Mbz9njVVnW2/Wf8kILCQq/kD0HuwJXS8+Bb+SrYPNDEPomHmztuh9aF3AMEwrzGE9dxEUkVXdsC85nk=,iv:b1leAWwbesbGB0bp2VwqJzHmEt+yms64a9JEjCzNcto=,tag:eBd19KUh+qt2Q2eZcpGtuw==,type:str]
