apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandoor
spec:
  template:
    spec:
      containers:
        - name: tandoor
          image: ghcr.io/tandoorrecipes/recipes:2.6.13
          env:
            - name: POSTGRES_HOST
              value: "postgres-cluster-rw.database.svc.cluster.local"
            - name: POSTGRES_DB
              value: "tandoor"
            # localhost is required: the probes send Host: localhost, and Django
            # rejects anything not listed here with 400 DisallowedHost.
            - name: ALLOWED_HOSTS
              # The service name is here for homepage's widget, which calls
              # the API in-cluster. Django answers 400 DisallowedHost for any
              # Host not listed — not 404, not 403 — so a missing entry reads
              # as a broken URL rather than a rejected hostname.
              value: "tandoor.ronaldlokers.nl,tandoor.tandoor.svc.cluster.local,localhost"
