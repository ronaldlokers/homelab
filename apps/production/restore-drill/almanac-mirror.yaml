# The mirror, not the source. Reflector fills in the payload from
# campfire/campfire-almanac; nothing here carries the room URL, so there is no
# second copy of the credential to drift — the same arrangement netpol-check
# used for its ntfy password (#268).
apiVersion: v1
kind: Secret
metadata:
  name: campfire-almanac
  namespace: database
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: campfire/campfire-almanac
type: Opaque
