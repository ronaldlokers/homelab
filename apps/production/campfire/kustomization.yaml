apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: campfire
resources:
  - ../../base/campfire/
  - campfire-secrets.yaml
  - ingress.yaml

# On `main` rather than a release, for basecamp/once-campfire#239 — bots can
# update and destroy their own messages. Merged 2026-08-11; v1.4.9 was cut on
# 2026-08-04, so no tag carries it yet.
#
# That route is the whole reason the alert bridge can replace a firing message
# when the alert resolves instead of appending a second one, which is what made
# this room an append-only log exactly like the ntfy topic it replaced.
#
# The digest is the pin and the tag is documentation — same shape as fizzy. A
# floating `main` would move the image with no commit and no review; this way
# Renovate proposes each move as a PR.
#
# Back to a release when one includes #239: set newTag and drop the digest.
# A fork, and squirrel's buttons are the only reason. `feat/bot-message-actions`
# adds interactive actions on bot messages and PATCH on a bot's own message;
# neither is upstream. Built by pushing a tag on the fork — the publish workflow
# triggers on `v*` and reads itself from the pushed ref, so the branch never has
# to be merged to the fork's main and rebasing on upstream stays clean.
#
# Rolling back is putting the two lines below back. Squirrel needs no rollback
# of its own: a message with buttons is sent as JSON, upstream rejects it, and
# the transport retries the same text as plain text. See
# docs/runbooks/squirrel.md.
#
# The standing cost is rebasing — upstream's security fixes now arrive through
# the fork.
images:
  - name: ghcr.io/basecamp/once-campfire
    newName: ghcr.io/ronaldlokers/once-campfire
    newTag: v0.0.0-actions
    digest: sha256:3a0912ae4f783340418373f24462eeedebd8438da16eef8311b55b743819c8ad

patches:
  # Opt in to Reloader: roll this workload when a mounted ConfigMap or Secret
  # changes. Without it a SOPS secret rotation applies cleanly and the pod keeps
  # serving the old value, because env/envFrom are injected only at pod creation.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          reloader.stakater.com/auto: "true"
  # The base PVC omits storageClassName, which would fall to the cluster
  # default. Production annotates two StorageClasses as default, so state it.
  - patch: |
      - op: add
        path: /spec/storageClassName
        value: longhorn
    target:
      kind: PersistentVolumeClaim
      name: campfire-data
