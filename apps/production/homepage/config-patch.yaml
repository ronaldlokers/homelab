apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
data:
  services.yaml: |
    # No siteMonitor entries here, deliberately. It probes from this pod, and
    # https://*.ronaldlokers.nl resolves to the MetalLB VIP, which is not
    # reachable pod -> VIP from inside the cluster — the same constraint gatus
    # documents in its own egress policy. Probing the in-cluster Services
    # instead would mean opening homepage's egress to a further port on each
    # app, to duplicate what gatus already checks through the real ingress
    # path. Gatus is the status page; this is the launcher.
    # authentik's own application library is the app switcher: it lists every
    # application the signed-in user may reach and links straight into each,
    # so it stays correct as clients are added rather than needing a second
    # list maintained here.
    - Identity:
        - Authentik:
            icon: authentik.png
            href: https://authentik.ronaldlokers.nl/if/user/#/library
            description: Single sign-on — switch between apps
            widget:
              type: authentik
              # The Service publishes 80 and forwards to 9000; this is the
              # Service port, while the NetworkPolicy names 9000. They are the
              # same hop seen from either side of DNAT.
              url: http://authentik-server.authentik.svc.cluster.local
              key: "{{HOMEPAGE_VAR_AUTHENTIK_KEY}}"

    - Bookmarks:
        - Linkding:
            icon: linkding.png
            href: https://linkding.ronaldlokers.nl
            description: Bookmark manager

    - Media:
        - Commafeed:
            icon: commafeed.png
            href: https://commafeed.ronaldlokers.nl
            description: RSS feed reader
        - Immich:
            icon: immich.png
            href: https://immich.ronaldlokers.nl
            description: Photo management
            widget:
              type: immich
              url: http://immich-server.immich.svc.cluster.local:2283
              key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
              version: 2

    - Food:
        - Mealie:
            icon: mealie.png
            href: https://mealie.ronaldlokers.nl
            description: Recipe manager
            widget:
              type: mealie
              url: http://mealie.mealie.svc.cluster.local:9000
              key: "{{HOMEPAGE_VAR_MEALIE_KEY}}"
        - Tandoor:
            icon: tandoor-recipes.png
            href: https://tandoor.ronaldlokers.nl
            description: Recipe manager
            # No widget yet. Tandoor 2.x authenticates the API with
            # SessionAuthentication and OAuth2Authentication only —
            # TokenAuthentication is not in DEFAULT_AUTHENTICATION_CLASSES, so
            # the authtoken_token table it still carries is a leftover and a
            # row written there authenticates nothing.
            #
            # A working token has to be issued through Tandoor's own UI, which
            # mints an OAuth2 access token. Re-enable by restoring these four
            # lines with HOMEPAGE_VAR_TANDOOR_KEY set to it:
            #
            #   widget:
            #     type: tandoor
            #     url: http://tandoor.tandoor.svc.cluster.local
            #     key: "{{HOMEPAGE_VAR_TANDOOR_KEY}}"

    - Health:
        - Nightscout:
            icon: nightscout.png
            href: https://nightscout.ronaldlokers.nl
            description: CGM remote monitoring
    - DevOps:
        - Grafana:
            icon: grafana.png
            href: https://grafana.ronaldlokers.nl
            description: Metrics and dashboards
            widget:
              type: grafana
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
              username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.ronaldlokers.nl
            description: Metrics collection and storage
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        - Traefik:
            icon: traefik.png
            # No href: traefik has no ingress of its own and its dashboard is
            # off, so there is nothing to link to. The widget is the point.
            description: Ingress controller
            widget:
              type: traefik
              # Read-only API, ClusterIP only, reachable from this namespace
              # alone. Port 8080 on both sides here — Traefik's documented
              # default of 9000 is not what this build listens on.
              url: http://traefik.kube-system.svc.cluster.local:8080
        - Gatus:
            icon: gatus.png
            href: https://gatus.ronaldlokers.nl
            description: Uptime monitoring
            widget:
              type: gatus
              url: http://gatus.gatus.svc.cluster.local:8080
        - Ntfy:
            icon: ntfy.png
            href: https://ntfy.ronaldlokers.nl
            description: Push notifications
            widget:
              type: ntfy
              url: http://ntfy.ntfy.svc.cluster.local
              # A topic is required: without one the widget requests the web UI
              # root and tries to parse the HTML as JSON. ntfy denies anonymous
              # reads on every topic, so this reads as its own account —
              # read-only on this one topic, unable to publish.
              topic: homelab-gatus
              username: homepage
              password: "{{HOMEPAGE_VAR_NTFY_PASSWORD}}"
        - Speedtest:
            icon: speedtest-tracker.png
            href: https://speedtest.ronaldlokers.nl
            description: Network speed test
            widget:
              type: speedtest
              url: http://speedtest.speedtest.svc.cluster.local
              version: 1
        - Flux:
            icon: flux-cd.png
            href: https://fluxcd.io/
            description: GitOps continuous delivery

    - Infrastructure:
        - Proxmox:
            icon: proxmox.png
            href: https://proxmox.ronaldlokers.nl
            node: gandalf
            description: Virtualization platform
            widget:
              type: proxmox
              url: https://proxmox.external-services.svc.cluster.local:8006
              username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"
        - TrueNAS:
            icon: truenas.png
            href: https://truenas.ronaldlokers.nl
            description: Network-attached storage
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.ronaldlokers.nl
            description: Distributed block storage
        - pgAdmin:
            icon: pgadmin.png
            href: https://pgadmin.ronaldlokers.nl
            description: PostgreSQL admin
        - Mikrotik:
            icon: mikrotik.png
            href: https://10.0.1.1
            description: Mikrotik Router
            widget:
              type: mikrotik
              url: https://10.0.1.1
              username: "{{HOMEPAGE_VAR_MIKROTIK_USERNAME}}"
              password: "{{HOMEPAGE_VAR_MIKROTIK_PASSWORD}}"
  proxmox.yaml: |
    - gandalf:
        url: https://proxmox.external-services.svc.cluster.local:8006
        token: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
        secret: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"
