apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
data:
  services.yaml: |
    # No siteMonitor: it probes from this pod, and the MetalLB VIP is not
    # reachable pod -> VIP. Gatus covers this through the real ingress path.
    # authentik's application library doubles as the app switcher.
    - Identity:
        - Authentik:
            icon: authentik.png
            href: https://authentik.ronaldlokers.nl/if/user/#/library
            description: Single sign-on — switch between apps
            widget:
              type: authentik
              # Service port 80; the NetworkPolicy names 9000, post-DNAT.
              url: http://authentik-server.authentik.svc.cluster.local
              key: "{{HOMEPAGE_VAR_AUTHENTIK_KEY}}"
              # v1 calls /events/events/per_month/, which this build 404s.
              version: 2

    - Bookmarks:
        - Linkding:
            icon: linkding.png
            href: https://linkding.ronaldlokers.nl
            description: Bookmark manager

    # No widget: homepage ships none for SearXNG, and its /stats page is HTML
    # rather than an API. A plain link needs no NetworkPolicy, since the browser
    # navigates rather than this pod.
    - Search:
        - SearXNG:
            icon: searxng.png
            href: https://searxng.ronaldlokers.nl
            description: Metasearch — the search box above uses it

    - Media:
        - Commafeed:
            icon: commafeed.png
            href: https://commafeed.ronaldlokers.nl
            description: RSS feed reader
        - Immich:
            icon: immich.png
            href: https://immich.ronaldlokers.nl
            description: Photo management
            widget:
              type: immich
              url: http://immich-server.immich.svc.cluster.local:2283
              key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
              version: 2

    - Food:
        - Tandoor:
            icon: tandoor-recipes.png
            href: https://tandoor.ronaldlokers.nl
            description: Recipe manager
            widget:
              type: tandoor
              url: http://tandoor.tandoor.svc.cluster.local
              key: "{{HOMEPAGE_VAR_TANDOOR_KEY}}"

    - Health:
        - Nightscout:
            icon: nightscout.png
            href: https://nightscout.ronaldlokers.nl
            description: CGM remote monitoring

    # Both are Basecamp apps and neither has an entry in dashboard-icons, so
    # these use Material Design icons instead. `basecamp.png` exists and would
    # have been the obvious choice for both — which is exactly why it is not
    # used: two identical icons side by side identify nothing.
    #
    # No widgets: homepage ships none for either, and neither exposes a metrics
    # endpoint one could be built from. Plain links need no NetworkPolicy,
    # since the browser navigates rather than this pod.
    - Collaboration:
        - Campfire:
            icon: mdi-campfire-#f97316
            href: https://campfire.ronaldlokers.nl
            description: Chat — alerts, deploys and Houston
        - Fizzy:
            icon: mdi-view-column-#22c55e
            href: https://fizzy.ronaldlokers.nl
            description: Kanban — what is wanted and why it was deferred

    - DevOps:
        - Grafana:
            icon: grafana.png
            href: https://grafana.ronaldlokers.nl
            description: Metrics and dashboards
            widget:
              type: grafana
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
              username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.ronaldlokers.nl
            description: Metrics collection and storage
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        - Traefik:
            icon: traefik.png
            # No href: traefik has no ingress and its dashboard is off.
            description: Ingress controller
            widget:
              type: traefik
              # Port 8080, not the documented 9000, on both sides.
              url: http://traefik.kube-system.svc.cluster.local:8080
        - Gatus:
            icon: gatus.png
            href: https://gatus.ronaldlokers.nl
            description: Uptime monitoring
            widget:
              type: gatus
              url: http://gatus.gatus.svc.cluster.local:8080
        - Ntfy:
            icon: ntfy.png
            href: https://ntfy.ronaldlokers.nl
            description: Push notifications
            widget:
              type: ntfy
              url: http://ntfy.ntfy.svc.cluster.local
              # Without a topic the widget parses the web UI as JSON. ntfy
              # denies anonymous reads, hence its own read-only account.
              topic: homelab-gatus
              username: homepage
              password: "{{HOMEPAGE_VAR_NTFY_PASSWORD}}"
        - Speedtest:
            icon: speedtest-tracker.png
            href: https://speedtest.ronaldlokers.nl
            description: Network speed test
            widget:
              type: speedtest
              url: http://speedtest.speedtest.svc.cluster.local
              version: 1
        - Flux:
            icon: flux-cd.png
            href: https://fluxcd.io/
            description: GitOps continuous delivery

    - Infrastructure:
        - Proxmox:
            icon: proxmox.png
            href: https://proxmox.ronaldlokers.nl
            node: gandalf
            description: Virtualization platform
            widget:
              type: proxmox
              url: https://proxmox.external-services.svc.cluster.local:8006
              username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"
        - TrueNAS:
            icon: truenas.png
            href: https://truenas.ronaldlokers.nl
            description: Network-attached storage
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.ronaldlokers.nl
            description: Distributed block storage
        - pgAdmin:
            icon: pgadmin.png
            href: https://pgadmin.ronaldlokers.nl
            description: PostgreSQL admin
        - Mikrotik:
            icon: mikrotik.png
            href: https://10.0.1.1
            description: Mikrotik Router
            widget:
              type: mikrotik
              url: https://10.0.1.1
              username: "{{HOMEPAGE_VAR_MIKROTIK_USERNAME}}"
              password: "{{HOMEPAGE_VAR_MIKROTIK_PASSWORD}}"
  proxmox.yaml: |
    - gandalf:
        url: https://proxmox.external-services.svc.cluster.local:8006
        token: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
        secret: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"
