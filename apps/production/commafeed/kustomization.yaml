apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: commafeed
resources:
  - ../../base/commafeed/
  - ingress.yaml
patches:
  # Opt in to Reloader: roll this workload when a Secret it reads changes.
  # Without it a SOPS secret rotation applies cleanly and the pod keeps serving
  # the old value, because env and envFrom are injected only at pod creation.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          reloader.stakater.com/auto: "true"
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: commafeed
  # The base PVC omits storageClassName, which would fall to the cluster
  # default. Production annotates two StorageClasses as default, so state it.
  - patch: |
      - op: add
        path: /spec/storageClassName
        value: longhorn
    target:
      kind: PersistentVolumeClaim
      name: commafeed-data

images:
  - name: athou/commafeed
    newTag: 7.3.2-postgresql
