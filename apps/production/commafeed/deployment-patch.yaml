apiVersion: apps/v1
kind: Deployment
metadata:
  name: commafeed
spec:
  template:
    spec:
      containers:
        - name: commafeed
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://postgres-cluster-rw.database.svc.cluster.local/commafeed"
            # Was the shared `app` role. Taken from the Secret so the role name
            # and its password can never drift apart (#219).
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pg-role-commafeed
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-role-commafeed
                  key: password
