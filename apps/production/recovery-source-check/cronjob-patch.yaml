# Production reaches the bridge in-cluster rather than back through its own
# ingress. No CLUSTER label — this is the cluster that owns the room.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recovery-source-check
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: check
              env:
                - name: CHECK_BRIDGE_URL
                  value: "http://campfire-alert-bridge.campfire.svc.cluster.local:8080/check"
