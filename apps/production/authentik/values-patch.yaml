apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  values:
    # Nothing under `authentik:` — existingSecret makes the chart ignore it.
    # Reloader and the blueprint mounts live in the base release, because both
    # clusters want them identically.
    #
    # The chart exposes no metrics by default, and the
    # `release: kube-prometheus-stack` label is what makes Prometheus select
    # the ServiceMonitor — without it the object exists and is ignored.
    #
    # Two servers, one worker: a login blocks on the server.
    server:
      replicas: 2
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack

    worker:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack
