apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  values:
    # Nothing under `authentik:` — existingSecret makes the chart ignore it.
    # Reloader and the blueprint mounts live in the base release, because both
    # clusters want them identically.
    #
    # The chart exposes no metrics by default, and the
    # `release: kube-prometheus-stack` label is what makes Prometheus select
    # the ServiceMonitor — without it the object exists and is ignored.
    #
    # Two servers, one worker: a login blocks on the server.
    server:
      replicas: 2
      # 768Mi, up from the base's 512Mi, because production's servers do not
      # fit in 512Mi and never did: peak working set over seven days is 790Mi,
      # and they sit at 550-640Mi idle. Under-requesting does not throttle
      # anything — there are no limits here — it lies to the scheduler, which
      # then packs a node as though authentik needed half of what it takes.
      #
      # Only production. Staging's server peaks around 437Mi with nobody using
      # it, so it keeps the base request.
      resources:
        requests:
          memory: 768Mi
      # Two replicas with nothing protecting them is one replica with extra
      # steps: a node drain can evict both at once, and every application
      # behind SSO stops accepting logins for as long as the reschedule takes.
      # The chart already sets soft pod anti-affinity, so they land on separate
      # nodes; what it does not do is tell the eviction API to take them one at
      # a time. maxUnavailable rather than minAvailable so this keeps meaning
      # the same thing if the replica count changes.
      pdb:
        enabled: true
        maxUnavailable: 1
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack

    worker:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          labels:
            release: kube-prometheus-stack
