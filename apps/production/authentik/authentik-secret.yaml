# authentik's entire configuration, not just its secrets.
#
# The chart's existingSecret does not merge with values: setting it makes the
# chart emit a single envFrom and nothing else, so anything left under
# `authentik:` in the HelmRelease is silently ignored. On staging that meant
# the database host fell back to 127.0.0.1 and authentik retried forever
# against a port nothing was listening on.
#
# The non-secret values are therefore here too. They are documented in
# apps/base/authentik/release.yaml, since they cannot be read from git once
# encrypted.
