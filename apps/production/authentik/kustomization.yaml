apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Without this the namespace-less resources in the base land in `default` and
# the HelmRelease is rejected by the API server — a failure that neither
# `kustomize build` nor validate.sh can see, because both are happy with a
# manifest that has no namespace.
namespace: authentik
resources:
  - ../../base/authentik
  - authentik-secret.yaml
  - blueprints.yaml
  - ingress.yaml
patches:
  # Opt in to Reloader: roll this workload when a Secret it reads changes.
  # Without it a SOPS secret rotation applies cleanly and the pod keeps serving
  # the old value, because env and envFrom are injected only at pod creation.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: placeholder
        annotations:
          reloader.stakater.com/auto: "true"
  - path: values-patch.yaml
    target:
      kind: HelmRelease
      name: authentik
