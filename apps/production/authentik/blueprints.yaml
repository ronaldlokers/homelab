# authentik's OIDC clients, declared rather than clicked or curl'd.
#
# A Secret rather than a ConfigMap because it declares client_id and
# client_secret. Letting authentik generate those leaves the working values
# only in its database, so recreating it breaks every client at once. Declared
# here, authentik can be rebuilt from nothing and the applications keep working.
#
# Tandoor is deliberately absent: staging has it, production does not yet.
apiVersion: v1
kind: Secret
metadata:
    name: authentik-blueprints
    namespace: authentik
type: Opaque
